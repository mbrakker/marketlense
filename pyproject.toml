[project]
name = "market-lense"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "cache",
  "logs",
  "out",
  "state",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m \"not integration\""
markers = [
  "integration: marks tests that call live external systems and are excluded from default runs.",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
