text: |
  Configured identity evidence (authorized values only):
  {{ configured_identity_json }}

  Required form fields and their visible, non-placeholder options:
  {{ required_options_json }}

  Return JSON with exactly these string fields:
  - field_label: the exact required field label from the visible-options map
