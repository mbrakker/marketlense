text: |
  Evaluate candidate crops on a single PDF page image.

  Phase: {{ phase | default("single_pass") }}
  - In `coarse` phase: find the full visual (chart/table/infographic) with safe surrounding margin.
  - In `finalize` phase: if `proposed_bbox` is provided, only adjust edges to avoid clipped letters/words/axis labels/title/legend and remove tiny accidental fragments.

  Coordinate system:
  - PDF points
  - page_width={{ page_width }}
  - page_height={{ page_height }}

  Return STRICT JSON:
  {
    "results": [
      {
        "id": "candidate-id",
        "is_valid_candidate": true,
        "refined_bbox": [x0, y0, x1, y1],
        "include_title": true,
        "include_note_if_present": true,
        "confidence": 0.0-1.0,
        "reason": "short reason"
      }
    ]
  }

  Rules:
  - Keep only true tables/infographics with meaningful data.
  - Reject low/no-data or decorative visuals.
  - Refined bbox must not include unrelated text blocks.
  - Never cut through letters/words/lines. If an edge intersects text, expand to include the full text line/block.
  - Include axis labels, legend, title, and source/note when attached to the visual.
  - Add a small safety margin around kept content (about 2-4% of box size) unless that would include clearly unrelated blocks.
  - If uncertain, reject.

  [CANDIDATES]
  {{ candidates_json }}
  [CANDIDATES END]
