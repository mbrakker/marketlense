text: |
  Evaluate candidate crops on one PDF page.

  Phase {{ phase | default("single_pass") }}:
  - coarse: find each complete data visual (chart/table/infographic) with safe margins.
  - finalize: adjust proposed_bbox edges only; retain complete text, labels, title and legend; remove accidental fragments.

  Coordinates: displayed PDF points, top-left origin, +x right and +y down, after crop-box and rotation. The page image, candidate boxes and refined_bbox share this frame.
  - page_width={{ page_width }}
  - page_height={{ page_height }}

  Return STRICT JSON:
  {
    "results": [
      {
        "id": "candidate-id",
        "is_valid_candidate": true,
        "refined_bbox": [x0, y0, x1, y1],
        "include_title": true,
        "include_note_if_present": true,
        "confidence": 0.0-1.0,
        "reason": "short reason"
      }
    ]
  }

  Rules:
  - Keep meaningful data-bearing charts/tables/infographics; reject decorative or low/no-data visuals.
  - refined_bbox excludes unrelated text and never cuts through letters, words or lines; expand edges to retain complete text.
  - Include attached axis labels, legend, title and source/note.
  - Add a 2-4% safety margin unless it includes unrelated content. If uncertain, reject.

  [CANDIDATES]
  {{ candidates_json }}
  [CANDIDATES END]
