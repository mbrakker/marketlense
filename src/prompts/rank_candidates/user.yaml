text: |
  Task: select the strongest chart/table candidates for final HTML.
  Prioritize high data density, clear metrics, and insightfulness.
  Reject decorative, low-data, or likely-fragment visuals.
  Use quality_signals and features when scoring:
  - ocr_density: extracted text characters per one percent of page area
  - visual_entropy: normalized rendered-crop entropy
  - chart_confidence/table_confidence: deterministic extraction confidence

  Return STRICT JSON:
  {
    "results": [
      {
        "id": "chart-0-1",
        "type": "chart|table",
        "score": 0-100,
        "quality_score": 0-100,
        "insight_score": 0-100,
        "data_score": 0-100,
        "keep": true,
        "reject_reason": ""
      }
    ]
  }
  No extra keys or commentary.

  [CANDIDATES]
  {{ candidates_json }}
  [CANDIDATES END]
