text: |
  Cross-report synthesis input JSON:

  Request:
  {{ request_json }}

  Selected theme:
  {{ selected_theme_json }}

  Selected sources:
  {{ selected_sources_json }}

  Signal scores:
  {{ signal_scores_json }}

  Evidence agreement and uncertainty groups:
  {{ evidence_groups_json }}

  Evidence references:
  {{ evidence_json }}

  Raw metric appendix:
  {{ raw_metrics_json }}

  Generation policy:
  {{ generation_policy_json }}

  Task:
  - Produce a concise, analytical, thesis-led consulting article for senior
    decision makers in the topic's industry.
  - Return exactly two non-empty `executive_takeaways`.
  - Include supported convergences, divergences, source notes, and raw metrics.
  - Use executive-facing section headings. Favor sections such as the strategic
    thesis, where sources converge, where they diverge, what the pattern implies,
    and what the evidence cannot yet prove.
  - Cite provided evidence ids for every claim.
  - Use raw_metric_ids only for exact metric_id values present in Raw metric
    appendix; use an empty list when none apply.
  - Do not infer missing provenance.
  - Do not use or request full report text.
