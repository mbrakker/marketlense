includes:
  - "report_vs/artifacts/_partials/editorial_constitution.yaml"
schema_snippets:
  insights_candidates_schema:
    schema: "artifacts.schema.json"
    pointer: "/properties/insights_candidates/items"
text: |
  Context:
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}
  - Editorial plan JSON: {{ editorial_plan_json }}

  Evidence identity rules:
  - For numeric claims, prefer a finding ID. Use a quote ID only if its exact
    text states the value, subject, and period/status. Never use a DocMap ID as
    numeric evidence.
  - Keep each value's role (level, change, forecast, or cumulative) and bind it
    to its metric, population, geography, period, and any stated denominator.
    Leave unclear bindings empty.

  Source-of-truth candidate insight schema:
  {{ insights_candidates_schema }}

  Task: Return a JSON object with `insights_candidates` as an array of 6-8 grounded items. Each item must include:
  - id: stable identifier
  - text: concise sentence capturing the data-backed insight
  - evidence_id: exactly one existing evidence ID from the provided context.
    Do not output arrays or comma-separated IDs; if uncertain, use an empty string.
  - evidence: short supporting quote/number
  - metric: object with fields {label, value, unit, trend, timeframe, geography, segment, sample_size, confidence} (empty strings allowed but keep present)
  - pages: page numbers if available
  - score, decision_relevance_score, metric_strength_score, novelty_score: numeric scores from 0-1
  - coverage_role: one of market_context, behavior_shift, strategic_risk, operating_implication, investment_signal, proof_point, counter_signal
  - so_what: specific MarketLense interpretation of why the insight matters;
    it may extend beyond source wording if non-contradictory
  - now_what: specific, conditional MarketLense decision, question, or action;
    do not present it as source advice or promise an outcome
  - report_type_lens: one of market_size, consumer_behavior, technology_shift, channel_strategy, brand_strategy, investment_outlook, risk_regulation, operations, creative_culture
  In `so_what` and `now_what`, avoid repeating numbers and ranked-group labels
  from `text`; omit counts absent from the linked evidence.
  Use the plan for coherence, not ranking. Prefer specific commercial outcomes
  and directional changes from source sections, including qualitative
  relationships, over section descriptions. Preserve exact values/comparisons.
  Make both fields audience-specific, non-generic, and non-contradictory; add
  no factual premise. Use numbers only when linked finding evidence or the
  exact quote states value, subject, and period/status. A paraphrased finding
  alone is not numeric evidence; otherwise omit the number.
  For each metric, `metric.value` must contain one complete human-readable primary metric or one coherent comparison/range. When `metric.value` is present, `metric.label` is required: make it a concise human-readable description of that exact source-backed metric (for example, `Digital video revenue growth`, `Monthly U.S. adult generative AI users`, or `Global eCommerce sales`), never a general insight or search statement. Never put a semicolon-separated metric list in `metric.value`. `metric.unit` must represent one semantic unit and must not repeat currency symbols or magnitude words already contained in `metric.value`. Keep supporting numbers in `text` and `evidence`, not in the public metric display.
  When the retained evidence supplies them, preserve the exact numeric binding in `metric.subject`, `metric.cohort`, `metric.denominator`, and `metric.observation_status` (`observed`, `forecast`, or `estimate`). Leave a field empty rather than inferring it.
