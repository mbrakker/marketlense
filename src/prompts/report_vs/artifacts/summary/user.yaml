includes:
  - "report_vs/artifacts/_partials/editorial_constitution.yaml"
schema_snippets:
  summary_schema:
    schema: "artifacts.schema.json"
    pointer: "/properties/summary"
text: |
  Context:
  - Editorial plan JSON: {{ editorial_plan_json }}
  - Evidence packs JSON: {{ evidence_json }}
  - DocMap JSON: {{ doc_map_json }}

  Source-of-truth summary schema:
  {{ summary_schema }}

  Task: Return a JSON object with the `summary` and private `claim_provenance` fields:
  {
    "summary": {
      "tldr": "<one complete sentence, target 20-30 words, maximum 45 words>",
      "card_tldr_compact": "<one complete sentence, maximum 18 words>",
      "executive_summary": "<5-7 sentence executive summary grounded in evidence: lead with the answer, quantify the most important result or comparison when present, state an executive implication only when supported, then name the main caveat or limitation when present>",
      "claim_evidence_map": [
        {"claim": "<concise claim>", "evidence_id": "<single existing evidence id from findings/quotes/doc map>", "evidence": "<supporting excerpt or paraphrase>", "pages": [<page numbers if known>]}
      ]
    },
    "claim_provenance": [
      {"claim": "<material sentence quoted from tldr, card_tldr_compact, or executive_summary>", "classification": "factual|interpretive|recommendation", "evidence_ids": ["<existing evidence id>"]}
    ]
  }
  `claim_provenance` is retained metadata only: cover every material sentence or claim from the public summary fields with one object per sentence or consecutive sentence group, quoting the covered text as your claim; minor punctuation differences are resolved mechanically. Use exact existing IDs, and never place IDs in public prose. A factual claim must have at least one evidence ID.
  - Keep claims specific and tied to evidence identifiers present in the provided context.
  - Lead executive_summary from a finding tied to the priority-one theme, preserving exact bindings. If absent, use the strongest supported evidence for that theme, including a direct quote; stay descriptive without a complete numeric binding. Bind the lead in claim map and provenance.
  - Follow the editorial plan's report thesis and themes; do not introduce a competing thematic frame.
  - Facts must stay within evidence. Non-contradictory interpretation may explain why a finding matters; advice may be conditional MarketLense guidance tied to it. Add no new factual premise, promised outcome, or false source attribution.
  - Numbers require linked finding evidence or a direct quote candidate to show and support the value and subject. Paraphrased finding text alone is insufficient; omit unsupported numbers and map the source.
  - State that a dataset represents or comes from a specific population only when retained evidence explicitly identifies that population as the dataset's subjects. A report topic, data owner, or section title does not establish the population. When the population is not explicit, describe what the data are used to discuss or measure instead of who they represent.
  - Classify source-derived factual statements as factual and MarketLense-authored recommendations as recommendation; never present a recommendation as a source claim.
  - Both TLDRs are report-level leads and must share the most material supported finding. Prefer a decision-useful metric and avoid section descriptions when stronger evidence exists. If findings are empty, use a directly supported DocMap point; priority is selection guidance, not evidence. Abstain if unsupported.
  - Include no more than one caveat, and only when the evidence explicitly supports it.
  - Author both TLDRs independently from the same evidence. The compact TLDR must not be a clipped prefix of the standard TLDR.
  - Target 20-30 words for `tldr` (hard limit: 45). Use one simple complete sentence and exactly one terminal punctuation mark; never use an ellipsis or attach a second topic to fill space.
  - The compact TLDR must be a complete direct source-backed claim of 18 words or fewer and must also appear as a claim_evidence_map claim. Include its direct supporting evidence in that map entry. If the source does not support a short complete claim, do not shorten or invent one; allow deterministic summary abstention.
  - End each TLDR with complete sentence punctuation. Never use an ellipsis.
  - Write direct public prose throughout the executive summary; do not emit labels such as "Answer:" or "Implication:".
  - evidence_id must be one ID only (no arrays or comma-separated values); if uncertain, use an empty string.
  - A claim containing a number, magnitude, superlative, requirement, or forecast must cite a direct `findings` or `quote_candidates` ID. Use a DocMap section ID only for descriptive, non-quantitative context; otherwise omit or soften the claim.
  - Keep each executive-summary sentence and each `claim_evidence_map` item to one proposition supported by its linked evidence ID. Do not combine unrelated sections or topics in one sentence or map item. Use a section summary only for a descriptive statement about that section, not to assert what is central to the full report.
  - Preserve per-group versus across-group scope exactly as stated in linked evidence.
  - Keep the claim_evidence_map brief (3-5 items).
