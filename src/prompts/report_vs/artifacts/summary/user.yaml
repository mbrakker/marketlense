includes:
  - "report_vs/artifacts/_partials/editorial_constitution.yaml"
schema_snippets:
  summary_schema:
    schema: "artifacts.schema.json"
    pointer: "/properties/summary"
text: |
  Context:
  - Editorial plan JSON: {{ editorial_plan_json }}
  - Selected lead insight JSON: {{ selected_lead_insight_json }}
  {% if verified_mode|default(false) %}
  - Accepted final insights JSON: {{ selected_final_insights_json }}
  {% endif %}
  - Evidence packs JSON: {{ evidence_json }}
  - DocMap JSON: {{ doc_map_json }}

  Source-of-truth summary schema:
  {{ summary_schema }}

  {% if verified_mode|default(false) %}
  Verified summary factual boundary: use `selected_final_insights_json` as the factual selection boundary. Use the canonical verified evidence packs only to substantiate those accepted findings; do not introduce an unselected factual finding merely because it appears elsewhere in the evidence packs. Each quantitative or empirical summary sentence must develop one clearly source-bound proposition. Do not combine distinct findings into an apparent causal, comparative, or numerical relationship unless that relationship is explicitly supported by its authoritative evidence. Preserve source scope, population, timeframe, denominator, and forecast/observation status. If two findings cannot be expressed as one supported relationship, put them in separate sentences. Do not invent a connecting statistic or implied comparison to improve narrative flow.
  {% endif %}

  Task: Return a JSON object with the `summary` and private `claim_provenance` fields:
  {
    "summary": {
      "tldr": "<one complete sentence, target 20-30 words, maximum 45 words>",
      "card_tldr_compact": "<one complete sentence, maximum 18 words>",
      "executive_summary": "<5-7 sentences grounded in evidence: open with the strongest direct finding and preserve its complete metric relationship when available; state only supported implications and caveats>",
      "claim_evidence_map": [
        {"claim": "<non-empty claim string>", "evidence_id": "<single existing evidence id from findings/quotes/doc map>", "evidence": "<supporting excerpt or paraphrase>", "pages": [<page numbers if known>]}
      ]
    },
    "claim_provenance": [
      {"claim": "<material sentence quoted from tldr, card_tldr_compact, or executive_summary>", "classification": "factual|interpretive|recommendation", "evidence_ids": ["<existing evidence id>"]}
    ]
  }
  `claim_provenance` is retained metadata only. Bind each distinct material sentence in `tldr`, `card_tldr_compact`, and `executive_summary` once. Copy each `claim` verbatim from the public sentence, including punctuation; do not combine or paraphrase sentences or omit any. Use exact existing IDs, keep IDs out of public prose, and give every factual binding at least one evidence ID.
  - Keep claims specific and tied to evidence identifiers present in the provided context.
  - If selected lead insight JSON is present, lead both TLDRs and the opening
    executive_summary sentence with it. Preserve its subject, relationship,
    values, period, and evidence ID; do not substitute an introductory
    statistic or recommendation. If absent, use the strongest direct finding
    or abstain when none is supportable.
  - Use the plan only for coherence. Priority order or section summaries do not prove cross-section links or report-wide centrality.
  - Facts must stay within evidence. Non-contradictory interpretation may explain why a finding matters; advice may be conditional MarketLense guidance tied to it. Add no new factual premise, promised outcome, or false source attribution.
  - A numeric claim must preserve each exact source value, metric/category,
    subject, denominator, direction, and period as one linked relationship;
    another value in the excerpt does not support reassignment. Split claims
    from separate IDs; DocMap cannot fill gaps.
  - State dataset population or methodology only when linked evidence says so; keep its wording and date range exact. Do not add qualifiers such as "primarily" or extend a performance-chart period to report coverage. A report topic or data owner does not establish population or coverage.
  - Classify source-derived factual statements as factual and MarketLense-authored recommendations as recommendation; never present a recommendation as a source claim.
  - Never round exact source values or replace explicit periods with relative
    timeframes. DocMap and the plan guide context, not evidence.
  - Include at most one concise caveat or limitations disclosure; it may consolidate multiple materially relevant, source-supported limitations, but omit immaterial or unsupported caveats.
  - Author both TLDRs independently from the same evidence. The compact TLDR must not be a clipped prefix of the standard TLDR.
  - Target 20-30 words for `tldr` (hard limit: 45). Use one simple complete sentence and exactly one terminal punctuation mark; never use an ellipsis or attach a second topic to fill space.
  - The compact TLDR must be a complete direct source-backed claim of 18 words or fewer and must also appear as a claim_evidence_map claim. Include its direct supporting evidence in that map entry. If the source does not support a short complete claim, do not shorten or invent one; allow deterministic summary abstention.
  - End each TLDR with complete sentence punctuation. Never use an ellipsis.
  - Write direct public prose throughout the executive summary; do not emit labels such as "Answer:" or "Implication:".
  - evidence_id must be one ID only (no arrays or comma-separated values); if uncertain, use an empty string.
  - A claim containing a number, magnitude, superlative, requirement, or forecast must cite a direct `findings` or `quote_candidates` ID. Use a DocMap section ID only for descriptive, non-quantitative context; otherwise omit or soften the claim.
  - Keep each executive-summary sentence and each `claim_evidence_map` item to one proposition supported by its linked evidence ID. Do not combine unrelated sections or topics in one sentence or map item. Use a section summary only for a descriptive statement about that section, not to assert what is central to the full report.
  - Preserve per-group versus across-group scope exactly as stated in linked evidence.
  {% if verified_mode|default(false) %}
  - Include enough `claim_evidence_map` entries to cover the distinct factual propositions in the summary; do not add unnecessary entries for purely interpretive statements.
  {% else %}
  - Keep 3-5 claim-map items.
  {% endif %}
