text: |
  Context:
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}

  Task: Return a JSON object with the `summary` field:
  {
    "summary": {
      "tldr": "<one-sentence TLDR>",
      "executive_summary": "<5-7 sentence executive summary grounded in evidence, include key conclusions and insights>",
      "claim_evidence_map": [
        {"claim": "<concise claim>", "evidence_id": "<single existing evidence id from findings/quotes/doc map>", "evidence": "<supporting excerpt or paraphrase>", "pages": [<page numbers if known>]}
      ]
    }
  }
  - Keep claims specific and tied to evidence identifiers present in the provided context.
  - evidence_id must be one ID only (no arrays or comma-separated values); if uncertain, use an empty string.
  - Keep the claim_evidence_map brief (3-5 items).
