includes:
  - "report_vs/artifacts/_partials/editorial_constitution.yaml"
schema_snippets:
  insights_final_schema:
    schema: "artifacts.schema.json"
    pointer: "/properties/insights_final/items"
text: |
  Context:
  - Candidate insights JSON: {{ insights_candidates_json }}
  {% if current_insights_final_json|default("") %}
  - Current final insights JSON: {{ current_insights_final_json }}
  {% endif %}
  {% if semantic_theme_targeted_insight_ids_json|default("") %}
  - Exact final insight IDs authorized for localized semantic repair: {{ semantic_theme_targeted_insight_ids_json }}
  - Current wording for those affected insights: {{ semantic_theme_targeted_insights_json|default("[]") }}
  {% endif %}
  {% if semantic_theme_repair_scope_json|default("") %}
  - Authoritative localized repair scope JSON: {{ semantic_theme_repair_scope_json }}
  - Exact IDs permitted in the patch: {{ semantic_theme_allowed_patch_ids_json|default("[]") }}
  This is a scoped patch, not a complete roster response. Return only corrected entries for authorized existing IDs and/or newly authored entries for explicitly authorized addition IDs. Do not echo, reorder, delete, or mutate unaffected final insights. Preserve each patched entry's stable ID and exact primary evidence binding; use only evidence IDs authorized by the repair scope. An empty or unchanged patch is not a successful correction.
  {% endif %}
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}
  - Editorial plan JSON: {{ editorial_plan_json }}

  Source-of-truth final insight schema:
  {{ insights_final_schema }}

  {% if semantic_theme_repair_scope_json|default("") %}
  Scoped semantic repair scope JSON: {{ semantic_theme_repair_scope_json }}
  Exact stable IDs permitted in this patch: {{ semantic_theme_allowed_patch_ids_json|default("[]") }}
  Independent semantic theme-coverage feedback JSON: {{ semantic_theme_coverage_feedback_json|default("{}") }}
  {% if semantic_theme_focal_facts_json|default("") %}
  Focal verified-fact repair context JSON: {{ semantic_theme_focal_facts_json }}
  Reconstruct the exact material proposition identified by each focal fact. The focal fact statement, complete metric, qualifiers, primary evidence ID, and authorized candidate IDs are the authoritative repair context; do not replace them with a topic summary or a nearby source fact. Put the factual proposition in `text`, including every material comparison, direction, population, denominator, period, forecast/observation status, and limitation required by the focal gap. Keep `so_what` interpretive and `now_what` conditional; do not hide a missing factual clause in either field.
  {% endif %}
  This is a scoped patch, not a complete roster response. Return a non-empty, substantive patch containing only corrected entries for authorized existing IDs and/or explicitly authorized addition IDs. Preserve every unchanged final insight exactly: do not echo, reorder, delete, or mutate unaffected entries. Use only the exact stable IDs and authoritative evidence bindings supplied in the scope and candidate alternatives. Address only the supplied scoped theme gaps. Do not apply full-roster selection, minimum-count, or unrelated-theme requirements. An empty or unchanged patch is not a successful correction.
  {% else %}
  {% if verified_editorial_obligations_json|default("") %}
  Executable verified editorial obligations JSON: {{ verified_editorial_obligations_json }}
  In verified full generation, treat `verified_editorial_obligations_json` as the authoritative checklist and make a complete source-backed proposition the primary writing objective, not merely correct candidate selection. Treat every essential obligation as a required proposition to develop. Select only its exact feasible admitted candidate IDs, use the listed authoritative evidence IDs, and preserve the complete source-backed relationships, comparisons, direction, scope, timeframe, qualifiers, counter-signals, and limitations represented by the bound verified facts. The factual proposition belongs in `text`: do not leave a material clause only in `so_what`, `now_what`, or `metric_public_copy`. Keep `so_what` as interpretation, `now_what` as a conditional implication, and `metric_public_copy` as reader-facing wording for the exact retained metric tuple. Do not emit generic trend, topic-only, or source-ID-only text, and do not mistake selecting the correct `evidence_id` for adequately writing the source proposition. If one concise insight cannot faithfully develop an obligation, use an additional distinct admitted candidate-backed insight rather than dropping a material relationship. Keep the language natural, analytical, and commercially useful. A theme is not covered by a topic mention or source-ID selection alone. Themes may share an insight only when that wording genuinely develops both obligations; do not force one insight per theme or add redundant filler.
  Before returning JSON, privately self-check every selected entry against its authoritative obligation: are all essential propositions and material admitted facts meaningfully represented, does `text` actually state each claimed finding and preserve every comparison and qualifier, is the primary `evidence_id` exact and non-empty, do protected metric fields remain source-supported, and does no interpretation or public metric copy introduce a missing fact?
  {% endif %}
  {% if semantic_theme_coverage_feedback_json|default("") %}
  Independent semantic theme-coverage feedback JSON: {{ semantic_theme_coverage_feedback_json }}
  Revise the full final roster to address the supported planned-theme failure in that feedback. For an essential theme, make at least one final insight substantively develop the full intended proposition, including its material sub-clauses, using only the supplied canonical fact(s); a generic mention or narrow restatement is insufficient. Treat the omitted-theme list as a hard acceptance checklist for essential themes, while an optional theme may remain merged or omitted only when the independent feedback explicitly supports that resolution and the article remains complete. Keep the exact stable IDs and authoritative evidence bindings; change only the editorial wording or select another admitted candidate when it better develops the intended theme. If the theme is supported by multiple supplied facts, an exact primary-first `evidence_ids` array may combine those facts. Do not add facts, metrics, evidence IDs, or insights outside the supplied candidate set.
  {% endif %}
  Minimum final insight target: {{ final_insight_target_count }}. This is a minimum target, not a maximum, when additional admitted insights are needed to develop distinct essential obligations.

  {% if verified_mode|default(false) %}
  Verified authority selection contract: select only from the exact stable candidate IDs in this allowlist:
  {{ final_insight_allowed_candidate_ids_json|default("[]") }}
  Copy each selected stable `id` verbatim from that allowlist. The stable `id` identifies the candidate; it is distinct from the factual `evidence_id`. Do not create, alter, or substitute either identifier.
  {% endif %}

  Task: {% if verified_mode|default(false) %}Select at least {{ final_insight_target_count }} strongest, non-overlapping insights, and stop only when every essential theme is substantively developed and any additional insight is nonredundant and source-supported. {% else %}Choose {{ final_insight_target_count }} strongest, non-overlapping insights. {% endif %}{% if verified_mode|default(false) %}Develop every essential theme and its coverage obligation. Themes may share one insight only when its wording genuinely develops both propositions; optional themes may be merged or omitted when that is the coherent, source-faithful choice. Use the admitted candidate feasibility metadata and preserve material relationships, qualifiers and counter-signals.{% else %}At least one selected insight substantively developing each planned editorial theme is required before choosing any extra insight.{% endif %}
  {% endif %}

  Preserve the primary `evidence_id` per insight and, when the prose materially combines multiple supplied findings, include an `evidence_ids` array with the exact primary-first IDs for every necessary finding. Return JSON with an `insights_final` array of candidate-shaped entries containing scores, coverage_role, so_what, now_what, metric_public_copy, and report_type_lens.
  Return only the requested JSON object and final insight entries. Do not repeat the candidate roster, evidence text, schema, editorial plan, or canonical fact objects in the response. Keep `so_what` and `now_what` to one or two concise sentences tied to the selected finding; preserve exact values, comparisons, qualifiers, and scope rather than shortening them into a misleading summary.
  Reuse selected candidate IDs; keep IDs unique.
  {% if verified_mode|default(false) %}
  In verified mode, write a complete source-backed factual proposition in `text`, preferably in one or two complete sentences and with more length only when needed for accuracy. Preserve every material comparison, both sides, direction, population, denominator, period, forecast/observation status, qualifier, and limitation from the authoritative candidate and obligation. Never shorten a proposition into a generic trend or topic-only statement.
  {% else %}
  For compact cards, aim for one complete, source-backed insight sentence at
  18 words or fewer only when all material scope fits. If the proposition needs
  more words to preserve a comparison, qualifier, or subrelationship, retain
  the complete multi-sentence wording rather than clipping or omitting it.
  {% endif %}
  For numeric insights, keep the finding/quote ID and page. Its direct evidence
  must state value, subject, and period/status; do not expand scope. DocMap IDs
  are not numeric evidence.
  Choose the first insight by direct evidence strength, source specificity, and
  decision relevance; scores break close choices. Lead with concrete outcomes
  or mechanisms over abstract context. Keep both sides of each comparison with
  exact values, scope, periods, and evidence IDs; never round or relativize.
  Keep so_what a specific, non-contradictory MarketLense interpretation of why
  the finding matters. Keep now_what a specific conditional decision or
  follow-up tied to it. Neither may add a factual premise or false attribution
  or promise an outcome.
  When the source describes a relationship or a gap between two states,
  preserve that direction and both sides in the editorial interpretation; do
  not recast a condition, comparison, or outcome as the gap or cause itself.
  Preserve source scope exactly: per-group values are not across-group values.
  When a metric has a parent cohort or category plus an "All" series, preserve
  both the parent scope and the series label; never turn the series label into
  a broader population.
  Do not add a timeframe, population, geography, or qualifier that is absent
  from the selected candidate's evidence and protected metric binding. Keep
  scoped words such as "some", "certain", "at launch", "among", and "after";
  if the candidate does not establish a detail, omit it.
  In `so_what` and `now_what`, avoid repeating numbers or ranked-group labels
  from `text`, and omit counts absent from the linked evidence.
  Do not output arrays/comma-separated values inside evidence_id. `evidence_ids` is optional and may contain only exact IDs present in the supplied candidate insights, with the primary `evidence_id` first; do not add an ID merely because it shares a topic or source page.
  {% if verified_mode|default(false) %}
  In verified mode, `evidence_id` is required, must be a non-empty exact primary ID from the selected candidate, and must remain the authoritative binding for the factual proposition. Never invent, omit, or replace it with a topic, page, or source identifier.
  {% else %}
  If uncertain, use an empty string for the primary ID.
  {% endif %}
  Optional fields that are not available must be omitted, never set to null; if an optional array is present, emit a JSON array of its allowed values.
  Prefer insights that can carry a clear metric, claim-level evidence, or public-safe proof point into final editorial artifacts.
  Retain at most one public primary metric per insight: `metric.value` must be one complete human-readable metric or one coherent comparison/range, never a semicolon-separated list. When `metric.value` is present, retain or supply `metric.label` as a concise human-readable description of that exact metric; do not use a general multi-metric insight sentence or a different metric's subject. `metric.unit` must be one semantic unit and must not repeat currency symbols or magnitude words already in `metric.value`. Keep any additional supporting numbers in `text` and `evidence`.
  When `metric` is present and source-backed, write `metric_public_copy` as one concise natural sentence a reader can understand without seeing the structured metric fields. It must express only the retained metric and its exact supported label, unit, subject, cohort, denominator, geography, timeframe, comparison, and observation/forecast status; do not add qualifiers or implications that are not established by the selected evidence. Do not join fields mechanically, repeat the same metric in multiple forms, or emit `label=`, `value=`, or other field serialization. Omit `metric_public_copy` when the metric tuple is incomplete or its public wording cannot be stated safely.
  Preserve populated `metric.subject`, `metric.cohort`, `metric.denominator`, and `metric.observation_status` exactly from the candidate. Do not infer or substitute a relationship from another candidate or an adjacent source value. A year, date, or timing phrase alone is not a metric: leave `metric` empty unless there is a measured value tied to its exact label.
