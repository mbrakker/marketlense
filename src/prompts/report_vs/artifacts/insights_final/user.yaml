includes:
  - "report_vs/artifacts/_partials/editorial_constitution.yaml"
schema_snippets:
  insights_final_schema:
    schema: "artifacts.schema.json"
    pointer: "/properties/insights_final/items"
text: |
  Context:
  - Candidate insights JSON: {{ insights_candidates_json }}
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}
  - Editorial plan JSON: {{ editorial_plan_json }}

  Source-of-truth final insight schema:
  {{ insights_final_schema }}

  Target final insight count: {{ final_insight_target_count }}.

  Task: Choose {{ final_insight_target_count }} strongest, non-overlapping insights. Preserve one `evidence_id` per insight. Return JSON with an `insights_final` array of candidate-shaped entries containing scores, coverage_role, so_what, now_what, and report_type_lens.
  Reuse selected candidate IDs; keep IDs unique.
  Keep one complete, source-backed insight sentence at 18 words or fewer for compact cards; preserve its material scope and never clip it.
  For numeric insights, keep the finding/quote ID and page. Its direct evidence
  must state value, subject, and period/status; do not expand scope. DocMap IDs
  are not numeric evidence.
  Choose the first insight by direct evidence strength, source specificity, and
  decision relevance; scores break close choices. Put a concrete outcome or
  mechanism ahead of abstract context on the same theme. Preserve exact values,
  comparisons, scope, periods, and evidence IDs; do not round or relativize them.
  Keep so_what a specific, non-contradictory MarketLense interpretation of why
  the finding matters. Keep now_what a specific conditional decision or
  follow-up tied to it. Neither may add a factual premise or false attribution
  or promise an outcome.
  Preserve source scope exactly: per-group values are not across-group values.
  In `so_what` and `now_what`, avoid repeating numbers or ranked-group labels
  from `text`, and omit counts absent from the linked evidence.
  Do not output arrays/comma-separated values inside evidence_id; if uncertain, use an empty string.
  Prefer insights that can carry a clear metric, claim-level evidence, or public-safe proof point into final editorial artifacts.
  Retain at most one public primary metric per insight: `metric.value` must be one complete human-readable metric or one coherent comparison/range, never a semicolon-separated list. When `metric.value` is present, retain or supply `metric.label` as a concise human-readable description of that exact metric; do not use a general multi-metric insight sentence or a different metric's subject. `metric.unit` must be one semantic unit and must not repeat currency symbols or magnitude words already in `metric.value`. Keep any additional supporting numbers in `text` and `evidence`.
  Preserve populated `metric.subject`, `metric.cohort`, `metric.denominator`, and `metric.observation_status` exactly from the candidate. Do not infer or substitute a relationship from another candidate or an adjacent source value. A year, date, or timing phrase alone is not a metric: leave `metric` empty unless there is a measured value tied to its exact label.
