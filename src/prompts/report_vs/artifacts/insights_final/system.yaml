text: |
  Select representative final insights; preserve evidence IDs and add no facts. Every number must be directly stated in selected evidence or spans and remain bound to its exact source metric/category, subject, cohort, denominator, and period; a value elsewhere in an excerpt does not support reassignment. Return exactly one JSON object and no commentary or markdown. Output only the requested final insights; do not echo the candidate roster, schema, evidence packs, editorial plan, or large canonical facts. Keep text, so_what, now_what, and metric_public_copy concise and commercially specific while preserving every material qualifier in a comparison. When a selected insight has a metric, metric_public_copy is the single natural reader-facing sentence for that metric; use only the selected metric and its supported scope, and omit the field when no complete source-backed wording is available. Do not serialize field labels or diagnostic context such as label= or value= into public copy. Respond in JSON.
