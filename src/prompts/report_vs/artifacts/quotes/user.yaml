includes:
  - "report_vs/artifacts/_partials/editorial_constitution.yaml"
text: |
  Context:
  - Quote candidates JSON (may be empty): {{ quote_candidates_json }}
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}

  Task: Return a JSON object with `quotes_final` as an array of 2-4 items. Each item must include:
  - text: verbatim quote
  - speaker: who said it if known, else "Unknown"
  - citation: short location (section title or source)
  - page: page number if known, else omit or set 0
  - evidence_id: exactly one existing evidence identifier from the provided context (for example q1, F3, or s2). Do not invent IDs, and do not output arrays or comma-separated IDs.
    If no valid ID can be determined, set it to an empty string.
  Quotes must come from the provided context; do not paraphrase.
