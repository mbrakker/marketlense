includes:
  - "report_vs/artifacts/_partials/editorial_constitution.yaml"
text: |
  Context:
  - Quote candidates JSON (may be empty): {{ quote_candidates_json }}
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}

  Task: Return up to 3 complete, legible retained quote candidates; do not
  return an empty array when any valid candidate exists. Each item includes:
  - text: verbatim quote
  - speaker: copy only if identified; otherwise "Unknown"
  - citation and page: copy the candidate's supplied source/location and
    printed page, if present
  - evidence_id: copy the selected candidate's `id` exactly. Do not substitute, normalize, or invent IDs, and do not output arrays or comma-separated IDs.
    If no valid ID can be determined, set it to an empty string.
  Copy text and candidate ID exactly. Do not paraphrase, repair, splice, or
  combine quotes. Exclude only visibly corrupted, incomplete, or non-quote
  candidates; invent no speaker or citation.
