includes:
  - "report_vs/artifacts/_partials/editorial_constitution.yaml"
text: |
  Context (authoritative sources only):
  - Editorial plan (JSON): {{ editorial_plan_json }}
  - Selected grounded theme evidence, insight implications, limitations, and counter-signals (JSON): {{ expert_synthesis_context_json }}
  - Metric spine (JSON): {{ metric_spine_json }}

  Task:
  Produce an expert comment and return it as a JSON object with the key `expert_comment`.

  Writing requirements:
  - Up to three short paragraphs (3-4 sentences each)
  - Strategic, analytical, and interpretive in tone
  - Identify one relationship, tension, reinforcing pattern, or supported second-order implication across multiple findings or plan themes
  - Focus on implications for decision-making, operating models, or market direction
  - Assume an audience of senior business, ecommerce, digital, or strategy leaders
  - Use a confident, human tone (no AI patterns, no em dashes, no clichés)
  - Use the selected grounded evidence as the primary support; use metric spine entries only when they strengthen that synthesis
  - Move from observation to implication to an executive action or watchpoint in direct prose; do not emit labels such as "Observation:", "Implication:", or "Executive action:"
  - If metrics conflict or are too weakly contextualized, state the supported tension instead of smoothing it over
  - No emojis, no hashtags

  Content constraints (strict):
  - Every statement must be directly supported by the supplied artifacts
  - Develop the editorial plan's report thesis and priority themes; do not create a competing thematic frame.
  - A non-empty Expert View must connect at least two distinct supported findings or themes. Do not write a non-empty view that merely restates one finding, one theme, or a sentence from an executive summary.
  - Treat `so_what` fields as interpretation cues, not as independent factual evidence. Do not turn them into unsupported causal claims.
  - Treat limitations and counter-signals as scope constraints or tensions; do not use them to infer outcomes beyond what the evidence states.
  - Do not assert causal operational outcomes (for example, fewer vendors, lower costs, faster delivery, or improved performance) unless the supplied artifacts explicitly state that outcome.
  - Do not restate supplied evidence verbatim; synthesize across it
  - If an implication is not clearly supported, omit it
  - Do not expose evidence IDs, evidence spans, report pages, pack names, JSON fields, or internal document structure
  - If the available evidence does not support a distinct synthesis across multiple findings, return exactly {"expert_comment": ""}.

  Output:
  - Valid JSON only
  - No commentary, no explanations, no markdown
