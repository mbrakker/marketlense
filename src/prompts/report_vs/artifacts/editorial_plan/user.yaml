text: |
  Context:
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}
  - Canonical evidence ID vocabulary (use these values exactly): {{ canonical_evidence_ids_json }}
  {% if verified_facts_json|default("") %}
  - Canonical verified facts JSON (sole factual authority): {{ verified_facts_json }}
  - Provisional discovery editorial guide JSON (priorities only; not factual authority): {{ discovery_editorial_plan_json|default("{}") }}
  - Planning phase: {{ editorial_plan_phase|default("verified_facts") }}
  {% endif %}

  Task: Return exactly this JSON object:
  {
    "editorial_plan": {
      "report_thesis": "<one grounded sentence expressing the report's central decision-relevant conclusion>",
      "themes": [
        {
          "theme": "<concise editorial theme>",
          "priority": 1,
          "evidence_ids": ["<one or more existing evidence IDs from the supplied context>"]
        }
      ]
    }
  }

  Choose two to seven distinct themes, ordered by unique positive priority. The DocMap is the authority for report breadth. Treat a report as very broad only with many distinct major sections and material evidence; then prefer different early, middle, and later source areas when they add commercially distinct signals. Do not let one contiguous cluster dominate when other major sections add material evidence. This is not a chapter quota: omit repetitive sections and do not pad narrow or one-sided reports. Where source supports a decision tension, retain counterbalancing evidence; do not invent balance or over-weight executive-summary takeaways over deeper evidence. Give additional importance to a source-backed publisher forecast when it is materially central to the report's stated argument and repeated in executive-summary, opening-takeaway, or other substantive synthesis. It may sit beside a current-state metric on the same theme. Page position, repetition alone, and promotional copy are not sufficient. Keep forecasts attributed and speculative projections qualified. For each theme, describe the specific proposition that a final insight should develop, including any material metric relationship, segment, timeframe, qualification, interpretation, or recommendation. Prefer a coherent report narrative and commercially meaningful implications over generic topic labels. Do not combine unrelated facts or force filler themes; if the admitted evidence cannot support a credible five-insight report, fail with a clear evidence-sufficiency diagnostic. In verified mode, use only the supplied canonical verified-fact IDs and facts; the provisional discovery guide may inform priority but may not introduce a theme or factual premise unsupported by those facts. Multiple themes may share one fact, and one theme may use multiple facts when the relationship is source-supported. Each theme must have one or more evidence IDs from the canonical evidence ID vocabulary. Copy IDs exactly; never derive, rename, or invent an ID. Do not add facts, numbers, or rationale fields.
