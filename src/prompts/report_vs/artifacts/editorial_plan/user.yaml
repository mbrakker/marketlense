text: |
  Context:
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}

  Task: Return exactly this JSON object:
  {
    "editorial_plan": {
      "report_thesis": "<one grounded sentence expressing the report's central decision-relevant conclusion>",
      "themes": [
        {
          "theme": "<concise editorial theme>",
          "priority": 1,
          "evidence_ids": ["<one or more existing evidence IDs from the supplied context>"]
        }
      ]
    }
  }

  Choose two to seven distinct themes, ordered by unique positive priority. The DocMap is the authority for report breadth. For a broad report, select themes that represent materially different major DocMap source areas rather than several variants of one cluster. When counterbalancing major sections materially support both sides of a decision-relevant tension, preserve both sides: for example, opportunity or benefit versus risk or constraint; growth versus friction; adoption versus trust; or efficiency or value versus a governance concern. Do not let several closely related risk themes crowd out a material benefit, opportunity, or acceptance section, or vice versa. Do not over-weight executive-summary or report-takeaways sections when deeper chapters contain distinct material evidence. Do not manufacture balance: retain a counterpoint only when the source materially supports it, and do not pad a narrow or one-sided report. Each theme must have one or more evidence IDs that exist in the supplied findings, quote candidates, key metrics, or DocMap sections. Do not add facts, numbers, or rationale fields.
