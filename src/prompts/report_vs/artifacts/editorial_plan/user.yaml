text: |
  Context:
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}

  Task: Return exactly this JSON object:
  {
    "editorial_plan": {
      "report_thesis": "<one grounded sentence expressing the report's central decision-relevant conclusion>",
      "themes": [
        {
          "theme": "<concise editorial theme>",
          "priority": 1,
          "evidence_ids": ["<one or more existing evidence IDs from the supplied context>"]
        }
      ]
    }
  }

  Choose two to seven distinct themes, ordered by unique positive priority. The DocMap is the authority for report breadth. Treat a report as very broad only with many distinct major sections and material evidence; then prefer different early, middle, and later source areas when they add commercially distinct signals. Do not let one contiguous cluster dominate when other major sections add material evidence. This is not a chapter quota: omit repetitive sections and do not pad narrow or one-sided reports. Where source supports a decision tension, retain counterbalancing evidence; do not invent balance or over-weight executive-summary takeaways over deeper evidence. Give additional importance to a source-backed publisher forecast when it is materially central to the report's stated argument and repeated in executive-summary, opening-takeaway, or other substantive synthesis. It may sit beside a current-state metric on the same theme. Page position, repetition alone, and promotional copy are not sufficient. Keep forecasts attributed and speculative projections qualified. Each theme must have one or more evidence IDs that exist in the supplied findings, quote candidates, key metrics, or DocMap sections. Do not add facts, numbers, or rationale fields.
