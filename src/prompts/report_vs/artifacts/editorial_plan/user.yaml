text: |
  Context:
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}
  - Canonical evidence ID vocabulary (use these values exactly): {{ canonical_evidence_ids_json }}
  {% if verified_facts_json|default("") %}
  - Canonical verified facts JSON (sole factual authority): {{ verified_facts_json }}
  - Provisional discovery editorial guide JSON (priorities only; not factual authority): {{ discovery_editorial_plan_json|default("{}") }}
  - Admitted candidate IDs (selection feasibility only; not factual authority): {{ admitted_candidate_ids_json|default("[]") }}
  - Planning phase: {{ editorial_plan_phase|default("verified_facts") }}
  {% if editorial_plan_phase|default("") == "verified_replan" %}
  - Original verified editorial plan (immutable reference): {{ original_editorial_plan_json|default("{}") }}
  - Independent coverage failure assessment: {{ coverage_failure_assessment_json|default("{}") }}
  - Original essential obligations (each must remain in the revised essential bindings): {{ original_essential_obligations_json|default("[]") }}
  - Immutable admitted candidate IDs: {{ immutable_admitted_candidate_ids_json|default("[]") }}
  {% endif %}
  {% endif %}

  During a verified replan, revise only the organization of the original plan: preserve every original essential proposition and its canonical fact bindings, and do not add candidates or facts. You may merge themes when one final insight can develop both, or omit an optional redundant theme when the independent assessment supports it. Never downgrade an essential theme to optional, discard a material counter-signal, or use replan to turn insufficient evidence into a PASS. Return the same executable plan contract for the next writer and coverage review.

  In verified mode, explicitly partition each theme's evidence_ids into required_evidence_ids and alternative_evidence_groups. Every required ID is indispensable; each alternative group represents a separate requirement satisfied by at least one member. Group facts only when either can independently support the same obligation with all material relationships and qualifications; related but distinct facts are not alternatives. Include every theme evidence ID exactly once, use empty arrays when appropriate, and preserve original essential requirements during replan. Do not infer or invent bindings.

  Task: Return exactly this JSON object:
  {
    "editorial_plan": {
      "report_thesis": "<one grounded sentence expressing the report's central decision-relevant conclusion>",
      "themes": [
        {
          "theme": "<concise editorial theme>",
          "priority": 1,
          "evidence_ids": ["<one or more existing evidence IDs from the supplied context>"]{% if verified_facts_json|default("") %},
          "importance": "essential|optional",
          "coverage_obligation": "<the proposition, relationship and material qualification that must survive>",
          "required_evidence_ids": ["<each indispensable canonical fact ID>"],
          "alternative_evidence_groups": [["<canonical fact ID>", "<genuinely interchangeable canonical fact ID>"]],
          "feasible_candidate_ids": [],
          "merge_group": "<shared group only when a single insight genuinely develops this theme with another>"{% endif %}
        }
      ]{% if verified_facts_json|default("") %},
      "material_limitation_evidence_ids": ["<exact canonical fact IDs for material limitations or qualifications>"]{% endif %}
    }
  }

  Choose two to seven distinct themes, ordered by unique positive priority. Inspect every supplied canonical fact before deciding the count: assign each materially distinct fact to a theme's evidence_ids, or group it only when that theme's intended proposition genuinely develops the fact. When a distinct ranking, conclusion, counter-signal, limitation, or other material proposition would otherwise be omitted, use six or seven themes when justified. Do not reduce a broad fact roster to five themes merely because five is a common report size, and do not leave a distinct admitted fact unrepresented just to preserve a compact count. The DocMap is the authority for report breadth. Treat a report as very broad only with many distinct major sections and material evidence; then prefer different early, middle, and later source areas when they add commercially distinct signals. Do not let one contiguous cluster dominate when other major sections add material evidence. This is not a chapter quota: omit repetitive sections and do not pad narrow or one-sided reports. Where source supports a decision tension, retain counterbalancing evidence; do not invent balance or over-weight executive-summary takeaways over deeper evidence. Give additional importance to a source-backed publisher forecast when it is materially central to the report's stated argument and repeated in executive-summary, opening-takeaway, or other substantive synthesis. It may sit beside a current-state metric on the same theme. Page position, repetition alone, and promotional copy are not sufficient. Keep forecasts attributed and speculative projections qualified. For each theme, describe the specific proposition that a final insight should develop, including any material metric relationship, segment, timeframe, qualification, interpretation, or recommendation. Prefer a coherent report narrative and commercially meaningful implications over generic topic labels. Do not combine unrelated facts or force filler themes; if the admitted evidence cannot support a credible multi-insight report at the justified theme count, fail with a clear evidence-sufficiency diagnostic. In verified mode, use only the supplied canonical verified-fact IDs and facts; the provisional discovery guide may inform priority but may not introduce a theme or factual premise unsupported by those facts. Multiple themes may share one fact, and one theme may use multiple facts when the relationship is source-supported. Each theme must have one or more evidence IDs from the canonical evidence ID vocabulary. Copy evidence IDs exactly; never derive, rename, or invent an ID. In verified mode, leave feasible_candidate_ids as an empty array; the system derives the executable candidate binding from the exact admitted evidence map after semantic validation. Select material limitation IDs from the canonical fact vocabulary; never invent or promote a navigation ID. Normal-mode output remains the original plan contract. Do not add facts, numbers, or fields outside this contract.
