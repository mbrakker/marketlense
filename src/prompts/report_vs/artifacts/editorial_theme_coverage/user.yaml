text: |
  Planned editorial themes and intended propositions:
  {{ editorial_plan_json }}

  Final insights to assess:
  {{ insights_final_json }}

  Complete canonical visually verified fact roster:
  {{ verified_facts_json }}

  Original essential obligations that must remain substantively developed during
  a replan:
  {{ original_essential_obligations_json|default("[]") }}

  Return one JSON object with these fields:
  - `theme_coverage`: one entry for every planned theme, exactly once. Each entry
    has the exact `theme`, one `status` (`covered`, `partial`, `uncovered`, or
    `redundant_optional`), exact `supporting_insight_ids`, and a substantive
    `explanation`.
  - `report_completeness`: `complete`, `incomplete`, or `uncertain`.
  - `diagnosis`: `planned_theme_execution`, `material_report_completeness`,
    `redundant_optional_theme`, `infeasible_plan`, or `insufficient_evidence`.
  - `material_gaps`: exact admitted `verified_fact_ids`, canonical `evidence_ids`,
    exact `final_insight_ids` when applicable, and a specific explanation. Use an
    empty list for a complete report.
  - `original_essential_obligation_assessments`: one exact entry for every supplied
    original obligation, with its immutable theme/evidence IDs, status
    (`covered`, `partial`, or `uncovered`), exact supporting insight IDs, and
    explanation. An honestly uncovered obligation may have an empty supporting
    insight list.

  Judge actual metric relationships, qualifications, denominators, populations,
  timeframes and forecast/observation status. A shared source page or fact ID is
  not enough. A single final insight may support more than one planned theme only
  when its wording develops each proposition. A single final insight may support
  multiple themes only when its wording develops each proposition, instead of
  demanding a redundant one-to-one insight. Do not return `resolution` or
  `recovery_action`; those are deterministic internal projections.
