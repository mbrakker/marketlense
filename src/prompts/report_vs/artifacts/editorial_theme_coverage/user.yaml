text: |
  Planned editorial themes and intended propositions:
  {{ editorial_plan_json }}

  Final insights to assess:
  {{ insights_final_json }}

  Complete canonical visually verified fact roster:
  {{ verified_facts_json }}

  Original essential obligations that must remain substantively developed during a replan:
  {{ original_essential_obligations_json|default("[]") }}

  Return exactly this JSON object:
  {
    "report_completeness": "complete|incomplete|uncertain",
    "diagnosis": "planned_theme_execution|material_report_completeness|redundant_optional_theme|infeasible_plan|insufficient_evidence",
    "recovery_action": "none|targeted_rewrite|replan|quarantine",
    "original_essential_obligation_assessments": [
      {
        "theme": "<exact original essential obligation theme>",
        "evidence_ids": ["<exact original canonical evidence IDs>"],
        "status": "covered|partial|uncovered",
        "supporting_insight_ids": ["<exact final insight IDs>"],
        "explanation": "<whether the original material proposition remains substantively developed>"
      }
    ],
    "theme_coverage": [
      {
        "theme": "<exact planned theme name>",
        "status": "covered|partial|uncovered",
        "resolution": "retained|merged|omitted|unresolved|quarantined",
        "supporting_insight_ids": ["<exact final insight id>"],
        "explanation": "<concise explanation grounded in the intended proposition and actual final wording>"
      }
    ]
  }

  Include every planned theme exactly once. Use only exact final insight IDs. Set resolution to retained when the theme is developed directly, merged when one final insight genuinely develops multiple planned themes, omitted only for an optional redundant theme, and quarantined when an essential proposition cannot be represented. Use `report_completeness` to assess the whole article independently of the plan organization. Choose `targeted_rewrite` when supported evidence is available but the prose is incomplete, `replan` only when the plan is redundant or infeasible, and `quarantine` when material verified evidence is insufficient.
  Use these control combinations coherently: `planned_theme_execution` with `none` for a complete plan execution; `redundant_optional_theme` with `none` when a redundant optional theme is safely omitted from a complete report, or with `replan` when the plan must be reorganized; `material_report_completeness` or `planned_theme_execution` with `targeted_rewrite` only when completeness is `incomplete` or `uncertain`; `infeasible_plan` with `replan`; and `insufficient_evidence` with `quarantine` when completeness is `incomplete` or `uncertain`. Do not use a recovery action to convert an incomplete report into a complete verdict.
  `covered` means the final prose develops the theme's intended proposition;
  `partial` means it is materially related but incomplete; `uncovered` means
  the final roster does not substantively address it. A shared fact or source
  page is not enough. A single final insight may support more than one planned
  theme when its actual wording develops each theme's intended proposition;
  list that exact insight ID under each applicable theme instead of demanding
  a redundant one-to-one insight for every theme. Inspect each supplied metric object and
  metric_public_copy when present: a theme is partial when the final wording
  drops a material value relationship, segment, timeframe, qualifier, or
  subrelationship from the admitted fact. Use the complete fact roster to
  notice material admitted propositions or subrelationships that are not
  substantively treated by any planned theme, and mark the nearest affected
  theme partial or uncovered with a concise explanation. For a replan, explicitly
  assess every original essential obligation supplied above in
  original_essential_obligation_assessments against the revised plan and final
  wording; do not mark the report complete if any obligation is dropped or only
  weakly implied. Do not rewrite the insights or add evidence.
