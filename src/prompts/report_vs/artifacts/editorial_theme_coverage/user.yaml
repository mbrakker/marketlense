text: |
  Planned editorial themes and intended propositions:
  {{ editorial_plan_json }}

  Final insights to assess:
  {{ insights_final_json }}

  Complete canonical visually verified fact roster:
  {{ verified_facts_json }}

  Return exactly this JSON object:
  {
    "theme_coverage": [
      {
        "theme": "<exact planned theme name>",
        "status": "covered|partial|uncovered",
        "supporting_insight_ids": ["<exact final insight id>"],
        "explanation": "<concise explanation grounded in the intended proposition and actual final wording>"
      }
    ]
  }

  Include every planned theme exactly once. Use only exact final insight IDs.
  `covered` means the final prose develops the theme's intended proposition;
  `partial` means it is materially related but incomplete; `uncovered` means
  the final roster does not substantively address it. A shared fact or source
  page is not enough. A single final insight may support more than one planned
  theme when its actual wording develops each theme's intended proposition;
  list that exact insight ID under each applicable theme instead of demanding
  a redundant one-to-one insight for every theme. Inspect each supplied metric object and
  metric_public_copy when present: a theme is partial when the final wording
  drops a material value relationship, segment, timeframe, qualifier, or
  subrelationship from the admitted fact. Use the complete fact roster to
  notice material admitted propositions or subrelationships that are not
  substantively treated by any planned theme, and mark the nearest affected
  theme partial or uncovered with a concise explanation. Do not rewrite the
  insights or add evidence.
