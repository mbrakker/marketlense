includes:
  - "report_vs/artifacts/regenerate/_partials/critique_first.yaml"
text: |
  Context:
  - Attempt index: {{ attempt_index }}
  - Target section: {{ target_section }}
  - Current expert comment text: {{ current_section_text }}
  - Claim repair scope JSON: {{ claim_repair_scope_json }}
  - Editorial plan JSON: {{ editorial_plan_json }}
  - Selected grounded theme evidence, insight implications, limitations, and counter-signals JSON: {{ expert_synthesis_context_json }}
  - Expert domain: {{ expert_domain }}
  - Validator failures JSON: {{ failure_reasons_json }}
  - Fix checklist JSON: {{ fix_checklist_json }}
  - Grounding package JSON: {{ grounding_package_json }}

  Task:
  Return a JSON object with:
  {
    "expert_comment": "<grounded expert-style commentary>",
    "claim_provenance": [{"claim": "<exact material sentence>", "classification": "factual|interpretive|recommendation", "evidence_ids": ["<approved evidence id>"]}]
  }

  Requirements:
  - Fix the listed failures directly.
  - When `claim_repair_scope.mode` is `claim`, return only one replacement
    sentence for `expert_comment` and bind only that replacement sentence.
    The generator preserves and deterministically reconstructs all sibling
    claims; never rewrite or repeat them.
  - Treat the current comment and synthesis context as failed editorial input,
    not source evidence. Make factual assertions only from
    `grounding_package.relevant_evidence`; never use an ID listed in
    `grounding_package.quarantined_evidence_ids`.
  - If the approved evidence cannot support a distinct two-finding synthesis,
    return an empty Expert View rather than reuse the failed evidence or claim.
  - Develop the editorial plan's report thesis and themes without introducing a competing frame.
  - A non-empty Expert View must connect at least two distinct supported findings or themes; do not restate one finding or summary sentence.
  - Do not add claims that are absent from the supplied editorial plan, synthesis context, or grounding package.
  - Treat `so_what` fields as interpretation cues, not independent factual evidence, and preserve limitations and counter-signals as constraints.
  - Prefer deletion of unsupported material over speculation.
  - Return direct public prose without editorial labels such as "Observation:", "Implication:", or "Executive action:".
  - `claim_provenance` is private retained metadata. Bind every material sentence or claim to exact approved evidence IDs; never expose IDs in `expert_comment`. A factual claim must have at least one evidence ID.
  - If no distinct supported synthesis remains after repair, return exactly {"expert_comment": ""}.
