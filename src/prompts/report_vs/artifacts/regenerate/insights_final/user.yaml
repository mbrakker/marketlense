includes:
  - "report_vs/artifacts/regenerate/_partials/critique_first.yaml"
text: |
  Context:
  - Attempt index: {{ attempt_index }}
  - Target section: {{ target_section }}
  - Current final insights JSON: {{ current_section_json }}
  - Updated candidate insights JSON: {{ insights_candidates_json }}
  - Validator failures JSON: {{ failure_reasons_json }}
  - Fix checklist JSON: {{ fix_checklist_json }}
  - Grounding package JSON: {{ grounding_package_json }}
  - Editorial plan JSON: {{ editorial_plan_json }}
  - Target final insight count: {{ final_insight_target_count }}

  Task:
  Return a JSON object with `insights_final` as an array of {{ final_insight_target_count }} non-overlapping insights.
  Each item must keep the candidate shape: id, text, evidence_id, evidence, metric,
  pages, so_what, now_what.

  Requirements:
  - Prefer repaired candidates that directly resolve the listed failures.
  - Treat the prior final insights as failed copy, not source evidence. Use only
    `grounding_package.relevant_evidence`; do not use any ID listed in
    `grounding_package.quarantined_evidence_ids`.
  - Replace an unsupported angle with a distinct approved-evidence angle rather
    than repairing the wording around the rejected claim.
  - Follow editorial-plan priority order and choose one supported representative for each theme. If the target count exceeds the number of themes, fill the remaining slots with distinct supported candidates from the supplied candidate set; do not use near-duplicates.
  - For every retained insight, preserve a stable `id` and copy one existing `evidence_id` with its exact page number(s) from the supplied candidate or grounding package. Remove an insight rather than output an empty, invented, or unverifiable evidence binding.
  - Use each stable `id` at most once. Do not let a duplicate ID displace another retained insight; retain that insight's original stable ID and its evidence binding.
  - `so_what` must state a report-specific business implication; `now_what` must
    state a concrete, report-specific decision or action. Neither field may be
    empty, generic, or a citation label.
  - Remove unsupported wording rather than hedge it.
  - Do not output unsupported metrics, quotes, or conclusions. Every numeric value must be explicitly supported by the insight's linked retained evidence.
  - Retain at most one public primary metric per insight: `metric.value` must be one complete human-readable metric or one coherent comparison/range, never a semicolon-separated list. When `metric.value` is present, retain or repair `metric.label` as a concise human-readable description of that exact source-backed metric; never use a general multi-metric insight or a different metric's subject. `metric.unit` must be one semantic unit and must not repeat currency symbols or magnitude words already in `metric.value`. Keep additional supporting numbers in `text` and `evidence`.
  - Preserve the exact retained `metric.subject`, `metric.cohort`, `metric.denominator`, and `metric.observation_status`; never repair them from a neighbouring chart/table series.
  - A year, date, or timing phrase alone is not a public metric. Leave `metric` empty unless it contains a measured value tied to its exact retained label.
