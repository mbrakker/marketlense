includes:
  - "report_vs/artifacts/regenerate/_partials/critique_first.yaml"
text: |
  Context:
  - Attempt index: {{ attempt_index }}
  - Target section: {{ target_section }}
  - Current final insights JSON: {{ current_section_json }}
  - Updated candidate insights JSON: {{ insights_candidates_json }}
  - Validator failures JSON: {{ failure_reasons_json }}
  - Fix checklist JSON: {{ fix_checklist_json }}
  - Grounding package JSON: {{ grounding_package_json }}
  - DocMap JSON: {{ doc_map_json }}
  - Evidence packs JSON: {{ evidence_json }}
  - Target final insight count: {{ final_insight_target_count }}

  Task:
  Return a JSON object with `insights_final` as an array of {{ final_insight_target_count }} non-overlapping insights.
  Each item must keep the candidate shape: id, text, evidence_id, evidence, metric,
  pages, so_what, now_what.

  Requirements:
  - Prefer repaired candidates that directly resolve the listed failures.
  - Cover distinct substantive DocMap sections before selecting another insight from the same report theme; do not pad narrow reports with near-duplicates.
  - Keep `evidence_id` to a single existing ID or an empty string.
  - `so_what` must state a report-specific business implication; `now_what` must
    state a concrete, report-specific decision or action. Neither field may be
    empty, generic, or a citation label.
  - Remove unsupported wording rather than hedge it.
  - Do not output unsupported metrics, quotes, or conclusions.
