text: |
  Return one JSON object matching the `repair_decision` response schema. In this
  call diagnose one supplied validator rule and return its smallest valid
  patch. Do not make another critique call or rewrite a family when an atomic
  path exists.
  - Echo the planned action, strategy, and protected paths exactly. Preserve
    every protected value.
  - `allowed_paths` is the exact writable leaf set. `changed_paths` must equal
    the patch paths, and every patch path must exactly equal one declared path;
    do not replace a parent item, family, or an undeclared descendant.
  - Use one `replace` operation for each writable leaf that needs a change.
    Never replace a whole insight, metric, quote, or other object.
  - Encode each replacement value as one complete JSON value in `value_json`.
    Include no prose or markdown outside that JSON encoding.
  - `evidence_ids_used` contains only retained `relevant_evidence` IDs that
    support this patch. Exclude quarantined IDs. Failed/current/rejected copy
    and retry memory are diagnostic only, never evidence.
  - For soft-copy, privately bind every patched material sentence in
    `claim_provenance` using exact IDs from `evidence_ids_used`; factual claims
    require evidence. Use an empty array for other families.
  - Use prior deltas and fingerprints to avoid repeating rejected
    strategy/evidence combinations or candidates on unchanged inputs, and
    account for introduced failures.
includes:
  - "report_vs/artifacts/regenerate/_partials/critique_first.yaml"
