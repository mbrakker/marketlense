includes:
  - "report_vs/artifacts/regenerate/_partials/critique_first.yaml"
text: |
  Context:
  - Attempt index: {{ attempt_index }}
  - Target section: {{ target_section }}
  - Current candidate insights JSON: {{ current_section_json }}
  - Validator failures JSON: {{ failure_reasons_json }}
  - Fix checklist JSON: {{ fix_checklist_json }}
  - Grounding package JSON: {{ grounding_package_json }}
  - Editorial plan JSON: {{ editorial_plan_json }}

  Task:
  Return a JSON object with `insights_candidates` as an array of grounded candidate insights.
  Each item must include:
  - id
  - text
  - evidence_id
  - evidence
  - metric
  - pages
  - score

  Requirements:
  - Repair or remove unsupported items implicated by the failures.
  - Treat `current_section` as failed copy, never as source evidence. Use only
    `grounding_package.relevant_evidence`; never use an ID listed in
    `grounding_package.quarantined_evidence_ids`.
  - When no approved source directly supports the prior item, replace it with a
    distinct approved evidence angle or remove it. Do not recreate the prior
    assertion from memory, the editorial plan, or a nearby source value.
  - Keep candidates within the editorial plan's themes and linked evidence IDs.
  - Keep each `evidence_id` to a single existing ID or an empty string.
  - Keep each candidate tightly grounded to the supplied evidence.
  - Do not invent metrics or page numbers.
  - Keep at most one public primary metric per candidate: `metric.value` must be one complete human-readable metric or one coherent comparison/range, never a semicolon-separated list. When `metric.value` is present, provide `metric.label` as a concise human-readable description of that exact source-backed metric, never a general multi-metric insight or another metric's subject. `metric.unit` must be one semantic unit and must not repeat currency symbols or magnitude words already in `metric.value`. Retain additional supporting numbers in `text` and `evidence`.
  - When retained evidence supplies them, preserve the metric's exact `subject`, `cohort`, `denominator`, and `observation_status`; leave them empty rather than infer a relationship from nearby evidence.
