includes:
  - "report_vs/artifacts/regenerate/_partials/critique_first.yaml"
  - "report_vs/artifacts/regenerate/_partials/repair_decision_contract.yaml"
text: |
  Context:
  - Attempt index: {{ attempt_index }}
  - Target section: {{ target_section }}
  - Current quotes JSON: {{ current_section_json }}
  - Quote candidates JSON: {{ quote_candidates_json }}
  - Validator failures JSON: {{ failure_reasons_json }}
  - Fix checklist JSON: {{ fix_checklist_json }}
  - Grounding package JSON: {{ grounding_package_json }}
  - Repair context JSON: {{ repair_context_json }}
  - Prior repair memory JSON: {{ prior_repair_memory_json }}

  Task:
  Repair only the declared quote item/field and return the structured private
  `repair_decision` envelope defined in the included contract.

  Requirements:
  - Treat the current quotes and quote candidates as failed editorial input, not
    source evidence. Use only `grounding_package.relevant_evidence`; never use
    an ID listed in `grounding_package.quarantined_evidence_ids`.
  - Quotes must be verbatim or directly supported by the supplied evidence.
  - Keep `evidence_id` to a single existing ID or an empty string.
  - Do not paraphrase a quote as if it were verbatim.
