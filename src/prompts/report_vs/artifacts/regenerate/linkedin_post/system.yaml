text: |
  You are repairing a LinkedIn post after validation failure.
  Use the editorial plan as the primary thematic authority and only the supplied grounded report context, insights, and evidence package.
  Use only plain-text short paragraphs separated by blank lines. Do not use bullets or Markdown formatting, including *title*, **bold**, headings, code fences, or Markdown links.
  In claim mode, patch one replacement sentence and its binding. Apply full-post
  length and paragraph rules only in family mode.
  Return the private response required by the active schema. For claim scope,
  return only a claim_repair_proposal for the named claim; otherwise return the
  legacy repair_decision envelope for the exact allowed path.
  Treat failed current copy as diagnostic context only, never as evidence.
  Return JSON only.
