  - "report_vs/artifacts/regenerate/_partials/critique_first.yaml"
  - "report_vs/artifacts/regenerate/_partials/repair_decision_contract.yaml"
text: |
  Context:
  - Attempt index: {{ attempt_index }}
  - Target section: {{ target_section }}
  - Current summary JSON: {{ current_section_json }}
  - Claim repair scope JSON: {{ claim_repair_scope_json }}
  - Validator failures JSON: {{ failure_reasons_json }}
  - Fix checklist JSON: {{ fix_checklist_json }}
  - Grounding package JSON: {{ grounding_package_json }}
  - Editorial plan JSON: {{ editorial_plan_json }}
  - Repair context JSON: {{ repair_context_json }}
  - Prior repair memory JSON: {{ prior_repair_memory_json }}

  Task:
  Repair the named summary claim/field and return only the structured private
  `repair_decision` envelope defined in the included contract.

  Requirements:
  - Treat the current summary as failed copy, not source evidence. Use only
    `grounding_package.relevant_evidence`; never use an ID listed in
    `grounding_package.quarantined_evidence_ids`.
  - Fix the listed failures directly.
  - When `claim_repair_scope.mode` is `claim`, return only the named summary
    field with one replacement sentence and bind only that sentence. The
    generator preserves and deterministically reconstructs all sibling claims;
    never rewrite or repeat them.
  - Retain the editorial plan's report thesis and themes; do not introduce a competing frame.
  - Every retained `claim_evidence_map` entry must use one existing `evidence_id`; omit a claim rather than output an empty or unverifiable binding.
  - A claim containing a number, magnitude, superlative, requirement, or forecast must cite a direct finding or quote from `grounding_package.relevant_evidence`. Use a DocMap section ID only for descriptive, non-quantitative context; otherwise omit or soften the claim.
  - Keep a supported number attached to the source's exact cohort, denominator, and period wording; do not add a qualifier to the reported base.
  - Copy the linked evidence ID and its exact page number(s) from the grounding package. Do not add, reorder, or infer adjacent pages.
  - Keep `claim_evidence_map` brief and fully grounded.
  - Author both TLDRs independently from the same evidence. The compact TLDR must not be a clipped prefix of the standard TLDR.
  - End each TLDR with complete sentence punctuation. Never use an ellipsis.
  - Do not use mechanical lead-ins or labels such as "Answer:", "Observation:", or "Implication:"; write direct public prose throughout the executive summary.
  - Do not introduce unsupported numbers, entities, quotes, or conclusions. A numeric value may appear only when it is explicitly supported by that claim's linked retained evidence.
  - `repair_decision.claim_provenance` is private metadata for the patched
    sentence(s). Bind exact approved evidence IDs; factual sentences need at
    least one. Never expose IDs in public prose.
