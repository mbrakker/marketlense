includes:
  - "report_vs/artifacts/_partials/editorial_constitution.yaml"
text: |
  Context (authoritative sources only):
  - Editorial plan (primary thematic authority, JSON): {{ editorial_plan_json }}
  - Report context including separate provenance roles, title, publisher, author/byline, data providers, and scope (JSON; canonical identity metadata is not evidence): {{ doc_map_json }}
  - Validated representative insights (supporting evidence, JSON): {{ insights_final_json }}
  - Metric spine (supporting evidence, JSON): {{ metric_spine_json }}

  Task:
  Create a single LinkedIn post and return it as a JSON object with the keys
  `linkedin_post` and `claim_provenance`.

  Writing requirements:
  - Target 180–280 words. The hard maximum is 500 words.
  - Use the editorial plan to select one central, source-supported insight or tension, and use an implication only when supported. Do not turn the post into a mini-summary.
  - For a broad report, select one source-supported theme and express that theme directly. Do not describe the post or selected theme as representative or as a lens on the report unless retained evidence explicitly establishes representativeness. Do not imply that the post summarizes the whole report. For a narrow report, the post may express the overall report thesis.
  - Open with a concrete insight, tension, or material metric. Use an implication only when supported, not as generic framing.
  - When the supplied evidence establishes why the selected angle matters, explain that
    relationship, then use two to four supporting proof points from final insights and
    the metric spine. Otherwise remain descriptive. Use no more than four quantitative proof points.
    Select the four or fewer quantitative proof points before drafting, then use no more than four distinct numerical values in the post; a percentage and its comparison value count separately. Do not introduce any additional number, percentage, currency figure,
    volume, or comparison beyond that selection. Count every supported year/date or
    source period included in the post toward the same limit.
  - When the post includes multiple values, name each metric and its subject or
    observation status in the same clause. Do not call values the first or
    second figure, or imply that they form a comparison, unless their linked
    evidence explicitly states that order or relationship.
  - Add a distinct interpretation or decision implication only when source-supported.
    An optional closing may ask a genuine professional question or state a supported,
    conditional MarketLense-authored recommendation.
  - Write for experienced ecommerce, digital, and strategy operators in a concise, confident, human voice. Use direct prose, not labels such as "Executive takeaway:", "Observation:", or "Implication:".
  - Do not use these recurring formulations: "The evidence points to", "The market signals are clear", "For senior leaders", "The strategic question is not simply", or "The practical agenda".
  - Do not use engagement bait such as "Like if you agree", "Comment below", or unnecessary tagging. Use zero to three highly relevant hashtags only when they add professional context.
  - Do not use emojis, clichés, em dashes, or the character "—".
  - Use only plain-text short paragraphs separated by blank lines so every supporting point remains native LinkedIn prose. Write at least three paragraphs and separate each with two newline characters. Do not return fewer than 180 words or more than 280 words. Do not use bullets or Markdown formatting, including *title*, **bold**, headings, code fences, or Markdown links.

  Content constraints (strict):
  - Every statement must be directly supported by the provided JSON artifacts
  - When source evidence is descriptive, factual statements must remain descriptive. Add analyst interpretation only when it follows without introducing a new factual premise. Recommendations must be explicitly MarketLense-authored, conditional and traceable to supplied evidence. Do not invent predictions, causality, business impact, budget movement, performance effects, operational benefits or mandatory actions. If evidence does not support a distinct implication or action, remain descriptive or omit it.
  - Classify source-derived factual statements as factual and MarketLense-authored recommendations as recommendation; never present a recommendation as a source claim.
  - Do not introduce new metrics, benchmarks, projections, or assumptions
  - Do not generalize beyond what the report explicitly supports
  - For each factual detail, use the most specific supplied evidence ID that states that detail. A broad coverage finding supports only the broad topics it names; when a DocMap section itself lists more specific topics, cite that section ID. Do not bind a detailed list or relationship to a broader finding that does not state it.
  - Preserve the source's modality and certainty. Do not strengthen language such as "insufficient" or "has limits" into a stronger claim such as "no longer describes" or "guarantees". Keep the proposition, scope, and qualifiers intact; otherwise omit or narrow the sentence.
  - If something is not clearly supported, omit it
  - Do not reference report pages, sections, evidence packs, evidence IDs, evidence spans, JSON fields, or any internal document structure in `linkedin_post`.
  - `claim_provenance` is private retained metadata. Include one object for every material sentence or claim in `linkedin_post`, quoting the covered text as its `claim` (one object per sentence or consecutive sentence group; minor punctuation differences are resolved mechanically), a `classification` of `factual`, `interpretive`, or `recommendation`, and the exact supporting `evidence_ids` from the supplied context. A factual claim must have at least one evidence ID. Do not put these identifiers in the public prose.
  - Before returning, privately segment the completed post and audit `claim_provenance` coverage. Include attribution, transition, question, and interpretive bridge sentences; if a sentence cannot be classified and bound, omit that sentence from `linkedin_post` rather than omit its private binding.

  Output:
  - Valid JSON only, shaped as `{"linkedin_post": "...", "claim_provenance": [{"claim": "...", "classification": "factual", "evidence_ids": ["..."]}]}`
  - No commentary, no explanations, no markdown
