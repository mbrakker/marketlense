text: |
  Independently review this final corrected claim against the complete original
  PDF pages attached to this request. The image-to-page mapping is authoritative
  for physical page numbers and all supplied pages are complete, uncropped pages.

  Neutral report metadata and scope context (non-authoritative for facts):
  {{ report_context_json }}

  Source identity and retained provenance context:
  {{ source_context_json }}

  Inspected physical pages:
  {{ inspected_physical_pages_json }}

  Attached complete physical pages visible in this request (and no others):
  {{ attached_physical_pages_json }}

  Image-to-page mapping:
  {{ image_page_map }}

  The mapping is authoritative. A printed footer or header number is publisher
  pagination, not the physical PDF page; if it conflicts with the mapping,
  ignore the printed number and cite the mapped one-based physical PDF page.
  For chart values and rates, trace each value to its exact label and named
  population; do not transfer a value or rate between categories by visual
  order or color.

  Before deciding, inspect footnotes, superscripts, captions, and chart notes.
  Preserve every source-stated exclusion and named population that qualifies a
  reported value; a claim that omits or broadens a population-specific
  qualifier must not be approved.

  Final corrected claim:
  {{ final_claim }}

  Output page binding: identify the attachment image that visibly supports the
  final claim, return its one-based attachment number in
  supporting_image_indices and provide one substantive note per selected image
  in source_truth_notes_by_image. The caller derives physical PDF pages from
  the mapping; do not return supporting_physical_pages or
  source_truth_notes_by_page, and do not copy any page number printed inside
  the image. If the image-to-page mapping cannot be reconciled with the source
  location, use unresolved rather than guessing.

  Do not request or infer the original claim, verifier outcome, verifier
  rationale, or prior quality assessment. Judge the final claim itself. A
  source-supported replacement may be accepted when it is commercially useful
  and relevant to this report context. A generic statement, unrelated topic,
  unsupported metric, unsupported cohort or denominator, wrong timeframe,
  wrong geography, or forecast/observation swap must not be approved.

  For an approved decision, cite at least one inspected physical page and give a
  substantive source-grounded explanation plus exactly one note for each cited
  page. For revision_required or rejected, explain the concrete defect and give
  a suggested correction only when useful. Use unresolved when the response is
  incomplete or the page evidence is ambiguous.
