text: |
  Review this complete public-item batch and its report_scope. The
  evidence_text values and any complete verified_facts objects are retained
  source context for the listed evidence_ids; do not borrow evidence or
  metric fields between items. Use report_scope only to assess the report as
  a whole, while preserving each item's own source bindings. Use the
  public_content surface_role and reuse_guidance fields to distinguish
  intentional cross-surface reuse from repeated primary analysis.

  {{ public_items_json }}

  Return exactly one verdict per item with the item's exact item_id, and one
  report_verdict covering material_coverage, analytical_depth, distinctness,
  and limitations. Include a substantive reason for every fail or unresolved
  item or report dimension. For a missing,
  insufficient, or unavailable source binding, use an empty evidence_ids list
  and identify that condition with rule_id
  public_editorial_quality.material_claim_evidence_missing or hard_fail_class
  missing_evidence, insufficient_evidence, or evidence_unavailable; never
  invent an evidence ID. For contradictions or other evidence-backed failures,
  preserve the evidence IDs that support that reason. Use only the item's
  allowed_repair_target for a localized repair; otherwise return an empty
  repair_target. A report-level repair must identify the affected item and use
  that item's allowed target, while a report-level evidence_ids value must stay
  inside report_scope. A factual_claim must retain appropriate item evidence.
  A purely interpretive or prescriptive item may pass without a direct item
  evidence ID only when the reason makes clear that it is a specific,
  commercially relevant, defensible and non-misleading editorial inference or
  recommendation with no hidden empirical premise. A purely editorial-quality
  fail or unresolved item with no claim-specific evidence may use
  evidence_ids=[] only when the independently reviewed classification is
  analyst_interpretation or prescriptive_recommendation, rule_id matches
  public_editorial_quality.semantic_*, hard_fail_class is editorial_quality,
  and the reason identifies a substantive analytical or commercial-quality
  defect. Do not use that allowance for a factual, source-grounded, number,
  population, timeframe, attribution, causal or guaranteed business assertion.

  If report_scope.original_editorial_plan_coverage includes
  original_essential_obligations, add exactly one
  original_essential_obligation_assessments object for each exact obligation
  theme. Use status covered, partial, or uncovered; cite only the obligation's
  authorized evidence_ids; list the final insight or public item IDs that
  support the assessment; and give a substantive explanation. One final item
  may support more than one obligation when it genuinely covers each one.
  Do not omit, duplicate, rename, or invent obligations, evidence IDs, or
  supporting items. A report_verdict status=pass requires every original
  essential obligation to be covered.
