text: |
  One bounded grounding batch (JSON). Review only the public items and retained
  claims listed here:
  {{ report_json }}

  Source text for corroborating those listed items (JSON):
  {{ evidence_json }}

  Authority policy: {{ authority_policy }}

  Task:
  Audit only the listed public inventory and retained claims. Return exactly
  one identity-matching verdict for every public item and one factual check for
  every retained claim. Rejected factual items also require a matching factual
  check. Apply the system's classification, source-fidelity, table/chart and
  violation-type rules; return only schema-valid JSON with `checks` and
  `unsupported` arrays.
