text: |
  Artifacts to validate (JSON):
  {{ report_json }}

  Evidence snippets (JSON):
  {{ evidence_json }}

  Task:
  - Review material sentences in insights (including `so_what` and `now_what`),
    quotes, summaries, expert comment, and LinkedIn post.
  - Treat `public_factual_items` as the authoritative atomic final-public
    inventory. Audit each item against its attached retained evidence and
    relevant report metadata; do not assess style, usefulness, or tone.
  - Apply the system's factual classification, source-fidelity, table/chart
    verification, and structured violation-type rules. Return only JSON with
    `checks` and `unsupported` arrays, without additional prose.
