text: |
  One bounded grounding batch (JSON). Review only the public items and retained
  claims listed here:
  {{ report_json }}

  Legacy source context for corroborating those listed items (JSON):
  {{ evidence_json }}

  Return one schema-valid `checks` verdict for every listed public item and
  retained claim. Include `item_id`, `classification`, `entailment_outcome`,
  `violation_type`, `proposition_status`, the complete `protected_facts` object,
  and a substantive `reason`. Use `violation_type` `none` only for entailed
  verdicts. Do not return `unsupported`, `section`, or `text` fields.
