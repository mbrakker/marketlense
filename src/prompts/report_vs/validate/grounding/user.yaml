text: |
  Artifacts to validate (JSON):
  {{ report_json }}

  Evidence snippets (JSON):
  {{ evidence_json }}

  Task:
  - Review each sentence in the artifacts (insights, quotes, summaries, expert comment, LinkedIn post).
  - Distinguish factual claims vs interpretation vs recommendations.
  - In `expert_comment` and `linkedin_post`, interpretation/recommendation text is allowed unless it introduces unsupported facts or numbers.
  - Mark unsupported only when one of these applies:
    1) hallucinated entity/event or unsupported factual assertion,
    2) unsupported number/new metric not present in evidence,
    3) misattributed quote,
    4) sentence claims the report instructed/recommended something that the report did not state.
  - Provide `classification`, `violation_type`, and a short `reason` for each unsupported sentence.
  - Keep the response as JSON with `unsupported` array only; omit additional prose.
