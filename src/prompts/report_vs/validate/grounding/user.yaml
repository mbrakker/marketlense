text: |
  Artifacts to validate (JSON):
  {{ report_json }}

  Evidence snippets (JSON):
  {{ evidence_json }}

  Task:
  - Review each material sentence in the artifacts: insights (including `so_what` and `now_what`), quotes, summaries, expert comment, and LinkedIn post.
  - Classify every material sentence as `factual_claim`, `analyst_interpretation`, or `prescriptive_recommendation`. A factual sentence remains factual when it appears in creative or consultancy-style prose.
  - An interpretation may use stronger editorial wording than the source when it reasonably follows from supported evidence and adds no factual premise. A recommendation may be MarketLense-authored, need not appear in the source, and may say a brand should reconsider treating something as experimental when the supported evidence logically warrants it.
  - Reject an interpretation or recommendation that adds an unsupported fact or metric, causal outcome, certainty, operational or financial benefit, or false source attribution. Do not label MarketLense-authored advice as a report recommendation unless the report actually recommends it.
  - For each factual claim, decide whether its linked retained evidence entails its material meaning. Do not use lexical overlap, copied wording, or vocabulary similarity as the test.
  - For a claim drawn from a chart or table, verify the complete source tuple:
    value, metric/category, subject or cohort, denominator, geography, and
    period/status. A numeric match elsewhere in the same visual does not entail
    the claim. Never move a value between rows, columns, legend labels, cohorts,
    or denominators.
  - Treat supplied retained evidence as a claim to verify, not as an authority.
    When it describes a table or chart, use file_search to inspect the source
    visual or its surrounding text. If the source assigns the same value to a
    different cohort, category, or denominator, mark the claim `contradicted`.
  - `entailed` permits synonyms, sentence restructuring, clause reordering, active/passive changes, concise executive wording, and canonically equivalent quantity displays only when material meaning is unchanged.
  - `contradicted` means the linked retained evidence conflicts with the claim. `not_established` means the linked retained evidence does not establish the claim.
  - A claim is not entailed if it changes factual proposition, number/unit/currency/magnitude, direction, timeframe, geography, population/segment, comparison baseline, forecast vs observed status, attribution, certainty, or causality.
  - For every material factual claim, add a `checks` entry. Set each protected
    dimension's `claim_value` and `evidence_value` to its literal text when
    present; otherwise use null and `unknown`. Never fill an unknown dimension
    by inference. Use `incompatible` for a changed value, unit/currency,
    magnitude, direction, timeframe, geography, population/segment/sample,
    comparison relationship/baseline, observed/forecast/estimate/target status,
    source attribution, certainty/modal strength, or causal relationship.
  - A creative paraphrase is `entailed` only when the factual proposition and
    every present protected dimension are compatible. Do not turn respondents
    into companies, a forecast into an observation, association into causation,
    or may/could/expect into will/guarantees.
  - Mark unsupported only when one of these applies:
    1) factual `contradicted` or factual `not_established` assertion,
    2) unsupported number/new metric not present in evidence,
    3) misattributed quote,
    4) sentence claims the report instructed/recommended something that the report did not state,
    5) interpretation/recommendation adds an unsupported causal outcome, certainty, operational or financial benefit, factual premise, metric, or source attribution.
  - For a factual semantic failure, provide `classification`, `entailment_outcome`, `violation_type`, and a short `reason`. For a rejected interpretation or recommendation, provide `classification`, `violation_type`, and a short `reason`. Do not include acceptable sentences.
  - Keep the response as JSON with `checks` and `unsupported` arrays only; omit additional prose.
