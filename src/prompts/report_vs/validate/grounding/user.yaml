text: |
  One bounded grounding batch (JSON). Review only the public items and retained
  claims listed here:
  {{ report_json }}

  Source text for corroborating those listed items (JSON):
  {{ evidence_json }}

  Task:
  - Treat the listed `public_factual_items` as the complete public inventory
    for this batch. Audit each against its attached retained evidence.
  - Return one identity-matching factual check for every listed
    `retained_claims_to_ground` item, including supported claims.
  - Apply the system's factual classification, source-fidelity, table/chart
    verification, and structured violation-type rules. Return only JSON with
    `checks` and `unsupported` arrays, without additional prose.
