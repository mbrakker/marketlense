text: |
  Correct one shortlisted claim using the complete original PDF page attached
  to this request.

  Original claim and retained binding:
  {{ claim_json }}

  Image-to-page mapping (one-based physical PDF pages, in attachment order):
  {{ image_page_map }}

  The mapping is authoritative. A printed footer or header number is publisher
  pagination, not the physical PDF page; if it conflicts with the mapping,
  ignore the printed number. Trace every chart value or rate to its exact label
  and named population; do not transfer values between categories by visual
  order or color.

  This is correction attempt {{ attempt }}. If present, the independent verifier
  rejected the previous attempt for these source-based reasons. Repair only what
  the page supports and reread the complete page:
  {{ retry_feedback }}

  Return only the correction JSON required by the system prompt. Do not return
  evidence IDs, page numbers, spans, or protected fields for the caller to copy;
  those remain authoritative in the retained candidate.
