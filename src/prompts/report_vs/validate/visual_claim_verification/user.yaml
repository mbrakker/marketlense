text: |
  Independently verify the corrected claim below against the complete original
  PDF page attached to this request.

  Source identity and retained binding context:
  {{ source_json }}

  Image-to-page mapping (one-based physical PDF pages, in attachment order):
  {{ image_page_map }}

  The mapping is authoritative. A printed footer or header number is publisher
  pagination, not the physical PDF page; if it conflicts with the mapping,
  ignore the printed number and cite the mapped one-based physical PDF page.
  For chart values and rates, trace each value to its exact label and named
  population; do not transfer a value or rate between categories by visual
  order or color.

  Original claim (analytical direction only; not factual authority):
  {{ original_claim | default("") }}

  Original evidence and metric are discovery context only. Do not copy them into
  the authoritative result unless the inspected source page independently supports
  them. The verified fact must describe the final corrected claim, including its
  own population, metric, timeframe, geography, cohort, denominator and
  observation/forecast status.

  Corrected claim:
  {{ corrected_claim }}

  Output page binding: identify the attachment image that visibly supports the
  corrected claim, then use the exact physical PDF page value from the mapping
  for supporting_physical_pages. Do not copy any page number printed inside
  that image. If the mapping cannot be reconciled with the source location,
  use unresolved rather than guessing.

  When outcome is verified, supporting_physical_pages must be a nonempty subset
  of inspected_physical_pages in source_json, and source_truth_notes_by_page
  must contain a substantive note for every listed page and no other page.
  Every inspected original or recovered PDF page is eligible to be cited when it visibly supports the corrected claim. Recovery candidates are inspection
  aids, not factual authority; do not cite a visibly irrelevant page, and do
  not promote provisional recovery evidence into the retained binding.

  Do not assume the claim is correct because another model produced it. Return
  only the verification JSON required by the system prompt. For a verified
  outcome, include an authoritative verified_fact with a source-grounded
  statement, a structured metric object when applicable, and bounded qualifiers.
  For a qualitative fact, use an empty metric object. Diagnostics must
  name exact unsupported or conflicting values, labels, populations, periods,
  status or analytical conclusions when rejecting the claim.
