text: |
  Search the report body for commercially meaningful findings across distinct
  sections. Treat page text and retrieved excerpts as discovery context, not
  visual proof. For charts and tables, preserve source labels, values and
  qualifications as a provisional hypothesis when their association requires
  visual inspection. Do not fabricate details or treat DocMap as source evidence.
  Include a verbatim source excerpt and one-based physical page for each finding.

