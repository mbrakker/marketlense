  identify additional material opportunities): {{ findings_existing_json }}

  Extracted temporal pairs are retrieval hints only; they do not establish chart
  relationships: {{ source_temporal_relationships_json }}

  {{ findings_targeted_fallback_instruction }}

  Return the required findings JSON object only.
