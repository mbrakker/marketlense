text: |
  Primary pass: search file_search by section/title/page and each key-point
  metric; seek directional body outcomes with subject, value, and period. If
  hits show only introduction, sample, or methodology, refine to mapped body.
  DocMap is a clue,
  not evidence; printed page labels guide retrieval but are not PDF offsets.
  Quote verbatim body evidence; cite the physical PDF page index in pages.
  For every finding, its evidence excerpt must independently contain every
  number and the exact subject, cohort, and period stated in the finding text.
  Section titles and DocMap summaries cannot supply missing links. Use a longer
  verbatim span when needed, or omit the claim.

  {{ doc_map_sections_json }}

  {{ findings_target_source_pages_json }}

  Deterministic retained-source label/value pairs bind periods and override
  ambiguous file_search chart readings; preserve order or omit unsupported
  pairs.

  {{ source_temporal_relationships_json }}

  Bind chart/table values to measure, subject/cohort, geography, and period.
  Keep chart values exact. Percentages do not establish a share; state a share
  only when the source names its base. Do not transfer nearby values across
  rows/cohorts; omit uncertain tuples.

  Cover distinct or counterbalancing supported sections; related subtopics
  cannot replace supported sides. Do not invent counterpoints or pad sparse
  reports.

  Retain only materially central, source-backed publisher forecasts with
  substantive synthesis (e.g., an opening takeaway). Label forecasts; name the
  publisher if identified, keep caveats, and allow alongside current-state
  data. Page position, repetition, or promotional copy alone do not establish
  centrality.

  Each finding: id, text, evidence, confidence, DocMap section_id/title (or ""),
  and pages.

  Return JSON only: {"findings": [], "not_found_reason": ""}

  If retrieved body evidence supports a material key point, include it as a
  finding. Primary pass: exhaust mapped body searches before summary-only
  findings. Return empty only if body searches find no direct support; set
  not_found_reason to findings_not_found.

  {{ findings_targeted_fallback_instruction }}
