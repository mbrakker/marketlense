text: |
  Extract the top findings from file_search evidence.
  For each finding include:
  - id
  - text
  - evidence
  - confidence
  - pages

  Return JSON only:
  {
    "findings": [],
    "not_found_reason": ""
  }

  If no findings are supported by evidence:
  {"findings": [], "not_found_reason": "findings_not_found"}
