text: |
  Extract concise findings from file_search evidence using the following DocMap
  major sections to guide retrieval. The DocMap is planning context only: every
  finding and its evidence must still be grounded in file_search.

  {{ doc_map_sections_json }}

  The following deterministic source label/value relationships are binding
  whenever a finding uses the listed period and value. They are extracted from
  the retained source text, so they take precedence over an ambiguous
  file_search rendering of the same chart. Do not omit, reorder, or reassociate
  a listed pair; if it cannot be supported, omit the metric from the finding.

  {{ source_temporal_relationships_json }}

  For a chart or table finding, verify one complete source tuple before writing
  it: value, metric/category, subject or cohort, denominator, geography, and
  period/status. Use file_search to inspect the actual row, column, or legend.
  A number visible elsewhere in the same chart is not evidence for a different
  row, cohort, category, or denominator. Omit a numeric finding when the exact
  tuple cannot be established.

  Prefer distinct supported sections when the report contains multiple major
  themes. When materially different or counterbalancing major DocMap sections
  exist and file_search supports them, retrieve evidence from both sides. Do
  not treat multiple close subtopics from one side as sufficient coverage when
  another material side is supported. Do not manufacture a counterpoint or pad
  a narrow, sparse, or one-sided report: return only the findings the
  file_search evidence supports.

  Retain a source-backed publisher forecast when it is materially central to
  the report's stated argument and supported by substantive synthesis such as
  executive-summary or opening-takeaway repetition. Keep it explicitly framed
  as a forecast, name the publisher when the source identifies it, and retain
  any source caveat. A central forecast may remain alongside a current-state
  metric on the same theme. Page position, repetition alone, and promotional
  copy are not sufficient.

  For each finding include:
  - id
  - text
  - evidence
  - confidence
  - section_id (copy the matching DocMap id, or "")
  - section_title (copy the matching DocMap title, or "")
  - pages

  Return JSON only:
  {
    "findings": [],
    "not_found_reason": ""
  }

  If no findings are supported by evidence:
  {"findings": [], "not_found_reason": "findings_not_found"}
