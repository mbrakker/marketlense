text: |
  Extract quote candidates from file_search evidence.
  Prefer high-signal statements suitable for summaries and publishing.

  Return JSON only:
  {
    "quote_candidates": [],
    "not_found_reason": ""
  }

  Each quote candidate should include id, text, source, and page.
  If none are grounded in evidence:
  {"quote_candidates": [], "not_found_reason": "quote_candidates_not_found"}
