text: |
  Extract report scope from file_search results.
  Include:
  - primary subject or domain
  - geographic coverage (if explicit)
  - timeframe or period (if explicit)

  Return JSON only using:
  {
    "scope": "...",
    "not_found_reason": ""
  }

  If no grounded scope is available, return:
  {"scope": "", "not_found_reason": "scope_not_found"}
