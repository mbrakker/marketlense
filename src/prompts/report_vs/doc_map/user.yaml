text: |
  Return a JSON object matching the DocMap schema.
  Use only the provided report content.

  Requirements:
  - Include document-level metadata in canonical schema fields:
    - title
    - publisher
    - summary (document-level brief)
  - Preserve source provenance roles in `provenance_roles`; none is required when unsupported.
    - `publisher_name` and `publication_name`: only explicit publication/site/report branding, then explicit report publisher, then copyright/report owner.
    - `author_names`: only an explicit named or corporate byline. A byline is not a publisher.
    - `data_provider_names`: organizations cited as data or research sources. A cited provider is never a publisher merely because it appears in report prose.
    - `source_organization_names` and `report_owner_name`: only when explicitly stated.
    - Each populated role needs a short exact `source_excerpt` in `evidence`.
  - Use `publisher` only for an explicitly named publisher or organization that is the publisher/publication identity. Leave it empty if source evidence is ambiguous; do not infer it from a filename, taxonomy, cited provider, or byline.
  - Capture all major report sections in source order.
  - Read each section through the next heading, including continuation pages;
    list every explicit printed page containing section evidence, not only its opener.
  - For each section, include:
    - id
    - title
    - summary (1-2 concise, specific sentences)
    - key_points (2-4 short strings when available)
    - pages and references (all explicit printed pages)
  - For each section, state its strongest source result in `key_points`, not
    just its theme, when present. Preserve exact metrics, periods, causes,
    mechanisms, and contrasts beyond the summary.
  - Keep inclusive page ranges intact; never infer missing endpoints.
  - Use schema field names exactly (for example `title`, not `document_title`).
  - Do not substitute runtime metadata for report content. Report IDs, vector-store IDs,
    file names, pack names, field names, and metadata-only sections are not a document map.
    Include a source-derived document brief and at least one section with subject-specific
    content whenever the report contains readable content.
  - If a field is unknown, use an empty string or empty array (do not invent values).
  - For ordered charts, tables, and metric series, keep each value attached to its displayed year, forecast period, quarter, category, or row. Do not infer a label from an adjacent value.
  - For each table or chart with multiple measures, state every numeric value
    beside its explicit row and column labels in `key_points` (for example,
    `Region A: Measure 1 10%; Measure 2 20%`). Do not emit bare ordered value
    lists that require later stages to infer a label from column order. If the
    source layout does not establish a pair, omit that numeric pair.
  - For each numeric chart/table key point, include its displayed title/axis
    period; list every supporting one-based printed page in the section's pages.
    Do not infer periods or use PDF page indices.
  - Output JSON only (no markdown, no commentary).
