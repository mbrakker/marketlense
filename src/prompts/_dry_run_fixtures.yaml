  cross_report_signal_scores_json: &cross_report_signal_scores_json >-
    [{"signal_id":"signal-ai","label":"AI","evidence_ids":["ev-report-a-claim-1","ev-report-b-finding-1"],"component_scores":{"recurrence":1.0,"diversity":1.0,"recency":1.0,"taxonomy_fit":1.0,"support":1.0,"contradiction":1.0},"total_score":5.5,"reasons":["raw_metric_magnitude_ignored"]}]
