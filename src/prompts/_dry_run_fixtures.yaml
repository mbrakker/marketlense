    {"request_id":"cross-report-fixture","topic":"AI commerce adoption","auto_theme":true,"category_filters":["Retail"],"tag_filters":["AI"],"publisher_filters":[],"date_range_start":"2026-05-01","date_range_end":"2026-05-31","publication_mode":"generate_only"}
