    {"theme_id":"theme-tag-ai","label":"AI commerce adoption","matched_tags":["AI"],"matched_categories":["Retail"],"source_report_ids":["report-a","report-b"],"score_components":{"density":1.0,"diversity":1.0,"recency":1.0}}
