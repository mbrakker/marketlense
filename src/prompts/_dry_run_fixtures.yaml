    [{"evidence_id":"ev-report-a-claim-1","report_id":"report-a","publisher":"Publisher A","content_class":"claim","text":"AI commerce adoption is increasing in retail teams.","source_metadata":{"page":4}},{"evidence_id":"ev-report-b-finding-1","report_id":"report-b","publisher":"Publisher B","content_class":"finding","text":"AI commerce adoption is declining in budget-constrained retail teams.","source_metadata":{"page":7}}]
