schema_version: "1.0"
playbook_id: "generic-email-form"
version: "1.0.0"
status: "active"
updated_at: "2026-05-06T00:00:00+00:00"
stale_after_days: 120
publisher_pattern: "Publisher-agnostic gated report forms and whitepaper registration pages"
host_patterns:
  - "*"
url_path_markers:
  - "download"
  - "whitepaper"
  - "ebook"
  - "register"
  - "gate"
  - "form"
route_family: "browser_email_form"
route_kind: "email_delivery"
summary: "Inspect the report form, fill only configured identity values, verify required fields and post-submit confirmation, and return typed blockers for missing values."
steps:
  - schema_version: "1.0"
    action: "inspect_form"
    target: "visible report download or registration form"
    verification: "encountered_form_fields lists required labels"
  - schema_version: "1.0"
    action: "fill_identity"
    target: "configured identity values and selected delivery email"
    verification: "required fields retain configured values after blur"
  - schema_version: "1.0"
    action: "submit_form"
    target: "primary submit/download button"
    verification: "confirmation text, URL change, form disappearance, or disabled/replaced submit button"
  - schema_version: "1.0"
    action: "classify_blocker"
    target: "missing identity or unresolved dropdown/autocomplete"
    verification: "typed blocked reason instead of guessed values"
traps:
  - "Do not invent missing identity values."
  - "Do not stop on transient text such as Please Wait before final confirmation or blocker text."
  - "Do not treat an unresolved searchable dropdown as a completed submission."
evidence_notes:
  - "Existing browser-download email-form guidance distinguishes required-field blockers, email-domain rejection, and autocomplete failures."
source_evidence:
  - "README browser-download gated-form handling"
  - "Mintel April 21 2026 Location autocomplete route evidence"
