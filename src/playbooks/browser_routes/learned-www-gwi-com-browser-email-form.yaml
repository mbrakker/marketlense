schema_version: '1.0'
playbook_id: learned-www-gwi-com-browser-email-form
version: 1.1.0
status: active
updated_at: '2026-08-22T20:25:00Z'
stale_after_days: 120
publisher_pattern: www.gwi.com
host_patterns:
- www.gwi.com
url_path_markers:
- reports
- new-american-consumer
route_family: browser_email_form
route_kind: email_delivery
summary: Accept the observed cookie banner, fill the native GWI lead form, and submit
  its shared HubSpot control. The submit label varies by report between 'Dive in' and
  'Get the data here'; canonical terminal verification determines whether the route
  yielded a direct document or confirmed email delivery.
steps:
- schema_version: '1.0'
  action: click
  target: Accept all
  verification: Cookie consent control accepted on a fresh browser session.
  selector_type: role
  selector: 'button:Accept all'
  expected_url_contains: /reports/
- schema_version: '1.0'
  action: fill
  target: First name
  verification: First-name field remains visible after deterministic fill.
  selector_type: label
  selector: First name*
  value_reference: ${identity.first_name}
  expected_text: First name
- schema_version: '1.0'
  action: fill
  target: Last name
  verification: Last-name field remains visible after deterministic fill.
  selector_type: label
  selector: Last name*
  value_reference: ${identity.last_name}
  expected_text: Last name
- schema_version: '1.0'
  action: fill
  target: Work email
  verification: Work-email field remains visible after deterministic fill.
  selector_type: label
  selector: Work email*
  value_reference: ${identity.work_email}
  expected_text: Work email
- schema_version: '1.0'
  action: select
  target: Company size
  verification: Native Company-size control remains visible after selection.
  selector_type: label
  selector: Company size*
  value_reference: ${identity.company_size}
  expected_text: Company size
- schema_version: '1.0'
  action: select
  target: Country
  verification: Native Country control remains visible after selection.
  selector_type: label
  selector: Country*
  value_reference: ${identity.country}
  expected_text: Country
- schema_version: '1.0'
  action: submit
  target: GWI lead-form submit
  verification: Native HubSpot submit control activated; normal terminal verification follows.
  selector_type: css
  selector: input.hs-button.primary.large
  expected_url_contains: /reports/
traps:
- Do not select an unconfigured Company-size option.
- Do not treat a form submit as a verified acquisition without normal terminal validation.
evidence_notes:
- Live Playwright inspection on 2026-08-22 observed native labels First name*, Last name*,
  Work email*, Company size*, and Country* on the retained GWI cohort.
- The same native HubSpot selector input.hs-button.primary.large is used for both 'Dive in'
  and 'Get the data here'; form placement and submit copy vary by report.
source_evidence:
- submit_observed
- delivery_text
- success_url
- form_disappeared
- network_confirmation_request
- structured_result
- verified
- email_delivery
- button_state_replaced
private_api_evidence: []
