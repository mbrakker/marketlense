schema_version: "1.0"

# Fresh isolated namespace for Task 2's bounded live manifest validation. It
# reuses the retained one-report cohort and inherits credentials from .env.
paths:
  output_dir: "./out/validation_manifest_task2_20260723"
  cache_dir: "./cache/validation_manifest_task2_20260723"
  state_db: "./state/validation_manifest_task2_20260723/index.sqlite"
  reports_db: "./state/validation_manifest_task2_20260723/reports.sqlite"
  signal_store_db: "./state/validation_manifest_task2_20260723/signals.sqlite"
  ingest_lock: "./state/validation_manifest_task2_20260723/ingest.lock"

ingest:
  run_budget:
    max_spend_usd: 1.0
    max_pdfs: 1
    max_retries: 2
    max_runtime_seconds: 3600
    limit_decision: "stop"

analysis:
  cost_ledger_path: "./state/validation_manifest_task2_20260723/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/validation_manifest_task2_20260723/llm_usage.sqlite"
  daily_path: "./state/validation_manifest_task2_20260723/llm_cost_daily.json"
  ledger_path: "./state/validation_manifest_task2_20260723/llm_cost_ledger.jsonl"

publish:
  projection_daily_path: "./state/validation_manifest_task2_20260723/projection_cost_daily.json"
  projection_ledger_path: "./state/validation_manifest_task2_20260723/projection_cost_ledger.jsonl"
