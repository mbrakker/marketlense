schema_version: "1.0"

# Isolated, bounded live validation for the fixed-cohort contract. It permits
# the real provider path through one report. This profile is used for ingest
# validation only; publishing is deliberately not invoked by this run.
paths:
  output_dir: "./out/task1_cohort_live_20260726"
  cache_dir: "./cache/task1_cohort_live_20260726"
  state_db: "./state/task1_cohort_live_20260726/index.sqlite"
  reports_db: "./state/task1_cohort_live_20260726/reports.sqlite"
  signal_store_db: "./state/task1_cohort_live_20260726/signals.sqlite"
  ingest_lock: "./state/task1_cohort_live_20260726/ingest.lock"

ingest:
  run_budget:
    max_spend_usd: 6.0
    max_pdfs: 1
    max_retries: 2
    max_runtime_seconds: 7200
    limit_decision: "stop"

analysis:
  cost_ledger_path: "./state/task1_cohort_live_20260726/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/task1_cohort_live_20260726/llm_usage.sqlite"
  daily_path: "./state/task1_cohort_live_20260726/llm_cost_daily.json"
  ledger_path: "./state/task1_cohort_live_20260726/llm_cost_ledger.jsonl"

publish:
  projection_daily_path: "./state/task1_cohort_live_20260726/projection_cost_daily.json"
  projection_ledger_path: "./state/task1_cohort_live_20260726/projection_cost_ledger.jsonl"
  run_budget:
    enabled: true
    max_wordpress_writes: 1
    limit_decision: "stop"
