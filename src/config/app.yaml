cost:
  ledger_path: "./out/cost-ledger.jsonl"
  daily_path: "./out/cost-daily.json"
  usage_db_path: "./state/llm_usage.sqlite"
  budget_authority:
    policy_version: "budget-authority-v2"
    reservation_ttl_seconds: 300
    # Each newly governed category can be rolled back independently without
    # deleting retained decision or accounting evidence.
    enabled_effect_kinds:
      - "llm_provider"
      - "embedding"
      - "ocr"
      - "vision"
      - "browser_use_model"
      - "vector_store"
      - "browser_launch"
      - "drive_read"
      - "drive_write"
      - "wordpress_write"
      - "pdf_process"
      - "retry"
      - "mailbox_read"
    # Scoped limits are opt-in unless an existing workflow-specific limit maps
    # to the same metric; this preserves the current successful default policy.
    run: {}
    day: {}
    publisher: {}
  daily_spend_warn_usd: 3.0
  daily_spend_pause_usd: 5.0
  daily_spend_stop_usd: 6.0
  daily_spend_overrides_allowed: false
  pricing_path: "./src/config/llm-costs.yaml"

workflow_queues:
  publisher_discovery: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 900, maximum_pending: 200, maximum_fanout: 100, budget_profile: publisher_inventory}
  report_acquisition: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 1200, maximum_pending: 500, maximum_fanout: 5, budget_profile: browser_acquisition}
  mailbox_delivery: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 900, maximum_pending: 100, maximum_fanout: 3, budget_profile: mailbox_delivery}
  source_ingest: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 1800, maximum_pending: 300, maximum_fanout: 3, budget_profile: report_ingest}
  report_selection: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 1800, maximum_pending: 150, maximum_fanout: 2, budget_profile: report_ingest}
  report_analysis: {enabled: true, max_workers: 5, max_attempts: 2, lease_seconds: 3600, maximum_pending: 100, maximum_fanout: 5, budget_profile: high_quality}
  report_render: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 1200, maximum_pending: 150, maximum_fanout: 5, budget_profile: report_render}
  analytics_projection: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 900, maximum_pending: 200, maximum_fanout: 5, budget_profile: analytics_projection}
  claim_embedding: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 900, maximum_pending: 500, maximum_fanout: 50, budget_profile: embedding}
  signal_candidate: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 900, maximum_pending: 100, maximum_fanout: 10, budget_profile: signal_candidate}
  signal_generation: {enabled: true, max_workers: 5, max_attempts: 2, lease_seconds: 3600, maximum_pending: 50, maximum_fanout: 5, budget_profile: high_quality}
  briefing_opportunity: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 600, maximum_pending: 300, maximum_fanout: 1, budget_profile: briefing_opportunity}
  briefing_generation: {enabled: true, max_workers: 5, max_attempts: 2, lease_seconds: 3600, maximum_pending: 25, maximum_fanout: 5, budget_profile: cross_report_analysis}
  cover_generation: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 1200, maximum_pending: 100, maximum_fanout: 5, budget_profile: cover_generation}
  publication_readiness: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 600, maximum_pending: 200, maximum_fanout: 2, budget_profile: publishing}
  wordpress_publish: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 900, maximum_pending: 100, maximum_fanout: 10, budget_profile: publishing}
  wordpress_projection: {enabled: true, max_workers: 5, max_attempts: 3, lease_seconds: 900, maximum_pending: 200, maximum_fanout: 5, budget_profile: wordpress_projection}

workflow_control:
  schema_version: "1.0"
  # Typed operational profiles compose the existing queue budgets, preflight
  # contracts and model-policy tiers. They never enable a reaper or bypass
  # validation/publication approval.
  run_profiles:
    safe_default:
      intended_outcome: "conservative cached-first execution"
      compatible_workflows: []
      cached_artifact_preference: "prefer"
      browser_allowance: "explicit_required"
      ocr_fallback_policy: "when_required"
      model_quality_tier: "default"
      regeneration_scope: "affected_only"
    fast_cached:
      intended_outcome: "planner-safe cache-first execution"
      compatible_workflows: ["report_generation", "cross_report_analysis"]
      budget_profile_refs: ["report_ingest"]
      minimum_regeneration_mode: "require_planner_safe"
      cached_artifact_preference: "require"
      browser_allowance: "restricted"
      ocr_fallback_policy: "restricted"
      regeneration_scope: "minimum"
    repair_failed:
      intended_outcome: "bounded failed-work repair"
      compatible_workflows: ["report_generation", "report_download", "publisher_inventory"]
      budget_profile_refs: ["report_ingest"]
      minimum_regeneration_mode: "affected_only"
      cached_artifact_preference: "require"
      requires_bounded_target: true
      regeneration_scope: "affected_only"
    publish_ready:
      intended_outcome: "publication readiness with human approval"
      compatible_workflows: ["publishing", "wordpress_sync"]
      budget_profile_refs: ["publishing"]
      minimum_regeneration_mode: "readiness_only"
      cached_artifact_preference: "require"
      browser_allowance: "restricted"
      ocr_fallback_policy: "restricted"
      publication_readiness_mode: "readiness_only"
      regeneration_scope: "readiness_only"
      human_publication_approval_required: true
    browser_acquisition:
      intended_outcome: "governed direct-first acquisition"
      compatible_workflows: ["report_download", "browser_acquisition", "publisher_inventory"]
      budget_profile_refs: ["browser_acquisition"]
      cached_artifact_preference: "prefer"
      browser_allowance: "allowed"
      ocr_fallback_policy: "restricted"
      concurrency_resource: "browser"
    cost_saver:
      intended_outcome: "restrictive cache-first cost control"
      compatible_workflows: []
      minimum_regeneration_mode: "require_planner_safe"
      cached_artifact_preference: "require"
      browser_allowance: "restricted"
      ocr_fallback_policy: "restricted"
      regeneration_scope: "minimum"
    high_quality:
      intended_outcome: "approved high-quality generation and validation"
      compatible_workflows: ["report_generation", "cross_report_analysis"]
      budget_profile_refs: ["high_quality", "cross_report_analysis"]
      cached_artifact_preference: "prefer"
      model_quality_tier: "high_quality"
      ocr_fallback_policy: "when_required"
      regeneration_scope: "affected_only"
  supervisor:
    schema_version: "1.0"
    # Enable only after read-only queue health and recovery evidence are reviewed.
    enabled: false
    materialize_outbox_enabled: true
    recover_expired_leases_enabled: true
    deferred_work_enabled: false
    remediation_enabled: false
    worker_batches_enabled: false
    reconcile_enabled: true
    evidence_enabled: true
    # Provider-wait work is validated at a bounded three-worker cap.
    max_parallel_workers: 3
    max_jobs_per_queue: 1
    max_total_jobs: 20
    max_runtime_seconds: 120
    lease_seconds: 180
  remediation_reaper:
    schema_version: "1.0"
    execution_enabled: false
    max_records_per_run: 10
    lease_seconds: 60
  deferred_work_reaper:
    schema_version: "1.0"
    # Rollback switch: false preserves records but prevents automatic leasing.
    execution_enabled: false
    max_records_per_run: 10
    lease_seconds: 60
    retry_delay_seconds: 3600
  preflight_profiles:
    report_generation:
      workflow: "report_generation"
      planned_side_effects: ["pdf", "model"]
      require_llm: true
      require_drive: false
      require_publish: false
      require_browser: false
      prompt_namespaces: []
    publisher_inventory:
      workflow: "publisher_inventory"
      planned_side_effects: ["network", "browser", "drive", "model"]
      require_llm: true
      require_drive: true
      require_publish: false
      require_browser: true
      prompt_namespaces:
        - "publisher_inventory/discovery"
        - "publisher_inventory/meaningful_candidate_screen"
    report_download:
      workflow: "report_download"
      planned_side_effects: ["network", "browser", "drive"]
      require_llm: false
      require_drive: true
      require_publish: false
      require_browser: true
      prompt_namespaces:
        - "browser_report_download/browser_route"
    cross_report_analysis:
      workflow: "cross_report_analysis"
      planned_side_effects: ["model", "analytics_store"]
      require_llm: true
      require_drive: false
      require_publish: false
      require_browser: false
      prompt_namespaces:
        - "cross_report_analysis/synthesis"
    publishing:
      workflow: "publishing"
      planned_side_effects: ["wordpress", "publish"]
      require_llm: false
      require_drive: false
      require_publish: true
      require_browser: false
      prompt_namespaces: []
    ui_replay:
      workflow: "ui_replay"
      planned_side_effects: ["filesystem"]
      require_llm: false
      require_drive: false
      require_publish: false
      require_browser: false
      prompt_namespaces: []
    wordpress_sync:
      workflow: "wordpress_sync"
      planned_side_effects: ["wordpress"]
      require_llm: false
      require_drive: false
      require_publish: true
      require_browser: false
      prompt_namespaces: []
    browser_acquisition:
      workflow: "browser_acquisition"
      planned_side_effects: ["network", "browser"]
      require_llm: false
      require_drive: false
      require_publish: false
      require_browser: true
      prompt_namespaces:
        - "browser_report_download/browser_route"
  retry_policies:
    report_generation:
      report_pipeline:
        policy_id: "report_generation.report_pipeline.v1"
        retries: 2
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
      doc_map:
        policy_id: "report_generation.doc_map.v1"
        retries: 2
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
    report_download:
      http_pdf:
        policy_id: "report_download.http_pdf.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
      browser_acquisition:
        policy_id: "report_download.browser_acquisition.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
      drive_archive:
        policy_id: "report_download.drive_archive.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
    publisher_inventory:
      discovery:
        policy_id: "publisher_inventory.discovery.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
    publishing:
      wordpress_publish:
        policy_id: "publishing.wordpress_publish.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
  workflow_contracts:
    report_generation:
      workflow: "report_generation"
      version: "1.0"
      states:
        - "pending"
        - "preflighted"
        - "source_prepared"
        - "selection_complete"
        - "analysis_complete"
        - "render_complete"
        - "processed"
        - "error"
      initial_state: "pending"
      transitions:
        - from_state: "pending"
          to_state: "preflighted"
          step_name: "preflight"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "preflighted"
          to_state: "source_prepared"
          step_name: "source_preparation"
          retry_policy_ref: "default.v1"
          side_effects: ["pdf"]
        - from_state: "source_prepared"
          to_state: "selection_complete"
          step_name: "figure_selection"
          retry_policy_ref: "default.v1"
          side_effects: ["pdf", "model"]
        - from_state: "selection_complete"
          to_state: "analysis_complete"
          step_name: "report_analysis"
          retry_policy_ref: "report_generation.report_pipeline.v1"
          side_effects: ["model"]
        - from_state: "analysis_complete"
          to_state: "render_complete"
          step_name: "render_projection"
          retry_policy_ref: "default.v1"
          side_effects: ["filesystem"]
        - from_state: "render_complete"
          to_state: "processed"
          step_name: "finish"
          retry_policy_ref: "default.v1"
          side_effects: []
      prerequisites:
        preflighted: ["preflight"]
      checkpoint_outputs:
        - "source_prepared"
        - "selection_complete"
        - "analysis_complete"
        - "render_complete"
      validation_gates:
        - "preflight"
        - "artifact_integrity"
        - "report_validation"
      terminal_outcomes:
        - "processed"
        - "skipped"
        - "error"
    publisher_inventory:
      workflow: "publisher_inventory"
      version: "1.0"
      states: ["pending", "preflighted", "running", "completed", "failed"]
      initial_state: "pending"
      transitions:
        - from_state: "pending"
          to_state: "preflighted"
          step_name: "preflight"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "preflighted"
          to_state: "running"
          step_name: "execute"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "running"
          to_state: "completed"
          step_name: "complete"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "running"
          to_state: "failed"
          step_name: "fail"
          retry_policy_ref: "default.v1"
          side_effects: []
      prerequisites:
        preflighted: ["preflight"]
      checkpoint_outputs: []
      validation_gates: ["preflight"]
      terminal_outcomes: ["completed", "failed"]
    report_download:
