schema_version: "1.0"

paths:
  output_dir: "./out"
  cache_dir: "./cache"
  state_db: "./state/index.sqlite"
  reports_db: "./state/reports.sqlite"
  signal_store_db: "./state/signals.sqlite"
  publisher_profiles: "./Wordpress/config/publisher-profiles.json"
  category_mappings: "./src/config/category-mappings.yaml"
  html_tag_acronyms: "./src/config/html-tag-acronyms.yaml"
  cover_styles: "./src/config/cover-styles.yaml"
  ingest_lock: "./state/ingest.lock"

ingest:
  google_sa_path: ""
  gdrive_folder_id: ""
  drive:
    auth_mode: "oauth_user"
    oauth_client_path: ""
    oauth_token_path: ""
    supports_all_drives: true
    include_items_from_all_drives: true
    drive_id: ""
    list_mode: "metadata"
  openai_model: "gpt-5-mini"
  temperature: 1.0
  taxonomy_temperature: 1.0
  timeout_seconds: 600
  llm:
    retries: 0
    base_delay_seconds: 0.0
    backoff_step_seconds: 0.0
    jitter_seconds: 0.0
    circuit_breaker_failure_threshold: 3
    circuit_breaker_recovery_seconds: 30.0
  lock_ttl_seconds: 7200
  seed: null
  batch_limit: 20
  worker_limit: 5
  report_worker_limit: 5
  source_quarantine:
    enabled: true
  admission:
    # Bounded, native-text source inspection before any vector-store or editorial model work.
    min_text_chars: 500
    max_pages: 250
    max_source_bytes: 104857600
    required_evidence_families:
      - "doc_map"
  run_budget:
    max_spend_usd: 6.0
    max_retries: 40
    max_runtime_seconds: 43200
    limit_decision: "stop"
  pdf_text:
    max_pages: 5
    max_chars: 80000
    min_density: 250
    sample_pages: 3
    native_confidence_threshold: 0.55
    native_page_confidence_threshold: 0.35
    ocr_fallback:
      enabled: false
      policy: "native_first_selective"
      model: "gpt-5-mini"
      timeout_seconds: 600
      prompt_namespace: "pdf_text/ocr_fallback"
      cache_enabled: true
      chunk_page_count: 8
  figure_captions:
    enabled: false
    temperature: 0.2
    timeout_seconds: 600
    prompt_namespace: "report_vs/figure_caption"
    max_chars: 500
  validation:
    data_gap_policy: "warn"
    regeneration_max_attempts: 3
    # A rule can be disabled only by placing its stable ID here with a concrete
    # release-waiver reason; empty entries do not disable a safety rule.
    public_editorial_quality:
      disabled_rule_waivers: {}
  contents_page:
    max_pages: 8
    min_headings: 3
    keywords:
      - "table of contents"
      - "contents"
      - "index"
    preview_enabled: true
    render_dpi: 144
  candidate_page_gate:
    enabled: true
    min_score: 0.2
    min_recall_pages: 12
    min_recall_page_fraction: 0.65
  evidence_packs:
    parallel_workers: 5
    global_max_in_flight: 5
    global_min_interval_ms: 250
    doc_map_max_attempts: 3
    doc_map_retry_delay_ms: 500
    registry:
      - "doc_map"
      - "scope"
      - "methods"
      - "findings"
      - "limitations"
      - "quote_candidates"
    enable_new_variety_packs: false
  artifacts:
    parallel_workers: 5
    global_max_in_flight: 5
    global_min_interval_ms: 250

openai_models:
  report_vs/artifacts: "gpt-5-mini"
  report_vs/artifacts/summary: "gpt-5-mini"
  report_vs/artifacts/cover_semantics: "gpt-5-mini"
  report_vs/artifacts/cover_semantics_repair: "gpt-5-mini"
  report_vs/artifacts/insights_candidates: "gpt-5-mini"
  report_vs/artifacts/insights_final: "gpt-5-mini"
  report_vs/artifacts/quotes: "gpt-5-mini"
  report_vs/artifacts/expert_comment: "gpt-5-mini"
  report_vs/artifacts/linkedin_post: "gpt-5-mini"
  report_vs/doc_map: "gpt-5-mini"
  report_vs/evidence_packs: "gpt-5-mini"
  report_vs/evidence_packs/scope: "gpt-5-mini"
  report_vs/evidence_packs/findings: "gpt-5-mini"
  report_vs/evidence_packs/limitations: "gpt-5-mini"
  report_vs/evidence_packs/methods: "gpt-5-mini"
  report_vs/evidence_packs/quote_candidates: "gpt-5-mini"
  report_vs/figure_caption: "gpt-5-mini"
  report_vs/validate/grounding: "gpt-5-mini"
  report_vs/taxonomy: "gpt-5-mini"
  rank_candidates: "gpt-5-mini"
  rank_candidates/crop_refine: "gpt-5-mini"

llm_routing:
  report_vs/artifacts:
    model: "gpt-5-mini"
    tier: routine_structured
    max_input_tokens: 48000
    compaction_enabled: true
    quality_threshold: 0.80
    same_provider_fallback: true
  report_vs/evidence_packs:
    model: "gpt-5-mini"
    tier: evidence_sensitive
    max_input_tokens: 64000
    compaction_enabled: true
    quality_threshold: 0.90
    same_provider_fallback: true
  rank_candidates:
    model: "gpt-5-mini"
    tier: quality_ranked
    max_input_tokens: 32000
    compaction_enabled: true
    quality_threshold: 0.85
    same_provider_fallback: true

# Canonical namespace-aware provider-call controls.  The legacy model and
# routing maps remain read-compatible while unmigrated non-report namespaces
# use the explicit compatibility adapter in the resolver.
llm_execution_policies:
  # Every active provider-backed prompt namespace resolves through this map by
  # exact match or the approved longest prefix. Provider retries remain zero;
  # workflow retries stay at the owning orchestrator.
  browser_report_download/browser_route:
    schema_version: "1.0"
    provider: openai
    model: "gpt-5-mini"
    temperature: 0.0
    seed_policy: inherit
    max_output_tokens: 2048
    retrieval_mode: chat_json
    timeout_seconds: 180
    provider_retry_count: 0
    structured_output_mode: json_object
    structured_output_schema_identity: "browser_route.v1"
    fallback_policy: same_provider_only
    pricing_key: "gpt-5-mini"
  browser_report_download/form_value_derivation:
    schema_version: "1.0"
