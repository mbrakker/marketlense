schema_version: "1.0"

paths:
  output_dir: "./out"
  cache_dir: "./cache"
  state_db: "./state/index.sqlite"
  reports_db: "./state/reports.sqlite"
  publisher_profiles: "./Wordpress/config/publisher-profiles.json"
  category_mappings: "./src/config/category-mappings.yaml"
  html_tag_acronyms: "./src/config/html-tag-acronyms.yaml"
  cover_styles: "./src/config/cover-styles.yaml"
  ingest_lock: "./state/ingest.lock"

ingest:
  google_sa_path: ""
  gdrive_folder_id: ""
  drive:
    auth_mode: "service_account"
    oauth_client_path: ""
    oauth_token_path: ""
    supports_all_drives: true
    include_items_from_all_drives: true
    drive_id: ""
    list_mode: "metadata"
  openai_model: "gpt-5-mini"
  temperature: 1.0
  taxonomy_temperature: 1.0
  timeout_seconds: 600
  llm:
    retries: 1
    base_delay_seconds: 1.0
    backoff_step_seconds: 1.0
    jitter_seconds: 0.25
    circuit_breaker_failure_threshold: 3
    circuit_breaker_recovery_seconds: 30.0
  lock_ttl_seconds: 7200
  seed: null
  batch_limit: 20
  worker_limit: 2
  report_worker_limit: 2
  pdf_text:
    max_pages: 5
    max_chars: 80000
    min_density: 250
    sample_pages: 3
    native_confidence_threshold: 0.55
    native_page_confidence_threshold: 0.35
    ocr_fallback:
      enabled: false
      policy: "native_first_selective"
      model: "gpt-5-mini"
      timeout_seconds: 600
      prompt_namespace: "pdf_text/ocr_fallback"
      cache_enabled: true
      chunk_page_count: 8
  figure_captions:
    enabled: false
    temperature: 0.2
    timeout_seconds: 600
    prompt_namespace: "report_vs/figure_caption"
    max_chars: 500
  validation:
    data_gap_policy: "warn"
    regeneration_max_attempts: 3
  contents_page:
    max_pages: 8
    min_headings: 3
    keywords:
      - "table of contents"
      - "contents"
      - "index"
    preview_enabled: true
    render_dpi: 144
  evidence_packs:
    parallel_workers: 3
    global_max_in_flight: 2
    global_min_interval_ms: 250
    doc_map_max_attempts: 3
    doc_map_retry_delay_ms: 500
    registry:
      - "doc_map"
      - "scope"
      - "methods"
      - "findings"
      - "limitations"
      - "quote_candidates"
    enable_new_variety_packs: false
  artifacts:
    parallel_workers: 4
    global_max_in_flight: 2
    global_min_interval_ms: 250

openai_models:
  report_vs/artifacts: "gpt-5-mini"
  report_vs/artifacts/summary: "gpt-5-mini"
  report_vs/artifacts/insights_candidates: "gpt-5-mini"
  report_vs/artifacts/insights_final: "gpt-5-mini"
  report_vs/artifacts/quotes: "gpt-5-mini"
  report_vs/artifacts/expert_comment: "gpt-5-mini"
  report_vs/artifacts/linkedin_post: "gpt-5-mini"
  report_vs/doc_map: "gpt-5-mini"
  report_vs/evidence_packs: "gpt-5-mini"
  report_vs/evidence_packs/scope: "gpt-5-mini"
  report_vs/evidence_packs/findings: "gpt-5-mini"
  report_vs/evidence_packs/limitations: "gpt-5-mini"
  report_vs/evidence_packs/methods: "gpt-5-mini"
  report_vs/evidence_packs/quote_candidates: "gpt-5-mini"
  report_vs/figure_caption: "gpt-5-mini"
  report_vs/validate/grounding: "gpt-5-mini"
  report_vs/taxonomy: "gpt-5-mini"
  rank_candidates: "gpt-5-mini"
  rank_candidates/crop_refine: "gpt-5-mini"

rank:
  model: "gpt-5-mini"
  temperature: 1.0
  timeout_seconds: 7200
  seed: null
  max_candidates: 40
  selected_max: 5
  min_overall_score: 78
  min_quality_score: 75
  min_insight_score: 75
  min_data_score: 70
  crop_refine_enabled: true
  crop_refine_mode: "adaptive"
  crop_refine_page_dpi: 110
  crop_refine_temperature: 0.0
  crop_refine_timeout_seconds: 7200

publish:
  wp:
    site_url: ""
    username: ""
    post_status: "publish"
    post_type: "ml_report"
    ssl_verify: true
  media_upload_workers: 4
  validation:
    policy: "block"

browser_download:
  model: "openai/gpt-5-mini"
  identity_config_path: "./browser_download_identity.yaml"
  temperature: 0.0
  timeout_seconds: 180
  max_steps: 30
  output_dir: "./out/browser_downloads"
  headed: false
  route_playbook_dir: "./src/playbooks/browser_routes"
  route_playbook_stale_policy: "fallback"
  route_playbook_promotion_mode: "write"
  private_api_playbook_promotion_mode: "write"
  private_api_playbook_min_success_count: 3
  private_api_playbook_min_distinct_source_urls: 2
  drive_upload:
    enabled: true
    required: true
  failure_forensics:
    enabled: true
    policy: "copy_artifacts"
  retry:
    retries: 1
    base_delay_seconds: 1.0
    backoff_step_seconds: 1.0
    jitter_seconds: 0.25

publisher_discovery:
  model: "openai/gpt-5-mini"
  temperature: 0.0
  timeout_seconds: 360
  max_steps: 30
  output_dir: "./out/publisher_inventory_discovery"
  prompt_namespace: "publisher_inventory/discovery"
  pagination_max_pages: 75
  http_timeout_seconds: 30
  command_time_budget_seconds: 570
  headed: false
  force_browser: false
  enable_deferred_candidate_recovery: true
  enable_structured_route_reuse: true
  enable_preflight_classifier_and_direct_detail: true
  retry:
    retries: 1
    base_delay_seconds: 1.0
    backoff_step_seconds: 1.0
    jitter_seconds: 0.25
  candidate_screening:
    enabled: true
    model: "gpt-5-nano"
    temperature: 1.0
    timeout_seconds: 120
    batch_size: 10
    prompt_namespace: "publisher_inventory/meaningful_candidate_screen"
  candidate_quality_check:
    enabled: true
    timeout_seconds: 15
    max_workers: 6
  resource_quality_ranking:
    enabled: true
    score_window_size: 5
    min_sample_size: 2
    consistency_weight: 0.35
    average_weight: 0.50
    confidence_weight: 0.15
    low_score_demotion_threshold: 45.0

analysis:
  vector_store_keep: true
  artifacts_use_vector_store: false
  validation_grounding_use_vector_store: false
  strict_schema_validation: true
  cost_ledger_path: "./out/cost-ledger.jsonl"

cross_report_analysis:
  enabled: false
  max_source_reports: 6
  max_evidence_items: 48
  max_prompt_chars: 60000
  prompt_namespace: "cross_report_analysis/synthesis"
  model: "gpt-5-mini"
  temperature: 1.0
  timeout_seconds: 600
  cache_enabled: true
  auto_theme_enabled: true
  theme_rotation_window_days: 30
  min_theme_source_publishers: 2
  publish_enabled: false
  publish_requires_validation_pass: true
  signal_score_weights:
    recurrence: 1.0
    diversity: 1.0
    recency: 1.0
    taxonomy_fit: 1.0
    support: 1.0
    contradiction: 0.5

cost:
  daily_path: "./out/cost-daily.json"
  pricing:
    gpt-5:
      input_tokens_per_1k_usd: 0.00125
      output_tokens_per_1k_usd: 0.0100
      tool_call_usd: 0.0025
    gpt-5-mini:
      input_tokens_per_1k_usd: 0.00025
      output_tokens_per_1k_usd: 0.002
      tool_call_usd: 0.0025
    gpt-5-nano:
      input_tokens_per_1k_usd: 0.00005
      output_tokens_per_1k_usd: 0.0004
      tool_call_usd: 0.0025
    o3:
      input_tokens_per_1k_usd: 0.002
      output_tokens_per_1k_usd: 0.008
      tool_call_usd: 0.0025
