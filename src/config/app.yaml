  validation:
    policy: "block"
  run_budget:
    enabled: true
    max_wordpress_writes: 30
    projection_pending_event_threshold: 50
    limit_decision: "stop"

browser_download:
  model: "gpt-5-mini"
  openrouter_model: "openai/gpt-5-mini"
  identity_config_path: "./browser_download_identity.yaml"
  temperature: 0.0
  timeout_seconds: 180
  max_steps: 30
  run_budget:
    enabled: true
    max_browser_launches: 30
    max_drive_writes: 30
    max_drive_reads: 120
    max_mailbox_reads: 24
    max_retries: 20
    max_runtime_seconds: 21600
    limit_decision: "stop"
  route_budgets:
    browser_email_form:
      timeout_seconds: 120
      max_steps: 18
    browser_pdf_click:
      timeout_seconds: 90
      max_steps: 12
    browser_tracker_redirect:
      timeout_seconds: 90
      max_steps: 12
    browser_listing_hub:
      timeout_seconds: 180
      max_steps: 30
    browser_onsite_report:
      timeout_seconds: 120
      max_steps: 16
  max_tokens: 12000
  accounting_queue_size: 256
  accounting_flush_timeout_seconds: 5
  output_dir: "./out/browser_downloads"
  headed: false
  warm_worker_pool:
    enabled: false
    max_workers: 5
    max_runs_per_worker: 5
    max_memory_mb: 768
    idle_ttl_seconds: 300
    fallback_to_subprocess: true
  captcha_handoff:
    enabled: true
    timeout_seconds: 120
  route_playbook_dir: "./src/playbooks/browser_routes"
  route_playbook_stale_policy: "fallback"
  route_memory_ttl_seconds: 2592000
  route_suppression:
    enabled: true
    minimum_sample_size: 3
    terminal_failure_threshold: 1.0
    ttl_seconds: 604800
    terminal_failure_classes:
      - "blocked_captcha"
      - "blocked_email_domain"
  route_playbook_promotion_mode: "write"
  private_api_playbook_promotion_mode: "write"
  private_api_playbook_min_success_count: 3
  private_api_playbook_min_distinct_source_urls: 2
  drive_upload:
    enabled: true
    required: true
    parent_folder_id: "1lavfpSqJIbGIbWQ1Z65_Kq4aKS6Qj_zB"
  failure_forensics:
    enabled: true
    policy: "copy_artifacts"
  retry:
    retries: 1
    base_delay_seconds: 1.0
    backoff_step_seconds: 1.0
    jitter_seconds: 0.25

mailbox_acquisition:
