schema_version: "1.0"

paths:
  output_dir: "./out"
  cache_dir: "./cache"
  state_db: "./state/index.sqlite"
  reports_db: "./state/reports.sqlite"
  signal_store_db: "./state/signals.sqlite"
  publisher_profiles: "./Wordpress/config/publisher-profiles.json"
  category_mappings: "./src/config/category-mappings.yaml"
  html_tag_acronyms: "./src/config/html-tag-acronyms.yaml"
  cover_styles: "./src/config/cover-styles.yaml"
  ingest_lock: "./state/ingest.lock"

ingest:
  google_sa_path: ""
  gdrive_folder_id: ""
  drive:
    auth_mode: "oauth_user"
    oauth_client_path: ""
    oauth_token_path: ""
    supports_all_drives: true
    include_items_from_all_drives: true
    drive_id: ""
    list_mode: "metadata"
  openai_model: "gpt-5-mini"
  temperature: 1.0
  taxonomy_temperature: 1.0
  timeout_seconds: 600
  llm:
    retries: 0
    base_delay_seconds: 0.0
    backoff_step_seconds: 0.0
    jitter_seconds: 0.0
    circuit_breaker_failure_threshold: 3
    circuit_breaker_recovery_seconds: 30.0
  lock_ttl_seconds: 7200
  seed: null
  batch_limit: 20
  worker_limit: 2
  report_worker_limit: 2
  pdf_text:
    max_pages: 5
    max_chars: 80000
    min_density: 250
    sample_pages: 3
    native_confidence_threshold: 0.55
    native_page_confidence_threshold: 0.35
    ocr_fallback:
      enabled: false
      policy: "native_first_selective"
      model: "gpt-5-mini"
      timeout_seconds: 600
      prompt_namespace: "pdf_text/ocr_fallback"
      cache_enabled: true
      chunk_page_count: 8
  figure_captions:
    enabled: false
    temperature: 0.2
    timeout_seconds: 600
    prompt_namespace: "report_vs/figure_caption"
    max_chars: 500
  validation:
    data_gap_policy: "warn"
    regeneration_max_attempts: 3
  contents_page:
    max_pages: 8
    min_headings: 3
    keywords:
      - "table of contents"
      - "contents"
      - "index"
    preview_enabled: true
    render_dpi: 144
  candidate_page_gate:
    enabled: true
    min_score: 0.2
    min_recall_pages: 12
    min_recall_page_fraction: 0.65
  evidence_packs:
    parallel_workers: 3
    global_max_in_flight: 2
    global_min_interval_ms: 250
    doc_map_max_attempts: 3
    doc_map_retry_delay_ms: 500
    registry:
      - "doc_map"
      - "scope"
      - "methods"
      - "findings"
      - "limitations"
      - "quote_candidates"
    enable_new_variety_packs: false
  artifacts:
    parallel_workers: 4
    global_max_in_flight: 2
    global_min_interval_ms: 250

openai_models:
  report_vs/artifacts: "gpt-5-mini"
  report_vs/artifacts/summary: "gpt-5-mini"
  report_vs/artifacts/cover_semantics: "gpt-5-mini"
  report_vs/artifacts/insights_candidates: "gpt-5-mini"
  report_vs/artifacts/insights_final: "gpt-5-mini"
  report_vs/artifacts/quotes: "gpt-5-mini"
  report_vs/artifacts/expert_comment: "gpt-5-mini"
  report_vs/artifacts/linkedin_post: "gpt-5-mini"
  report_vs/doc_map: "gpt-5-mini"
  report_vs/evidence_packs: "gpt-5-mini"
  report_vs/evidence_packs/scope: "gpt-5-mini"
  report_vs/evidence_packs/findings: "gpt-5-mini"
  report_vs/evidence_packs/limitations: "gpt-5-mini"
  report_vs/evidence_packs/methods: "gpt-5-mini"
  report_vs/evidence_packs/quote_candidates: "gpt-5-mini"
  report_vs/figure_caption: "gpt-5-mini"
  report_vs/validate/grounding: "gpt-5-mini"
  report_vs/taxonomy: "gpt-5-mini"
  rank_candidates: "gpt-5-mini"
  rank_candidates/crop_refine: "gpt-5-mini"

rank:
  model: "gpt-5-mini"
  temperature: 1.0
  timeout_seconds: 7200
  seed: null
  max_candidates: 40
  selected_max: 5
  min_overall_score: 78
  min_quality_score: 75
  min_insight_score: 75
  min_data_score: 70
  crop_refine_enabled: true
  crop_refine_mode: "adaptive"
  crop_refine_page_dpi: 110
  final_crop_dpi: 216
  crop_qa_escalation_enabled: false
  crop_qa_escalation_min_score: 72.0
  crop_qa_escalation_max_score: 82.0
  crop_qa_escalation_max_calls: 2
  crop_qa_escalation_max_repairs: 1
  crop_refine_temperature: 0.0
  crop_refine_timeout_seconds: 7200

publish:
  wp:
    site_url: ""
    username: ""
    post_status: "publish"
    post_type: "ml_report"
    ssl_verify: true
  media_upload_workers: 4
  validation:
    policy: "block"

browser_download:
  model: "gpt-5-mini"
  openrouter_model: "openai/gpt-5-mini"
  identity_config_path: "./browser_download_identity.yaml"
  temperature: 0.0
  timeout_seconds: 180
  max_steps: 30
  route_budgets:
    browser_email_form:
      timeout_seconds: 120
      max_steps: 18
    browser_pdf_click:
      timeout_seconds: 90
      max_steps: 12
    browser_tracker_redirect:
      timeout_seconds: 90
      max_steps: 12
    browser_listing_hub:
      timeout_seconds: 180
      max_steps: 30
    browser_onsite_report:
      timeout_seconds: 120
      max_steps: 16
  max_tokens: 12000
  accounting_queue_size: 256
  accounting_flush_timeout_seconds: 5
  output_dir: "./out/browser_downloads"
  headed: false
  warm_worker_pool:
    enabled: false
    max_workers: 1
    max_runs_per_worker: 3
    max_memory_mb: 768
    idle_ttl_seconds: 300
    fallback_to_subprocess: true
  captcha_handoff:
    enabled: true
    timeout_seconds: 120
  route_playbook_dir: "./src/playbooks/browser_routes"
  route_playbook_stale_policy: "fallback"
  route_memory_ttl_seconds: 2592000
  route_playbook_promotion_mode: "write"
  private_api_playbook_promotion_mode: "write"
  private_api_playbook_min_success_count: 3
  private_api_playbook_min_distinct_source_urls: 2
  drive_upload:
    enabled: true
    required: true
    parent_folder_id: "1lavfpSqJIbGIbWQ1Z65_Kq4aKS6Qj_zB"
  failure_forensics:
    enabled: true
    policy: "copy_artifacts"
  retry:
    retries: 1
    base_delay_seconds: 1.0
    backoff_step_seconds: 1.0
    jitter_seconds: 0.25

mailbox_acquisition:
  provider: "imap"
  output_dir: "./out/mailbox_acquisition"
  search_window_minutes: 120
  max_results: 10
  poll_timeout_seconds: 900
  poll_interval_seconds: 60
  gmail_oauth_client_path: ""
  gmail_oauth_token_path: ""
  gmail_user_id: "me"
  imap_host: ""
  imap_port: 993
  imap_user: ""
  imap_mailbox: "INBOX"

publisher_discovery:
  model: "openai/gpt-5-mini"
  temperature: 0.0
  timeout_seconds: 360
  max_steps: 30
  output_dir: "./out/publisher_inventory_discovery"
  prompt_namespace: "publisher_inventory/discovery"
  pagination_max_pages: 75
  http_timeout_seconds: 30
  command_time_budget_seconds: 570
  headed: false
  force_browser: false
  enable_deferred_candidate_recovery: true
  enable_structured_route_reuse: true
  enable_preflight_classifier_and_direct_detail: true
  retry:
    retries: 1
    base_delay_seconds: 1.0
    backoff_step_seconds: 1.0
    jitter_seconds: 0.25
  candidate_screening:
    enabled: true
    model: "gpt-5-nano"
    temperature: 1.0
    timeout_seconds: 120
    batch_size: 10
    prompt_namespace: "publisher_inventory/meaningful_candidate_screen"
  candidate_quality_check:
    enabled: true
    timeout_seconds: 15
    max_workers: 6
  resource_quality_ranking:
    enabled: true
    score_window_size: 5
    min_sample_size: 2
    consistency_weight: 0.35
    average_weight: 0.50
    confidence_weight: 0.15
    low_score_demotion_threshold: 45.0

analysis:
  vector_store_keep: true
  vector_store_retention_days: 30
  artifacts_use_vector_store: false
  validation_grounding_use_vector_store: false
  strict_schema_validation: true
  cost_ledger_path: "./out/cost-ledger.jsonl"

cross_report_analysis:
  enabled: false
  max_source_reports: 6
  max_evidence_items: 48
  max_prompt_chars: 60000
  prompt_namespace: "cross_report_analysis/synthesis"
  model: "gpt-5-mini"
  temperature: 1.0
  timeout_seconds: 600
  cache_enabled: true
  auto_theme_enabled: true
  theme_rotation_window_days: 30
  min_theme_source_publishers: 2
  publish_enabled: false
  publish_requires_validation_pass: true
  signal_score_weights:
    recurrence: 1.0
    diversity: 1.0
    recency: 1.0
    taxonomy_fit: 1.0
    support: 1.0
    contradiction: 0.5

cost:
  daily_path: "./out/cost-daily.json"
  usage_db_path: "./state/llm_usage.sqlite"
  daily_spend_warn_usd: 3.0
  daily_spend_pause_usd: 5.0
  daily_spend_stop_usd: 6.0
  daily_spend_overrides_allowed: false
  pricing_path: "./src/config/llm-costs.yaml"

workflow_control:
  schema_version: "1.0"
  preflight_profiles:
    report_generation:
      workflow: "report_generation"
      planned_side_effects: ["pdf", "model"]
      require_llm: true
      require_drive: false
      require_publish: false
      require_browser: false
      prompt_namespaces: []
    publisher_inventory:
      workflow: "publisher_inventory"
      planned_side_effects: ["network", "browser", "drive", "model"]
      require_llm: true
      require_drive: true
      require_publish: false
      require_browser: true
      prompt_namespaces:
        - "publisher_inventory/discovery"
        - "publisher_inventory/meaningful_candidate_screen"
    report_download:
      workflow: "report_download"
      planned_side_effects: ["network", "browser", "drive"]
      require_llm: false
      require_drive: true
      require_publish: false
      require_browser: true
      prompt_namespaces:
        - "browser_report_download/browser_route"
    cross_report_analysis:
      workflow: "cross_report_analysis"
      planned_side_effects: ["model", "analytics_store"]
      require_llm: true
      require_drive: false
      require_publish: false
      require_browser: false
      prompt_namespaces:
        - "cross_report_analysis/synthesis"
    publishing:
      workflow: "publishing"
      planned_side_effects: ["wordpress", "publish"]
      require_llm: false
      require_drive: false
      require_publish: true
      require_browser: false
      prompt_namespaces: []
    ui_replay:
      workflow: "ui_replay"
      planned_side_effects: ["filesystem"]
      require_llm: false
      require_drive: false
      require_publish: false
      require_browser: false
      prompt_namespaces: []
    wordpress_sync:
      workflow: "wordpress_sync"
      planned_side_effects: ["wordpress"]
      require_llm: false
      require_drive: false
      require_publish: true
      require_browser: false
      prompt_namespaces: []
    browser_acquisition:
      workflow: "browser_acquisition"
      planned_side_effects: ["network", "browser"]
      require_llm: false
      require_drive: false
      require_publish: false
      require_browser: true
      prompt_namespaces:
        - "browser_report_download/browser_route"
  retry_policies:
    report_generation:
      report_pipeline:
        policy_id: "report_generation.report_pipeline.v1"
        retries: 2
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
      doc_map:
        policy_id: "report_generation.doc_map.v1"
        retries: 2
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
    report_download:
      http_pdf:
        policy_id: "report_download.http_pdf.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
      browser_acquisition:
        policy_id: "report_download.browser_acquisition.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
      drive_archive:
        policy_id: "report_download.drive_archive.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
    publisher_inventory:
      discovery:
        policy_id: "publisher_inventory.discovery.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
    publishing:
      wordpress_publish:
        policy_id: "publishing.wordpress_publish.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
  workflow_contracts:
    report_generation:
      workflow: "report_generation"
      version: "1.0"
      states:
        - "pending"
        - "preflighted"
        - "source_prepared"
        - "selection_complete"
        - "analysis_complete"
        - "render_complete"
        - "processed"
        - "error"
      initial_state: "pending"
      transitions:
        - from_state: "pending"
          to_state: "preflighted"
          step_name: "preflight"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "preflighted"
          to_state: "source_prepared"
          step_name: "source_preparation"
          retry_policy_ref: "default.v1"
          side_effects: ["pdf"]
        - from_state: "source_prepared"
          to_state: "selection_complete"
          step_name: "figure_selection"
          retry_policy_ref: "default.v1"
          side_effects: ["pdf", "model"]
        - from_state: "selection_complete"
          to_state: "analysis_complete"
          step_name: "report_analysis"
          retry_policy_ref: "report_generation.report_pipeline.v1"
          side_effects: ["model"]
        - from_state: "analysis_complete"
          to_state: "render_complete"
          step_name: "render_projection"
          retry_policy_ref: "default.v1"
          side_effects: ["filesystem"]
        - from_state: "render_complete"
          to_state: "processed"
          step_name: "finish"
          retry_policy_ref: "default.v1"
          side_effects: []
      prerequisites:
        preflighted: ["preflight"]
      checkpoint_outputs:
        - "source_prepared"
        - "selection_complete"
        - "analysis_complete"
        - "render_complete"
      validation_gates:
        - "preflight"
        - "artifact_integrity"
        - "report_validation"
      terminal_outcomes:
        - "processed"
        - "skipped"
        - "error"
    publisher_inventory:
      workflow: "publisher_inventory"
      version: "1.0"
      states: ["pending", "preflighted", "running", "completed", "failed"]
      initial_state: "pending"
      transitions:
        - from_state: "pending"
          to_state: "preflighted"
          step_name: "preflight"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "preflighted"
          to_state: "running"
          step_name: "execute"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "running"
          to_state: "completed"
          step_name: "complete"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "running"
          to_state: "failed"
          step_name: "fail"
          retry_policy_ref: "default.v1"
          side_effects: []
      prerequisites:
        preflighted: ["preflight"]
      checkpoint_outputs: []
      validation_gates: ["preflight"]
      terminal_outcomes: ["completed", "failed"]
    report_download:
      workflow: "report_download"
      version: "1.0"
      states: ["pending", "preflighted", "running", "completed", "failed"]
      initial_state: "pending"
      transitions:
