schema_version: "1.0"

paths:
  output_dir: "./out"
  cache_dir: "./cache"
  state_db: "./state/index.sqlite"
  reports_db: "./state/reports.sqlite"
  category_mappings: "./src/config/category-mappings.yaml"
  cover_styles: "./src/config/cover-styles.yaml"
  ingest_lock: "./state/ingest.lock"

ingest:
  google_sa_path: "./sa.json"
  gdrive_folder_id: "11eruy9ojkd6HdOXK_Uwqvq1TWEKiINTW"
  drive:
    supports_all_drives: true
    include_items_from_all_drives: true
    drive_id: ""
    list_mode: "metadata"
  openai_model: "gpt-5"
  temperature: 1.0
  timeout_seconds: 7200
  lock_ttl_seconds: 7200
  seed: null
  batch_limit: 20
  worker_limit: 2
  report_worker_limit: 2
  debug_candidate_gallery: false
  cover_cache_enabled: true
  pdf_text:
    max_pages: 5
    max_chars: 80000
    min_density: 250
    sample_pages: 3
  validation:
    data_gap_policy: "warn"
  contents_page:
    max_pages: 8
    min_headings: 3
    keywords:
      - "table of contents"
      - "contents"
      - "index"
    preview_enabled: true
    render_dpi: 144
  evidence_packs:
    parallel_workers: 3
    global_max_in_flight: 2
    global_min_interval_ms: 250

openai_models:
  report_vs/artifacts: "gpt-5"
  report_vs/artifacts/toc: "gpt-5"
  report_vs/artifacts/summary: "gpt-5"
  report_vs/artifacts/insights_candidates: "gpt-5-mini"
  report_vs/artifacts/insights_final: "gpt-5"
  report_vs/artifacts/quotes: "gpt-5-mini"
  report_vs/artifacts/expert_comment: "gpt-5"
  report_vs/artifacts/linkedin_post: "gpt-5"
  report_vs/doc_map: "gpt-5"
  report_vs/evidence_packs: "o3"
  report_vs/evidence_packs/scope: "gpt-5-mini"
  report_vs/evidence_packs/findings: "o3"
  report_vs/evidence_packs/limitations: "o3"
  report_vs/evidence_packs/methods: "o3"
  report_vs/evidence_packs/quote_candidates: "gpt-5-mini"
  report_vs/validate/grounding: "o3"
  report_vs/taxonomy: "gpt-5-mini"
  rank_candidates: "gpt-5"

rank:
  model: "gpt-5"
  temperature: 1.0
  timeout_seconds: 7200
  seed: null
  max_candidates: 40

publish:
  wp:
    site_url: "http://marketlense.medianewsonline.com"
    username: "admin"
    post_status: "publish"
  validation:
    policy: "block"

analysis:
  vector_store_keep: true
  mirror_legacy_packs: true
  compare: false
  cost_ledger_path: "./out/cost-ledger.jsonl"

cost:
  daily_path: "./out/cost-daily.json"
  pricing:
    gpt-5:
      input_tokens_per_1k_usd: 0.00125
      output_tokens_per_1k_usd: 0.0100
      tool_call_usd: 0.0025
    gpt-5-mini:
      input_tokens_per_1k_usd: 0.00025
      output_tokens_per_1k_usd: 0.002
      tool_call_usd: 0.0025
    o3:
      input_tokens_per_1k_usd: 0.002
      output_tokens_per_1k_usd: 0.008
      tool_call_usd: 0.0025
