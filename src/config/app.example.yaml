schema_version: "1.0"

# Copy the keys you need into src/config/app.local.yaml or a separate config file
# referenced by MARKET_LENSE_CONFIG_PATH. Keep secrets in environment variables.

ingest:
  google_sa_path: ""
  gdrive_folder_id: "replace-with-drive-folder-id"
  drive:
    auth_mode: "oauth_user"
    oauth_client_path: "./google_oauth_client.json"
    oauth_token_path: "./google_oauth_token.json"
  candidate_page_gate:
    enabled: true
    min_score: 0.2
    min_recall_pages: 12
    min_recall_page_fraction: 0.65

publish:
  wp:
    site_url: "https://example.com"
    username: "admin"
    post_status: "publish"
    post_type: "ml_report"
    ssl_verify: true

browser_download:
  model: "google/gemini-2.5-flash-lite"
  max_tokens: 12000
  captcha_handoff:
    enabled: true
    timeout_seconds: 120
  route_playbook_promotion_mode: "disabled"
  private_api_playbook_promotion_mode: "disabled"
  private_api_playbook_min_success_count: 3
  private_api_playbook_min_distinct_source_urls: 2

mailbox_acquisition:
  provider: "imap"
  output_dir: "./out/mailbox_acquisition"
  search_window_minutes: 120
  max_results: 10
  poll_timeout_seconds: 900
  poll_interval_seconds: 60
  gmail_oauth_client_path: ""
  gmail_oauth_token_path: ""
  gmail_user_id: "me"
  imap_host: ""
  imap_port: 993
  imap_user: ""
  imap_mailbox: "INBOX"

publisher_discovery:
  model: "google/gemini-2.5-flash-lite"
  enable_deferred_candidate_recovery: true
  enable_structured_route_reuse: true
  enable_preflight_classifier_and_direct_detail: true
  resource_quality_ranking:
    enabled: true
    score_window_size: 5
    min_sample_size: 2
    consistency_weight: 0.35
    average_weight: 0.50
    confidence_weight: 0.15
    low_score_demotion_threshold: 45.0

workflow_control:
  preflight_profiles:
    report_download:
      workflow: "report_download"
      planned_side_effects: ["network", "browser", "drive"]
      require_llm: false
      require_drive: true
      require_publish: false
      require_browser: true
      prompt_namespaces:
        - "browser_report_download/browser_route"
  retry_policies:
    report_download:
      browser_acquisition:
        policy_id: "report_download.browser_acquisition.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
  workflow_contracts:
    report_download:
      workflow: "report_download"
      version: "1.0"
      states: ["pending", "preflighted", "running", "completed", "failed"]
      initial_state: "pending"
      transitions:
        - from_state: "pending"
          to_state: "preflighted"
          step_name: "preflight"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "preflighted"
          to_state: "running"
          step_name: "execute"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "running"
          to_state: "completed"
          step_name: "complete"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "running"
          to_state: "failed"
          step_name: "fail"
          retry_policy_ref: "default.v1"
          side_effects: []
      prerequisites:
        preflighted: ["preflight"]
      checkpoint_outputs: []
      validation_gates: ["preflight"]
      terminal_outcomes: ["completed", "failed"]
  concurrency:
    browser:
      min_limit: 1
      max_limit: 2
      default_limit: 1
      high_retry_rate: 0.20
      high_latency_ms: 10000
      low_retry_rate: 0.02
      low_latency_ms: 3000
  operational_memory:
    ttl_days: 30
    min_observations: 2
