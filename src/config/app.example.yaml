schema_version: "1.0"

# Copy the keys you need into src/config/app.local.yaml or a separate config file
# referenced by MARKET_LENSE_CONFIG_PATH. Keep secrets in environment variables.

ingest:
  google_sa_path: ""
  gdrive_folder_id: "replace-with-drive-folder-id"
  drive:
    auth_mode: "oauth_user"
    oauth_client_path: "./google_oauth_client.json"
    oauth_token_path: "./google_oauth_token.json"
  candidate_page_gate:
    enabled: true
    min_score: 0.2
    min_recall_pages: 12
    min_recall_page_fraction: 0.65
  source_quarantine:
    # Disable only for an operator-approved rollback; malformed sources will then
    # follow the normal typed failure path instead of being skipped early.
    enabled: true
  validation:
    data_gap_policy: "warn"
    regeneration_max_attempts: 3
    public_editorial_quality:
      # Each disabled rule requires an explicit, non-empty release-waiver reason.
      disabled_rule_waivers: {}
  run_budget:
    max_pdfs: 20
    max_retries: 40
    max_runtime_seconds: 43200
    limit_decision: "stop"

publish:
  wp:
    site_url: "https://example.com"
    username: "admin"
    post_status: "publish"
    post_type: "ml_report"
    ssl_verify: true
  run_budget:
    enabled: true
    max_wordpress_writes: 30
    limit_decision: "stop"

browser_download:
  model: "gpt-5-mini"
  openrouter_model: "openai/gpt-5-mini"
  max_tokens: 12000
  route_memory_ttl_seconds: 2592000
  route_suppression:
    enabled: true
    minimum_sample_size: 3
    terminal_failure_threshold: 1.0
    ttl_seconds: 604800
    terminal_failure_classes:
      - "blocked_captcha"
      - "blocked_email_domain"
  captcha_handoff:
    enabled: true
    timeout_seconds: 120
  route_playbook_promotion_mode: "disabled"
  private_api_playbook_promotion_mode: "disabled"
  private_api_playbook_min_success_count: 3
  private_api_playbook_min_distinct_source_urls: 2
  run_budget:
    enabled: true
    max_browser_launches: 30
    max_pdfs: 30
    max_drive_writes: 30
    max_drive_reads: 120
    max_mailbox_reads: 24
    max_retries: 20
    max_runtime_seconds: 21600
    limit_decision: "stop"

cost:
  usage_db_path: "./state/llm_usage.sqlite"
  budget_authority:
    policy_version: "budget-authority-v2"
    reservation_ttl_seconds: 300
    enabled_effect_kinds:
      - "llm_provider"
      - "embedding"
      - "ocr"
      - "vision"
      - "browser_use_model"
      - "vector_store"
      - "browser_launch"
      - "drive_read"
      - "drive_write"
      - "wordpress_write"
      - "pdf_process"
      - "retry"
      - "mailbox_read"
    run: {}
    day: {}
    publisher: {}

mailbox_acquisition:
  provider: "imap"
  output_dir: "./out/mailbox_acquisition"
  search_window_minutes: 120
  max_results: 10
  poll_timeout_seconds: 900
  poll_interval_seconds: 60
  gmail_oauth_client_path: ""
  gmail_oauth_token_path: ""
  gmail_user_id: "me"
  imap_host: ""
  imap_port: 993
  imap_user: ""
  imap_mailbox: "INBOX"

publisher_discovery:
  model: "google/gemini-2.5-flash-lite"
  enable_deferred_candidate_recovery: true
  enable_structured_route_reuse: true
  enable_preflight_classifier_and_direct_detail: true
  resource_quality_ranking:
    enabled: true
    score_window_size: 5
    min_sample_size: 2
    consistency_weight: 0.35
    average_weight: 0.50
    confidence_weight: 0.15
    low_score_demotion_threshold: 45.0

workflow_queues:
  # Durable controls seed from these conservative defaults. Operators pause,
  # drain, and resume queues through the queue CLI without editing this file.
  publisher_discovery: {enabled: true, max_workers: 1, max_attempts: 3, lease_seconds: 900, maximum_pending: 200, maximum_fanout: 100, budget_profile: publisher_inventory}
  report_acquisition: {enabled: true, max_workers: 2, max_attempts: 3, lease_seconds: 1200, maximum_pending: 500, maximum_fanout: 5, budget_profile: browser_acquisition}
  source_ingest: {enabled: true, max_workers: 1, max_attempts: 3, lease_seconds: 1800, maximum_pending: 300, maximum_fanout: 3, budget_profile: report_ingest}
  report_analysis: {enabled: true, max_workers: 1, max_attempts: 2, lease_seconds: 3600, maximum_pending: 100, maximum_fanout: 5, budget_profile: high_quality}
  briefing_generation: {enabled: true, max_workers: 1, max_attempts: 2, lease_seconds: 3600, maximum_pending: 25, maximum_fanout: 5, budget_profile: cross_report_analysis}
  wordpress_publish: {enabled: true, max_workers: 1, max_attempts: 3, lease_seconds: 900, maximum_pending: 100, maximum_fanout: 10, budget_profile: publishing}

workflow_control:
  # These profiles only select existing budget/preflight/model-policy controls.
  # Explicit CLI/UI selection wins; no-profile execution remains safe_default.
  run_profiles:
    safe_default:
      intended_outcome: "conservative cached-first execution"
      compatible_workflows: []
      cached_artifact_preference: "prefer"
      browser_allowance: "explicit_required"
      ocr_fallback_policy: "when_required"
      model_quality_tier: "default"
      regeneration_scope: "affected_only"
    fast_cached:
      intended_outcome: "planner-safe cache-first execution"
      compatible_workflows: ["report_generation", "cross_report_analysis"]
      budget_profile_refs: ["report_ingest"]
      minimum_regeneration_mode: "require_planner_safe"
      cached_artifact_preference: "require"
      browser_allowance: "restricted"
      ocr_fallback_policy: "restricted"
      regeneration_scope: "minimum"
    repair_failed:
      intended_outcome: "bounded failed-work repair"
      compatible_workflows: ["report_generation", "report_download", "publisher_inventory"]
      budget_profile_refs: ["report_ingest"]
      minimum_regeneration_mode: "affected_only"
      cached_artifact_preference: "require"
      requires_bounded_target: true
    publish_ready:
      intended_outcome: "publication readiness with human approval"
      compatible_workflows: ["publishing", "wordpress_sync"]
      budget_profile_refs: ["publishing"]
      minimum_regeneration_mode: "readiness_only"
      cached_artifact_preference: "require"
      browser_allowance: "restricted"
      ocr_fallback_policy: "restricted"
      publication_readiness_mode: "readiness_only"
      regeneration_scope: "readiness_only"
      human_publication_approval_required: true
    browser_acquisition:
      intended_outcome: "governed direct-first acquisition"
      compatible_workflows: ["report_download", "browser_acquisition", "publisher_inventory"]
      budget_profile_refs: ["browser_acquisition"]
      browser_allowance: "allowed"
      ocr_fallback_policy: "restricted"
      concurrency_resource: "browser"
    cost_saver:
      intended_outcome: "restrictive cache-first cost control"
      compatible_workflows: []
      minimum_regeneration_mode: "require_planner_safe"
      cached_artifact_preference: "require"
      browser_allowance: "restricted"
      ocr_fallback_policy: "restricted"
      regeneration_scope: "minimum"
    high_quality:
      intended_outcome: "approved high-quality generation and validation"
      compatible_workflows: ["report_generation", "cross_report_analysis"]
      budget_profile_refs: ["high_quality", "cross_report_analysis"]
      model_quality_tier: "high_quality"
      ocr_fallback_policy: "when_required"
  remediation_reaper:
    schema_version: "1.0"
    execution_enabled: false
    max_records_per_run: 10
    lease_seconds: 60
  deferred_work_reaper:
    schema_version: "1.0"
    execution_enabled: false
    max_records_per_run: 10
    lease_seconds: 60
    retry_delay_seconds: 3600
  preflight_profiles:
    report_download:
      workflow: "report_download"
      planned_side_effects: ["network", "browser", "drive"]
      require_llm: false
      require_drive: true
      require_publish: false
      require_browser: true
      prompt_namespaces:
        - "browser_report_download/browser_route"
  retry_policies:
    report_download:
      browser_acquisition:
        policy_id: "report_download.browser_acquisition.v1"
        retries: 1
        base_delay_seconds: 1.0
        backoff_step_seconds: 1.0
        jitter_seconds: 0.25
  workflow_contracts:
    report_download:
      workflow: "report_download"
      version: "1.0"
      states: ["pending", "preflighted", "running", "completed", "failed"]
      initial_state: "pending"
      transitions:
        - from_state: "pending"
          to_state: "preflighted"
          step_name: "preflight"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "preflighted"
          to_state: "running"
          step_name: "execute"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "running"
          to_state: "completed"
          step_name: "complete"
          retry_policy_ref: "default.v1"
          side_effects: []
        - from_state: "running"
          to_state: "failed"
          step_name: "fail"
          retry_policy_ref: "default.v1"
          side_effects: []
      prerequisites:
        preflighted: ["preflight"]
      checkpoint_outputs: []
      validation_gates: ["preflight"]
      terminal_outcomes: ["completed", "failed"]
  concurrency:
    browser:
      min_limit: 1
      max_limit: 2
      default_limit: 1
      high_retry_rate: 0.20
      high_latency_ms: 10000
      low_retry_rate: 0.02
      low_latency_ms: 3000
  operational_memory:
    ttl_days: 30
    min_observations: 2
