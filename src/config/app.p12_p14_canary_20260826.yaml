schema_version: "1.0"

# Temporary isolated runtime profile for the authorized P12/P14 sandbox canary.
# Secrets, browser identity, Drive parent, and WordPress target are environment-owned.
paths:
  output_dir: "./out/p12_p14_canary_20260826/output"
  cache_dir: "./cache/p12_p14_canary_20260826"
  state_db: "./state/p12_p14_canary_20260826/index.sqlite"
  reports_db: "./state/p12_p14_canary_20260826/reports.sqlite"
  signal_store_db: "./state/p12_p14_canary_20260826/signals.sqlite"
  ingest_lock: "./state/p12_p14_canary_20260826/ingest.lock"

ingest:
  run_budget:
    max_spend_usd: 6.0
    max_pdfs: 5
    max_retries: 10
    max_runtime_seconds: 28800
    limit_decision: "stop"

browser_download:
  output_dir: "./out/p12_p14_canary_20260826/output/browser_downloads"
  max_steps: 12
  timeout_seconds: 120
  run_budget:
    max_browser_launches: 8
    max_pdfs: 5
    max_drive_writes: 6
    max_drive_reads: 24
    max_mailbox_reads: 4
    max_retries: 10
    max_runtime_seconds: 14400
    limit_decision: "stop"

publisher_discovery:
  output_dir: "./out/p12_p14_canary_20260826/output/publisher_inventory_discovery"
  pagination_max_pages: 5
  command_time_budget_seconds: 300
  candidate_screening:
    batch_size: 5

analysis:
  cost_ledger_path: "./state/p12_p14_canary_20260826/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/p12_p14_canary_20260826/llm_usage.sqlite"
  daily_path: "./state/p12_p14_canary_20260826/llm_cost_daily.json"
  ledger_path: "./state/p12_p14_canary_20260826/llm_cost_ledger.jsonl"

publish:
  wp:
    post_status: "draft"
  projection_daily_path: "./state/p12_p14_canary_20260826/projection_cost_daily.json"
  projection_ledger_path: "./state/p12_p14_canary_20260826/projection_cost_ledger.jsonl"
  run_budget:
    enabled: true
    max_wordpress_writes: 64
    limit_decision: "stop"
