# Categories above this model fit score are reconciled against the deterministic
# inclusion, exclusion, and centrality evidence before they can remain rejected.
high_confidence_fit_threshold: 0.85
categories:
- id: chinese_online_platforms
  label: Chinese Online Platforms
  description: China-based ecommerce and social platforms, including marketplace and
    social commerce ecosystems.
  core_tags:
  - chinese_online_platforms
  - china_marketplaces
  - tmall
  - jd
  - pinduoduo
