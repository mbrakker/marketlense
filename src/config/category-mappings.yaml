  - taobao
  - aliexpress
  - shein
  - temu
  - wechat
  - crossborder_from_china
  semantic_concepts:
  - china platforms
  - chinese platforms
  - tmall
  - jd
  - taobao
  - douyin
  - pinduoduo
  - wechat
  definition: Reports whose dominant subject is the commercial, retail, advertising,
    or ecosystem behavior of China-origin digital platforms and super-apps.
  include_when:
  - Repeated evidence focuses on platform dynamics inside Tmall, JD, Taobao, Douyin,
    Pinduoduo, WeChat, or similar China-native ecosystems.
  - The report explains how Chinese platform structure, merchant models, or shopper
    behavior shape outcomes.
  exclude_when:
  - Reject when China platforms appear only as one example inside a broader marketplace
    or cross-border report.
  - Reject when the central subject is cross-border operations rather than the platform
    ecosystem itself.
