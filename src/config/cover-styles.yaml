schema_version: "1.0"

layout:
  width: 1600
  height: 900
  accent_width: 96
  margin_x: 120
  margin_y: 90
  label_font_size: 34
  title_font_max: 88
  title_font_min: 36
  publisher_font_size: 32
  time_font_size: 26
  title_line_spacing: 0.35
  label_gap: 24
  footer_gap: 28
  pill_padding_x: 20
  pill_padding_y: 10
  pill_radius: 18
  pill_border_width: 2
  pill_fill_color: "#FFFFFF"
  pill_text_color: "#0F172A"
  pill_border_color: "#FFFFFF"

defaults:
  background_color: "#0F172A"
  accent_color: "#38BDF8"
  text_color: "#F8FAFC"
  category_label: "Industry Report"
  font_regular_path: "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
  font_bold_path: "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
  background_image_path: ""

categories:
  technology:
    accent_color: "#6366F1"
    category_label: "Technology"
  healthcare:
    accent_color: "#22C55E"
    category_label: "Healthcare"
  energy:
    accent_color: "#F97316"
    category_label: "Energy"
  finance:
    accent_color: "#0EA5E9"
    category_label: "Finance"
  consumer:
    accent_color: "#EC4899"
    category_label: "Consumer"
