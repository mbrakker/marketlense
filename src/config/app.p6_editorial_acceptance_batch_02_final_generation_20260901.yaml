schema_version: "1.0"

# Final clean Batch 2 generation. Prior held attempts are retained for audit but
# are not available for source, editorial, analysis, or rendered-artifact reuse.
paths:
  output_dir: "./out/p6_editorial_acceptance/batch_02/pipeline_output_final_generation"
  cache_dir: "./cache/p6_editorial_acceptance/batch_02/final_generation"
  state_db: "./state/p6_editorial_acceptance/batch_02/final_generation/index.sqlite"
  reports_db: "./state/p6_editorial_acceptance/batch_02/final_generation/reports.sqlite"
  signal_store_db: "./state/p6_editorial_acceptance/batch_02/final_generation/signals.sqlite"
  ingest_lock: "./state/p6_editorial_acceptance/batch_02/final_generation/ingest.lock"

ingest:
  run_budget:
    max_spend_usd: 6.0
    max_pdfs: 5
    max_retries: 10
    max_runtime_seconds: 28800
    limit_decision: "stop"

browser_download:
  output_dir: "./out/p6_editorial_acceptance/batch_02/final_generation/browser_downloads"
  drive_upload:
    enabled: false
    required: false
  run_budget:
    max_browser_launches: 0
    max_pdfs: 5
    max_drive_writes: 0
    max_drive_reads: 0
    max_mailbox_reads: 0
    max_retries: 10
    max_runtime_seconds: 14400
    limit_decision: "stop"

analysis:
  cost_ledger_path: "./state/p6_editorial_acceptance/batch_02/final_generation/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/p6_editorial_acceptance/batch_02/final_generation/llm_usage.sqlite"
  daily_path: "./state/p6_editorial_acceptance/batch_02/final_generation/llm_cost_daily.json"
  ledger_path: "./state/p6_editorial_acceptance/batch_02/final_generation/llm_cost_ledger.jsonl"

publish:
  wp:
    site_url: ""
    username: ""
    post_status: "draft"
  projection_daily_path: "./state/p6_editorial_acceptance/batch_02/final_generation/projection_cost_daily.json"
  projection_ledger_path: "./state/p6_editorial_acceptance/batch_02/final_generation/projection_cost_ledger.jsonl"
  run_budget:
    enabled: true
    max_wordpress_writes: 0
    limit_decision: "stop"
