schema_version: "1.0"

# Fresh, isolated P6 Batch 2 validation profile. It inherits the current
# production-intended app.yaml workflow, model, and quality-gate policy.
# Its empty cache and state paths prevent reuse of any E8/E9 editorial,
# report, or rendered-HTML artifact; only Drive source provenance is reused
# to freeze the admitted cohort. Drive and WordPress writes are prohibited.
paths:
  output_dir: "./out/p6_editorial_acceptance/batch_02/pipeline_output"
  cache_dir: "./cache/p6_editorial_acceptance/batch_02"
  state_db: "./state/p6_editorial_acceptance/batch_02/index.sqlite"
  reports_db: "./state/p6_editorial_acceptance/batch_02/reports.sqlite"
  signal_store_db: "./state/p6_editorial_acceptance/batch_02/signals.sqlite"
  ingest_lock: "./state/p6_editorial_acceptance/batch_02/ingest.lock"

ingest:
  run_budget:
    max_spend_usd: 6.0
    max_pdfs: 5
    max_retries: 10
    max_runtime_seconds: 28800
    limit_decision: "stop"

browser_download:
  output_dir: "./out/p6_editorial_acceptance/batch_02/browser_downloads"
  drive_upload:
    enabled: false
    required: false
  run_budget:
    max_browser_launches: 0
    max_pdfs: 5
    max_drive_writes: 0
    max_drive_reads: 0
    max_mailbox_reads: 0
    max_retries: 10
    max_runtime_seconds: 14400
    limit_decision: "stop"

analysis:
  cost_ledger_path: "./state/p6_editorial_acceptance/batch_02/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/p6_editorial_acceptance/batch_02/llm_usage.sqlite"
  daily_path: "./state/p6_editorial_acceptance/batch_02/llm_cost_daily.json"
  ledger_path: "./state/p6_editorial_acceptance/batch_02/llm_cost_ledger.jsonl"

publish:
  wp:
    site_url: ""
    username: ""
    post_status: "draft"
  projection_daily_path: "./state/p6_editorial_acceptance/batch_02/projection_cost_daily.json"
  projection_ledger_path: "./state/p6_editorial_acceptance/batch_02/projection_cost_ledger.jsonl"
  run_budget:
    enabled: true
    max_wordpress_writes: 0
    limit_decision: "stop"
