schema_version: "1.0"

# Fresh isolated replay of the frozen Batch 4 cohort after deterministic
# identity/provenance and review-HTML traceability corrections.
paths:
  output_dir: "./out/p6_editorial_acceptance/batch_04/identity_traceability_20260909/pipeline_output"
  cache_dir: "./cache/p6_editorial_acceptance/batch_04/identity_traceability_20260909"
  state_db: "./state/p6_editorial_acceptance/batch_04/identity_traceability_20260909/index.sqlite"
  reports_db: "./state/p6_editorial_acceptance/batch_04/identity_traceability_20260909/reports.sqlite"
  signal_store_db: "./state/p6_editorial_acceptance/batch_04/identity_traceability_20260909/signals.sqlite"
  ingest_lock: "./state/p6_editorial_acceptance/batch_04/identity_traceability_20260909/ingest.lock"

ingest:
  # This controlled replay must surface provider stalls as retryable failures
  # instead of consuming the default ten-minute request window.
  timeout_seconds: 90
  run_budget:
    max_spend_usd: 6.0
    max_pdfs: 5
    max_retries: 10
    max_runtime_seconds: 28800
    limit_decision: "stop"

browser_download:
  output_dir: "./out/p6_editorial_acceptance/batch_04/identity_traceability_20260909/browser_downloads"
  drive_upload:
    enabled: false
    required: false
  run_budget:
    max_browser_launches: 0
    max_pdfs: 5
    max_drive_writes: 0
    max_drive_reads: 5
    max_mailbox_reads: 0
    max_retries: 10
    max_runtime_seconds: 14400
    limit_decision: "stop"

analysis:
  cost_ledger_path: "./state/p6_editorial_acceptance/batch_04/identity_traceability_20260909/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/p6_editorial_acceptance/batch_04/identity_traceability_20260909/llm_usage.sqlite"
  daily_path: "./state/p6_editorial_acceptance/batch_04/identity_traceability_20260909/llm_cost_daily.json"
  ledger_path: "./state/p6_editorial_acceptance/batch_04/identity_traceability_20260909/llm_cost_ledger.jsonl"

publish:
  wp:
    site_url: ""
    username: ""
    post_status: "draft"
  projection_daily_path: "./state/p6_editorial_acceptance/batch_04/identity_traceability_20260909/projection_cost_daily.json"
  projection_ledger_path: "./state/p6_editorial_acceptance/batch_04/identity_traceability_20260909/projection_cost_ledger.jsonl"
  run_budget:
    enabled: true
    max_wordpress_writes: 0
    limit_decision: "stop"
