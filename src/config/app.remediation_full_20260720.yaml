schema_version: "1.0"

# Fresh five-report release namespace.  It is intentionally separate from the
# bounded browser/direct probes so their consumed resource reservations cannot
# affect the acceptance canary.
paths:
  output_dir: "./out/remediation_full_20260720"
  cache_dir: "./cache/remediation_full_20260720"
  state_db: "./state/remediation_full_20260720/index.sqlite"
  reports_db: "./state/remediation_full_20260720/reports.sqlite"
  signal_store_db: "./state/remediation_full_20260720/signals.sqlite"
  ingest_lock: "./state/remediation_full_20260720/ingest.lock"

ingest:
  run_budget:
    max_spend_usd: 6.0
    # PDF counts are an input-scope control, not a budget authority. Spend
    # forecasts and their configured limits govern admission for this run.
    max_pdfs: null
    max_retries: 10
    max_runtime_seconds: 14400
    limit_decision: "stop"

browser_download:
  output_dir: "./out/remediation_full_20260720/browser_downloads"
  max_steps: 2
  timeout_seconds: 120
  run_budget:
    max_browser_launches: 10
    max_pdfs: null
    max_drive_writes: 20
    max_drive_reads: 40
    max_mailbox_reads: 8
    max_retries: 10
    max_runtime_seconds: 7200
    limit_decision: "stop"

mailbox_acquisition:
  output_dir: "./out/remediation_full_20260720/mailbox_acquisition"

publisher_discovery:
  output_dir: "./out/remediation_full_20260720/publisher_inventory_discovery"

analysis:
  cost_ledger_path: "./state/remediation_full_20260720/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/remediation_full_20260720/llm_usage.sqlite"
  daily_path: "./state/remediation_full_20260720/llm_cost_daily.json"
  ledger_path: "./state/remediation_full_20260720/llm_cost_ledger.jsonl"

publish:
  projection_daily_path: "./state/remediation_full_20260720/projection_cost_daily.json"
  projection_ledger_path: "./state/remediation_full_20260720/projection_cost_ledger.jsonl"
