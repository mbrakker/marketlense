schema_version: "1.0"

# Fresh isolated P6 rerun after report-agnostic evidence, frozen-cohort, and
# admission-identity handoff fixes. Only checksum-verified source PDFs are
# pre-seeded; no analysis, editorial artifact, rendered HTML, or card output is
# reused.
paths:
  output_dir: "./out/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/pipeline_output"
  cache_dir: "./cache/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5"
  state_db: "./state/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/index.sqlite"
  reports_db: "./state/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/reports.sqlite"
  signal_store_db: "./state/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/signals.sqlite"
  ingest_lock: "./state/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/ingest.lock"

ingest:
  run_budget:
    max_spend_usd: 6.0
    max_pdfs: 5
    max_retries: 10
    max_runtime_seconds: 28800
    limit_decision: "stop"

browser_download:
  output_dir: "./out/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/browser_downloads"
  drive_upload:
    enabled: false
    required: false
  run_budget:
    max_browser_launches: 0
    max_pdfs: 5
    max_drive_writes: 0
    max_drive_reads: 0
    max_mailbox_reads: 0
    max_retries: 10
    max_runtime_seconds: 14400
    limit_decision: "stop"

analysis:
  cost_ledger_path: "./state/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/llm_usage.sqlite"
  daily_path: "./state/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/llm_cost_daily.json"
  ledger_path: "./state/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/llm_cost_ledger.jsonl"

publish:
  wp:
    site_url: ""
    username: ""
    post_status: "draft"
  projection_daily_path: "./state/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/projection_cost_daily.json"
  projection_ledger_path: "./state/p6_editorial_acceptance/batch_01_evidence_reliability_20260831_v5/projection_cost_ledger.jsonl"
  run_budget:
    enabled: true
    max_wordpress_writes: 0
    limit_decision: "stop"
