schema_version: "1.0"

# Immutable, isolated 20-report reliability execution namespace. Credentials and
# external targets remain environment-owned through the base configuration.
paths:
  output_dir: "./out/reliability_full_20260810_62d021b3b57440eb8113ff5d5e105578"
  cache_dir: "./cache/reliability_full_20260810_62d021b3b57440eb8113ff5d5e105578"
  state_db: "./state/reliability_full_20260810_62d021b3b57440eb8113ff5d5e105578/index.sqlite"
  reports_db: "./state/reliability_full_20260810_62d021b3b57440eb8113ff5d5e105578/reports.sqlite"
  signal_store_db: "./state/reliability_full_20260810_62d021b3b57440eb8113ff5d5e105578/signals.sqlite"
  ingest_lock: "./state/reliability_full_20260810_62d021b3b57440eb8113ff5d5e105578/ingest.lock"

ingest:
