mailbox_acquisition:
  output_dir: "./out/reliability_full_20260810_62d021b3b57440eb8113ff5d5e105578/mailbox_acquisition"

publisher_discovery:
  output_dir: "./out/reliability_full_20260810_62d021b3b57440eb8113ff5d5e105578/publisher_inventory_discovery"

analysis:
