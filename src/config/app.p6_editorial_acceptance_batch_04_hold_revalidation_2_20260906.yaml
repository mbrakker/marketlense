schema_version: "1.0"

# Second isolated fresh replay of the three Batch 4 holds after shared
# source-display and public-projection corrections. It reuses only the frozen
# source admission/provenance records.
paths:
  output_dir: "./out/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/pipeline_output"
  cache_dir: "./cache/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906"
  state_db: "./state/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/index.sqlite"
  reports_db: "./state/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/reports.sqlite"
  signal_store_db: "./state/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/signals.sqlite"
  ingest_lock: "./state/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/ingest.lock"

ingest:
  run_budget:
    max_spend_usd: 6.0
    max_pdfs: 3
    max_retries: 10
    max_runtime_seconds: 28800
    limit_decision: "stop"

browser_download:
  output_dir: "./out/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/browser_downloads"
  drive_upload:
    enabled: false
    required: false
  run_budget:
    max_browser_launches: 0
    max_pdfs: 3
    max_drive_writes: 0
    max_drive_reads: 0
    max_mailbox_reads: 0
    max_retries: 10
    max_runtime_seconds: 14400
    limit_decision: "stop"

analysis:
  cost_ledger_path: "./state/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/llm_usage.sqlite"
  daily_path: "./state/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/llm_cost_daily.json"
  ledger_path: "./state/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/llm_cost_ledger.jsonl"

publish:
  wp:
    site_url: ""
    username: ""
    post_status: "draft"
  projection_daily_path: "./state/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/projection_cost_daily.json"
  projection_ledger_path: "./state/p6_editorial_acceptance/batch_04/hold_revalidation_2_20260906/projection_cost_ledger.jsonl"
  run_budget:
    enabled: true
    max_wordpress_writes: 0
    limit_decision: "stop"
