schema_version: "1.0"

# Isolated evidence namespace for the 2026-07-19 live end-to-end validation.
# Credentials and provider targets continue to resolve from the approved local
# environment; this profile only separates run-owned artifacts and state.
paths:
  output_dir: "./out/live_validation_20260719"
  cache_dir: "./cache/live_validation_20260719"
  state_db: "./state/live_validation_20260719/index.sqlite"
  reports_db: "./state/live_validation_20260719/reports.sqlite"
  signal_store_db: "./state/live_validation_20260719/signals.sqlite"
  ingest_lock: "./state/live_validation_20260719/ingest.lock"

ingest:
  run_budget:
    max_pdfs: 15
    max_retries: 40
    max_runtime_seconds: 43200
    limit_decision: "stop"
  pdf_text:
    ocr_fallback:
      enabled: true
      policy: "native_first_selective"

browser_download:
  output_dir: "./out/live_validation_20260719/browser_downloads"
  run_budget:
    max_browser_launches: 30
    max_pdfs: 50
    max_drive_writes: 50
    max_drive_reads: 120
    max_mailbox_reads: 24
    max_retries: 20
    max_runtime_seconds: 21600
    limit_decision: "stop"

mailbox_acquisition:
  output_dir: "./out/live_validation_20260719/mailbox_acquisition"

publisher_discovery:
  output_dir: "./out/live_validation_20260719/publisher_inventory_discovery"

cost:
  usage_db_path: "./state/live_validation_20260719/llm_usage.sqlite"
  daily_path: "./state/live_validation_20260719/llm_cost_daily.json"
  ledger_path: "./state/live_validation_20260719/llm_cost_ledger.jsonl"

publish:
  projection_daily_path: "./state/live_validation_20260719/projection_cost_daily.json"
  projection_ledger_path: "./state/live_validation_20260719/projection_cost_ledger.jsonl"
