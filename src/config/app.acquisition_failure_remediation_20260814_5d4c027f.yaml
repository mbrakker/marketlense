schema_version: "1.0"
# Isolated diagnostic namespace. It deliberately reuses the canonical existing
# browser identity and mailbox configuration rather than the empty identity
# retained with the earlier reliability run.
paths:
  output_dir: "./out/acquisition_failure_remediation_20260814_5d4c027f"
  cache_dir: "./cache/acquisition_failure_remediation_20260814_5d4c027f"
  state_db: "./state/acquisition_failure_remediation_20260814_5d4c027f/index.sqlite"
  reports_db: "./state/acquisition_failure_remediation_20260814_5d4c027f/reports.sqlite"
  signal_store_db: "./state/acquisition_failure_remediation_20260814_5d4c027f/signals.sqlite"
  ingest_lock: "./state/acquisition_failure_remediation_20260814_5d4c027f/ingest.lock"

browser_download:
  output_dir: "./out/acquisition_failure_remediation_20260814_5d4c027f/browser_downloads"
  identity_config_path: "./browser_download_identity.yaml"
  route_playbook_promotion_mode: "disabled"
  private_api_playbook_promotion_mode: "disabled"
  retry:
    retries: 0
    base_delay_seconds: 0.0
    backoff_step_seconds: 0.0
    jitter_seconds: 0.0
  route_budgets:
    browser_email_form:
      timeout_seconds: 240
      max_steps: 24
  run_budget:
    enabled: true
    max_browser_launches: 90
    max_pdfs: 40
    max_drive_writes: 40
    max_drive_reads: 120
    max_mailbox_reads: 80
    max_retries: 0
    max_runtime_seconds: 43200
    limit_decision: "stop"

mailbox_acquisition:
  output_dir: "./out/acquisition_failure_remediation_20260814_5d4c027f/mailbox_acquisition"
  # Email delivery is the only path given a longer bounded wait.
  poll_timeout_seconds: 600
  poll_interval_seconds: 30

analysis:
  cost_ledger_path: "./state/acquisition_failure_remediation_20260814_5d4c027f/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/acquisition_failure_remediation_20260814_5d4c027f/llm_usage.sqlite"
  daily_path: "./state/acquisition_failure_remediation_20260814_5d4c027f/llm_cost_daily.json"
  ledger_path: "./state/acquisition_failure_remediation_20260814_5d4c027f/llm_cost_ledger.jsonl"
