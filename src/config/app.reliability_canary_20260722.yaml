schema_version: "1.0"

# New isolated namespace for the post-closure reliability validation. Secrets,
# source identities and the explicitly configured sandbox WordPress target stay
# environment-owned.
paths:
  output_dir: "./out/reliability_canary_20260722_retry7"
  cache_dir: "./cache/reliability_canary_20260722_retry7"
  state_db: "./state/reliability_canary_20260722_retry7/index.sqlite"
  reports_db: "./state/reliability_canary_20260722_retry7/reports.sqlite"
  signal_store_db: "./state/reliability_canary_20260722_retry7/signals.sqlite"
  ingest_lock: "./state/reliability_canary_20260722_retry7/ingest.lock"

ingest:
  run_budget:
    max_spend_usd: 6.0
    max_pdfs: 20
    max_retries: 10
    max_runtime_seconds: 28800
    limit_decision: "stop"

browser_download:
  output_dir: "./out/reliability_canary_20260722_retry7/browser_downloads"
  max_steps: 4
  timeout_seconds: 120
  run_budget:
    max_browser_launches: 8
    max_pdfs: 20
    max_drive_writes: 24
    max_drive_reads: 48
    max_mailbox_reads: 8
    max_retries: 10
    max_runtime_seconds: 14400
    limit_decision: "stop"

mailbox_acquisition:
  output_dir: "./out/reliability_canary_20260722_retry7/mailbox_acquisition"

publisher_discovery:
  output_dir: "./out/reliability_canary_20260722_retry7/publisher_inventory_discovery"

analysis:
  cost_ledger_path: "./state/reliability_canary_20260722_retry7/llm_cost_ledger.jsonl"

cost:
  usage_db_path: "./state/reliability_canary_20260722_retry7/llm_usage.sqlite"
  daily_path: "./state/reliability_canary_20260722_retry7/llm_cost_daily.json"
  ledger_path: "./state/reliability_canary_20260722_retry7/llm_cost_ledger.jsonl"

publish:
  projection_daily_path: "./state/reliability_canary_20260722_retry7/projection_cost_daily.json"
  projection_ledger_path: "./state/reliability_canary_20260722_retry7/projection_cost_ledger.jsonl"
