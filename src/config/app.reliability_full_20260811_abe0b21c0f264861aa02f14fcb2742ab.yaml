  run_budget:
    enabled: true
    max_browser_launches: 40
    max_pdfs: 40
    max_drive_writes: 48
    max_drive_reads: 120
    max_mailbox_reads: 12
    max_retries: 40
    max_runtime_seconds: 43200
    limit_decision: "stop"

mailbox_acquisition:
  output_dir: "./out/reliability_full_20260811_abe0b21c0f264861aa02f14fcb2742ab/mailbox_acquisition"

publisher_discovery:
  output_dir: "./out/reliability_full_20260811_abe0b21c0f264861aa02f14fcb2742ab/publisher_inventory_discovery"

analysis:
