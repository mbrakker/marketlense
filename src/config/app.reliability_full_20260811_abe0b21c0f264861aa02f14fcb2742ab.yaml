schema_version: "1.0"
# Fresh, isolated production reliability profile. The previous attempted run
# remains retained under its own immutable namespace and is not reused here.
paths:
  output_dir: "./out/reliability_full_20260811_abe0b21c0f264861aa02f14fcb2742ab"
  cache_dir: "./cache/reliability_full_20260811_abe0b21c0f264861aa02f14fcb2742ab"
  state_db: "./state/reliability_full_20260811_abe0b21c0f264861aa02f14fcb2742ab/index.sqlite"
  reports_db: "./state/reliability_full_20260811_abe0b21c0f264861aa02f14fcb2742ab/reports.sqlite"
  signal_store_db: "./state/reliability_full_20260811_abe0b21c0f264861aa02f14fcb2742ab/signals.sqlite"
  ingest_lock: "./state/reliability_full_20260811_abe0b21c0f264861aa02f14fcb2742ab/ingest.lock"

ingest:
  run_budget:
    max_spend_usd: 500.0
    max_pdfs: 40
    max_retries: 80
    max_runtime_seconds: 86400
    limit_decision: "stop"

browser_download:
