schema_version: "1.0"

# Explicit operational overlay for the autonomous MVP. It enables bounded
# normal queue batches plus the already allowlisted, one-shot recovery adapters;
# the external host still owns invocation cadence through `supervise-workflows --once`.
workflow_control:
  # This explicit operator profile enables automatic approval only for packages
  # that pass the immutable package and canonical readiness checks.
  autonomous_publication_policy:
    schema_version: "1.0"
    enabled: true
    policy_id: "autonomous_mvp_publication_v1"
  supervisor:
    schema_version: "1.0"
    enabled: true
    deferred_work_enabled: true
    remediation_enabled: true
    # Existing queue controls, leases, fairness and workflow budgets remain
    # authoritative for normal work claimed by the supervisor.
    worker_batches_enabled: true
  remediation_reaper:
    schema_version: "1.0"
    execution_enabled: true
    max_records_per_run: 2
    lease_seconds: 60
  deferred_work_reaper:
    schema_version: "1.0"
    execution_enabled: true
    max_records_per_run: 2
    lease_seconds: 60
    retry_delay_seconds: 3600
