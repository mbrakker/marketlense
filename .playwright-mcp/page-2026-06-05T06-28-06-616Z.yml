            - heading "21. 10 | Expectativa de viajes digitales sin fricciones en todas las categorías" [level=3] [ref=e501]
            - paragraph [ref=e502]: "Pages: 15"
            - paragraph [ref=e503]: Los consumidores esperan integración fluida online-offline en descubrimiento, compra y servicio; modelos como suscripción y reposición inteligente son ejemplos en FMCG.
          - article [ref=e504]:
            - heading "22. 11 | Mayor demanda de agencia personal e influencia colaborativa" [level=3] [ref=e505]
            - paragraph [ref=e506]: "Pages: 16"
            - paragraph [ref=e507]: Los consumidores quieren influir en productos y servicios; la co-creación y el feedback continuo son formas esperadas de participación.
          - article [ref=e508]:
            - heading "23. 12 | La prioridad de la alineación de valor en las decisiones de compra" [level=3] [ref=e509]
            - paragraph [ref=e510]: "Pages: 17"
            - paragraph [ref=e511]: La alineación entre los valores del consumidor y las acciones de la marca es un factor decisivo en la compra y la lealtad, con ejemplos prácticos en FMCG y durables.
