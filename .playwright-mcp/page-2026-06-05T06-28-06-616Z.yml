      - generic [ref=e126]:
        - article [ref=e127]:
          - heading "Agenda" [level=3] [ref=e128]
          - paragraph [ref=e129]: Índice de contenidos del informe con las secciones principales, tendencias numeradas (1–18) y materiales finales como fuentes, imágenes y información sobre Allegro 234.
          - list [ref=e130]:
