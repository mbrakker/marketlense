            - heading "25. 13 | Expectativa de comunicación bidireccional y diálogo en tiempo real" [level=3] [ref=e517]
            - paragraph [ref=e518]: "Pages: 18"
            - paragraph [ref=e519]: Los clientes esperan respuestas inmediatas, empáticas y comunicación abierta; retrasos o silencios son percibidos negativamente y pueden provocar reacciones públicas.
          - article [ref=e520]:
            - heading "26. 14 | Lealtad basada en valores compartidos y contribuciones significativas" [level=3] [ref=e521]
            - paragraph [ref=e522]: "Pages: 19"
            - paragraph [ref=e523]: La lealtad se construye sobre la demostración de valores compartidos y contribuciones sociales; los programas tradicionales de puntos son menos eficaces frente a la lealtad emocional.
          - article [ref=e524]:
            - heading "27. 15 | Deseo de experiencias digitales e híbridas inmersivas" [level=3] [ref=e525]
            - paragraph [ref=e526]: "Pages: 20"
            - paragraph [ref=e527]: Consumidores valoran experiencias multisensoriales y la mezcla físico-digital; la experiencia holística pasa a definir el valor de marca.
