          - article [ref=e472]:
            - heading "14. 5 | Sostenibilidad integrada en la transformación sectorial" [level=3] [ref=e473]
            - paragraph [ref=e474]: "Pages: 10"
            - paragraph [ref=e475]: "La sostenibilidad se convierte en requisito operativo: cambios en envases, cadenas de suministro y modelos de producto para reducir huella y responder a la demanda urbana."
          - article [ref=e476]:
            - heading "15. 6 | Integración tecnológica entre operaciones, productos y servicios" [level=3] [ref=e477]
            - paragraph [ref=e478]: "Pages: 11"
            - paragraph [ref=e479]: La IA, IoT y automatización se integran en previsión, desarrollo de producto, experiencia cliente y operaciones, transformando capacidades sectoriales.
