            - heading "19. 9 | Colaboraciones estratégicas y marca del ecosistema" [level=3] [ref=e493]
            - paragraph [ref=e494]: "Pages: 14"
            - paragraph [ref=e495]: La construcción de marca depende cada vez más de ecosistemas colaborativos (alianzas intersectoriales, creadores, tecnología) para ampliar capacidades y legitimidad.
          - article [ref=e496]:
            - heading "20. Macrotendencias para las personas y su relación con los sectores económicos" [level=3] [ref=e497]
            - paragraph [ref=e498]: "Pages: 15"
            - paragraph [ref=e499]: Sección que explora cómo las transformaciones sectoriales afectan la relación diaria de las personas con productos y servicios (tendencias 10–12).
