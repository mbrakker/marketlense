            - generic [ref=e217]:
              - paragraph [ref=e218]: The report demonstrates a concentrated risk profile in Asia Pacific where cybersecurity and business resilience dominate the agenda. Cybersecurity is the highest‑rated regional risk (~62%) while business resilience is near 58%, and in the Pacific these two are cited with equal prominence. That alignment indicates internal audit is already prioritizing continuity and defensive controls at a subregional level.
              - paragraph [ref=e219]: "A notable tension emerges between those prioritized areas and undercovered strategic risks: human capital and digital disruption. Human capital is rated at roughly 56% regionally (60% in East Asia) yet audit effort is substantially lower, with reported risk–audit gaps of 14–30 percentage points; digital disruption is an emerging risk (~39% APAC; 52% in Southeast Asia) but is under‑prioritized by internal audit in Southeast Asia (52% risk versus 32% audit priority). The report recommends concrete corrective actions: align audit plans to strategic risks, test supply‑chain and continuity plans, advise on AI adoption and controls, upskill staff, and leverage external resources."
              - paragraph [ref=e220]: For senior leaders the practical implication is to rebalance operating models and audit capacity without eroding hard‑won resilience and cyber programs. Internal audit should be mobilized as both an assurance and advisory function to connect technology adoption and workforce vulnerabilities to board strategy. "Information provided to the governing body must include that we have a strategy moving forward to ensure that whatever money that’s invested actually derives the returns that we want." The report frames these findings as a regional benchmark to inform internal audit prioritization and capacity building.
