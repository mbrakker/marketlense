          - heading "Asia Pacific Risk in Focus" [level=1] [ref=e23]
          - paragraph [ref=e24]: "Risk in Focus: Asia Pacific (865 survey responses across 22 countries, plus 3 roundtables and 3 in‑depth interviews) finds cybersecurity to be the top regional risk (~62%), followed by business resilience (~58%), human capital (~56%), and digital disruption (~39%). Subregion patterns vary: East Asia emphasizes human capital (60%) and market changes (58%); Southeast Asia ranks cybersecurity and business resilience above 60% but shows a gap for digital disruption (52% risk vs 32% audit priority); the Pacific ties business resilience and cybersecurity; South Asia reports especially high technology risk (cybersecurity 75%, digital disruption 56%). The report flags persistent risk–audit priority misalignments, with human capital and digital disruption receiving substantially less internal audit effort than their risk rankings warrant. Practical internal audit responses recommended across subregions include aligning audit plans to strategic risks, testing supply chain and business continuity plans, advising on AI adoption and controls, upskilling staff, and leveraging external/third‑party resources. The authors note limitations from Asia Pacific’s diverse landscape and varying subregion sample sizes, but present these findings as a regional benchmark to inform internal audit prioritization and capacity building."
