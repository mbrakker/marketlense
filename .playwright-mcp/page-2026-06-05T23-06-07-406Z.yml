            - article [ref=e166]:
              - heading "Executive Summary" [level=3] [ref=e167]
              - paragraph [ref=e168]: "Provides an overview of participation and regional differences in risks and audit priorities; summarizes top risks and subregion highlights, including East Asia, Pacific, South Asia, and Southeast Asia. Participation numbers and high-level findings are presented. Asia Pacific participation: 865 survey responses, 22 countries, 3 roundtables, 3 in-depth interviews. Regional concerns emphasize geopolitical uncertainty, cybersecurity, and rapid adoption of AI/digital technologies. Subregion summaries highlight differences (e.g., East Asia: human capital and market changes; Pacific: business resilience tied with cybersecurity)."
            - article [ref=e169]:
              - heading "Section 1. Asia Pacific’s Risk Environment" [level=3] [ref=e170]
              - paragraph [ref=e171]: Presents region-level risk rankings and context for how diverse economies shape risk priorities; includes survey-based rankings of top risks across the Asia Pacific. Top region-level risks include Cybersecurity (62%), Business resilience (58%), Human capital (56%), and Digital disruption (39%). The section frames how differing national economies (e.g., manufacturing hubs, service-driven economies) lead to varied risk profiles.
            - article [ref=e172]:
              - heading "Section 2. East Asia" [level=3] [ref=e173]
              - paragraph [ref=e174]: Details East Asia’s risk profile where human capital (60%) slightly edged out cybersecurity (59%), and market changes/competition are especially pronounced (58% — the highest globally). The section includes roundtable insights on controls, supply chain, and advising boards. Human capital (60%) edged out cybersecurity (59%) as the top-cited risk for East Asia (Section 2, Exhibit 1). Market changes/competition in East Asia are the highest globally at 58% (Section 2, Exhibit 1). Internal audit strategies include focusing on controls (governance, supply chain, digital disruption), testing supply chain reliability, and deepening business strategy knowledge.
            - article [ref=e175]:
              - heading "Section 3. Pacific" [level=3] [ref=e176]
              - paragraph [ref=e177]: Highlights the Pacific subregion where business resilience and cybersecurity are tied as top risks; emphasizes understanding strategic risks, market changes, and fundamentals (controls, funding, people) to manage uncertainty. Business resilience tied with cybersecurity as the most cited Top 5 risk in the Pacific. Digital disruption (including AI) appears in the Pacific Top 5 risks; human capital ranked third. Advised internal audit actions include aligning audit plans to strategic risks, reviewing risk management fundamentals, and providing advisory services on recruitment and retention.
            - article [ref=e178]:
              - heading "Section 4. South Asia" [level=3] [ref=e179]
              - paragraph [ref=e180]: "Presents South Asia survey findings showing high rankings for business resilience (49%) and geopolitical uncertainty (47%), with strong concern about technology risks (cybersecurity 75%, digital disruption 56%). The section lists audit strategies to address these risks. Risk rankings: business resilience (49%) and geopolitical uncertainty (47%) are prominent in South Asia. Technology risks are elevated: cybersecurity rated Top 5 by 75% and digital disruption by 56% of respondents. Internal audit strategies include testing supply chain and business continuity plans, advising on AI adoption and assurance over controls, and upskilling staff."
            - article [ref=e181]:
              - heading "Section 5. Southeast Asia" [level=3] [ref=e182]
              - paragraph [ref=e183]: "Describes Southeast Asia where cybersecurity and business resilience top both risk rankings and audit priorities; digital disruption is recognized as a growing risk but is a lower audit priority, and human capital remains a significant concern. Cybersecurity and business resilience are the top-ranked risks and audit priorities in Southeast Asia (above 60%). Digital disruption was included as a Top 5 risk by 52% but as a Top 5 audit priority by only 32%, suggesting capability/resource gaps. Internal audit strategies: be transparent with governing bodies about capabilities, leverage third-party help, and use external resources to build staff skills."
