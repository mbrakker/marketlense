[theme]
base = "light"
primaryColor = "#0f7d45"
backgroundColor = "#f4f4f1"
secondaryBackgroundColor = "#ffffff"
textColor = "#18211d"
linkColor = "#116f8f"
codeTextColor = "#18211d"
codeBackgroundColor = "#eef2ef"
borderColor = "#d7ddd8"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"

font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFont = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
codeFontSize = "13px"
linkUnderline = false
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]

greenColor = "#0f7d45"
greenBackgroundColor = "#dcefe3"
greenTextColor = "#0f5f36"
orangeColor = "#bd7a12"
