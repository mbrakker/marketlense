name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Format check
        run: python scripts/ci/check_formatting.py
      - name: Type check
        run: python scripts/ci/run_type_check.py
      - name: Forbidden patching gate
        run: python scripts/ci/check_forbidden_patching.py
      - name: Run default pytest suite with coverage
        run: python -m pytest --cov=src --cov-report=xml --cov-report=term-missing
      - name: Coverage gate
        run: python scripts/ci/check_coverage.py --coverage-xml coverage.xml
      - name: Mutation gate
        run: python scripts/ci/run_mutation_gate.py
