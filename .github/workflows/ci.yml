name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Format check
        run: python scripts/ci/check_formatting.py
      - name: Ruff lint check
        run: python scripts/ci/check_ruff_lint.py
      - name: Classify change risk
        run: python scripts/ci/check_risk_policy.py
      - name: Split symbol-linking gate
        run: python scripts/ci/check_split_symbol_links.py
      - name: Type check
        run: python scripts/ci/run_type_check.py
      - name: Architecture import gate
        run: python scripts/ci/check_architecture_imports.py
      - name: Role I/O boundary gate
        run: python scripts/ci/check_role_io_boundaries.py
      - name: Service boundary map gate
        run: python scripts/ci/check_service_boundary_map.py
      - name: Refactor movement evidence gate
        run: python scripts/ci/check_refactor_movement_evidence.py
      - name: Forbidden patching gate
        run: python scripts/ci/check_forbidden_patching.py
      - name: Repository hygiene gate
        run: python scripts/ci/check_repository_hygiene.py
      - name: Quality ledger gate
        run: python scripts/ci/check_quality_ledger.py
      - name: Remediation runbook gate
        run: python scripts/ci/check_remediation_runbooks.py
      - name: Backlog source gate
        run: python scripts/ci/check_backlog_source.py
      - name: Contract schema snapshot gate
        run: python scripts/ci/check_contract_schemas.py --snapshot docs/quality/contract_schemas.json
      - name: WordPress subproject checks
        run: python scripts/ci/check_wordpress_subproject.py
      - name: WordPress staging REST gate
        if: ${{ vars.RUN_WORDPRESS_STAGING_REST_GATE == '1' }}
        env:
          RUN_WORDPRESS_STAGING_REST_GATE: "1"
          WP_STAGING_SITE_URL: ${{ secrets.WP_STAGING_SITE_URL }}
          WP_STAGING_USERNAME: ${{ secrets.WP_STAGING_USERNAME }}
          WP_STAGING_APP_PASSWORD: ${{ secrets.WP_STAGING_APP_PASSWORD }}
          WP_STAGING_BEARER_TOKEN: ${{ secrets.WP_STAGING_BEARER_TOKEN }}
          WP_STAGING_SSL_VERIFY: ${{ vars.WP_STAGING_SSL_VERIFY }}
          WP_STAGING_CA_BUNDLE_PATH: ${{ vars.WP_STAGING_CA_BUNDLE_PATH }}
          WP_STAGING_REPORT_ARTIFACT: ${{ vars.WP_STAGING_REPORT_ARTIFACT }}
          WP_STAGING_BRIEFING_ARTIFACT: ${{ vars.WP_STAGING_BRIEFING_ARTIFACT }}
          WP_STAGING_SIGNAL_ARTIFACT: ${{ vars.WP_STAGING_SIGNAL_ARTIFACT }}
        run: python scripts/ci/check_wordpress_staging_rest_gate.py
      - name: Mark release evidence freshness start
        run: echo "RELEASE_EVIDENCE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Run default pytest suite with coverage
        run: python -m pytest --cov=src --cov-report=xml --cov-report=term-missing
      - name: Coverage gate
        run: python scripts/ci/check_coverage.py --coverage-xml coverage.xml
      - name: Mutation gate
        run: python scripts/ci/run_mutation_gate.py --json-out mutation_results.json
      - name: Quality non-regression gate
        run: python scripts/ci/check_quality_regression.py --baseline docs/quality/baseline_2026-02-21.json --coverage-xml coverage.xml --mutation-json mutation_results.json --docpack-root tests/fixtures/docpacks/golden
      - name: PDF candidate benchmark gate
        run: python scripts/ci/check_pdf_candidate_benchmark.py --baseline docs/quality/pdf_candidate_extraction_benchmark_baseline.json --output-json out/pdf_candidate_benchmark_ci.json
      - name: PDF crop-refine benchmark gate
        run: python scripts/ci/check_pdf_crop_refine_benchmark.py --baseline docs/quality/pdf_crop_refine_benchmark_baseline.json --output-json out/pdf_crop_refine_benchmark_ci.json
      - name: PDF benchmark trend gate
        run: python scripts/ci/check_pdf_benchmark_trends.py --candidate-json out/pdf_candidate_benchmark_ci.json --crop-refine-json out/pdf_crop_refine_benchmark_ci.json --history-json out/pdf_benchmark_trend_history_ci.json --output-json out/pdf_benchmark_trends_ci.json --update-history --allow-missing-inputs
      - name: Public report render-quality gate
        run: python scripts/ci/check_public_report_quality.py --minimum-reports 15 --output-dir out/public_report_quality_ci --output-json out/public_report_quality_ci.json
      - name: Build CI health scorecard
        run: |
          mkdir -p out
          python - <<'PY'
          from datetime import UTC, datetime
          import json

          payload = {
              "timestamp": datetime.now(UTC).isoformat(),
              "run_id": "ci-release-evidence",
              "event": "release_evidence_inputs_ready",
              "fields": {},
          }
          with open("out/ci_health_events.jsonl", "w", encoding="utf-8") as handle:
              handle.write(json.dumps(payload, ensure_ascii=True) + "\n")
          PY
          python scripts/quality/run_health_scorecard.py out/ci_health_events.jsonl --run-id ci-release-evidence --output-json out/run_health_scorecard_ci.json
      - name: Reconcile retained canonical LLM accounting corpus
        run: |
          mkdir -p out/ci_llm_accounting
          python scripts/quality/build_llm_accounting_corpus.py \
            --fixture-json tests/fixtures/llm_accounting/canonical_events.json \
            --db out/ci_llm_accounting/usage.sqlite \
            --ledger out/ci_llm_accounting/cost-ledger.jsonl \
            --daily out/ci_llm_accounting/cost-daily.json
          python scripts/quality/reconcile_llm_usage_ledger.py \
            --db out/ci_llm_accounting/usage.sqlite \
            --ledger out/ci_llm_accounting/cost-ledger.jsonl \
            --daily out/ci_llm_accounting/cost-daily.json \
            --output-json out/llm_accounting_reconciliation_ci.json
      - name: Prompt fixture corpus regression gate
        run: python scripts/ci/check_prompt_fixture_regression.py --baseline docs/quality/prompt_fixture_corpus_baseline_2026-04-26.json --config src/config/app.yaml --iterations 3
      - name: Build release evidence manifest
        run: |
          COVERAGE_SCHEMA=$(python - <<'PY'
          import xml.etree.ElementTree as ET

          print(ET.parse("coverage.xml").getroot().attrib.get("version", ""))
          PY
          )
          python scripts/quality/release_evidence_manifest.py \
            --release-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --artifact coverage=coverage.xml \
            --expected-schema coverage="${COVERAGE_SCHEMA}" \
            --artifact mutation=mutation_results.json \
            --expected-schema mutation=1.0 \
            --artifact pdf_candidate=out/pdf_candidate_benchmark_ci.json \
            --expected-schema pdf_candidate=1.0 \
            --artifact pdf_crop_refine=out/pdf_crop_refine_benchmark_ci.json \
            --expected-schema pdf_crop_refine=1.0 \
            --artifact pdf_trends=out/pdf_benchmark_trends_ci.json \
            --expected-schema pdf_trends=1.0 \
            --artifact public_report_quality=out/public_report_quality_ci.json \
            --expected-schema public_report_quality=1.0 \
            --artifact health_scorecard=out/run_health_scorecard_ci.json \
            --expected-schema health_scorecard=1.0 \
            --artifact llm_accounting_reconciliation=out/llm_accounting_reconciliation_ci.json \
            --expected-schema llm_accounting_reconciliation=1.0 \
            --artifact-command coverage="python scripts/ci/check_coverage.py --coverage-xml coverage.xml" \
            --artifact-command mutation="python scripts/ci/run_mutation_gate.py --json-out mutation_results.json" \
            --artifact-command pdf_candidate="python scripts/ci/check_pdf_candidate_benchmark.py --baseline docs/quality/pdf_candidate_extraction_benchmark_baseline.json --output-json out/pdf_candidate_benchmark_ci.json" \
            --artifact-command pdf_crop_refine="python scripts/ci/check_pdf_crop_refine_benchmark.py --baseline docs/quality/pdf_crop_refine_benchmark_baseline.json --output-json out/pdf_crop_refine_benchmark_ci.json" \
            --artifact-command pdf_trends="python scripts/ci/check_pdf_benchmark_trends.py --candidate-json out/pdf_candidate_benchmark_ci.json --crop-refine-json out/pdf_crop_refine_benchmark_ci.json --history-json out/pdf_benchmark_trend_history_ci.json --output-json out/pdf_benchmark_trends_ci.json --update-history --allow-missing-inputs" \
            --artifact-command public_report_quality="python scripts/ci/check_public_report_quality.py --minimum-reports 15 --output-dir out/public_report_quality_ci --output-json out/public_report_quality_ci.json" \
            --artifact-command health_scorecard="python scripts/quality/run_health_scorecard.py out/ci_health_events.jsonl --run-id ci-release-evidence --output-json out/run_health_scorecard_ci.json" \
            --artifact-command llm_accounting_reconciliation="python scripts/quality/reconcile_llm_usage_ledger.py --db out/ci_llm_accounting/usage.sqlite --ledger out/ci_llm_accounting/cost-ledger.jsonl --daily out/ci_llm_accounting/cost-daily.json --output-json out/llm_accounting_reconciliation_ci.json" \
            --fresh-after "${RELEASE_EVIDENCE_STARTED_AT}" \
            --require-head-commit \
            --allow-issues \
            --output-json out/release_evidence_manifest_ci.json
      - name: Build release evidence review
        run: |
          python scripts/quality/release_evidence_review.py \
            --manifest-json out/release_evidence_manifest_ci.json \
            --waivers-yaml docs/quality/release_evidence_waivers.yaml \
            --output-json out/release_evidence_review_ci.json \
            --output-md out/release_evidence_review_ci.md
      - name: Upload release evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-bundle
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/release_evidence_manifest_ci.json
            out/release_evidence_review_ci.json
            out/release_evidence_review_ci.md
            docs/quality/release_evidence_waivers.yaml
            out/wordpress_entity_rest_verification_staging.json
            coverage.xml
            mutation_results.json
            out/pdf_candidate_benchmark_ci.json
            out/pdf_crop_refine_benchmark_ci.json
            out/pdf_benchmark_trends_ci.json
            out/public_report_quality_ci.json
            out/run_health_scorecard_ci.json
            out/llm_accounting_reconciliation_ci.json
