schema_version: "1.0"
resources:
  - resource_type: llm_provider
    operation: openai_chat
    callsite: src/services/_llm_service/openai_shared.py
    scope: run, UTC-day, publisher
    forecast_source: canonical historical median or unavailable zero-cost forecast
    preflight_gate: evaluate_budget_request before provider client invocation
    reservation_used: stable spend_reservation_key
    actual_usage_source: OpenAI response usage and request identifier
    reconciliation_path: canonical provider usage event reconciles reservation
    idempotency_source: provider event key plus reservation key
    blocking_outcomes: defer, pause, stop
    test_reference: tests/test_budget_authority.py
    status: covered
