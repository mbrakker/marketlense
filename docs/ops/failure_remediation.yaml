schema_version: "1.0"
last_drill_date: "2026-04-25"
owner: "operations"
runbooks:
  - failure_code: "taxonomy_invalid_json"
    owner: "report_generation"
    severity: "warning"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=remediation_failure_recorded"
    alert_labels:
      stage: "taxonomy"
      family: "report_taxonomy"
    detector_log_events:
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "bounded_taxonomy_checkpoint_recovery"
        trigger: "feature_gated_automatic"
        dry_run: true
        command: "python -m src.cli remediation-reap"
        safety: "Requires the retained selection checkpoint, source/analysis PDFs, vector-store reference, lineage proof, and one bounded attempt."
  - failure_code: "taxonomy_schema_invalid"
    owner: "report_generation"
    severity: "warning"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=remediation_failure_recorded"
    alert_labels:
      stage: "taxonomy"
      family: "report_taxonomy"
    detector_log_events:
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "bounded_taxonomy_schema_recovery"
        trigger: "feature_gated_automatic"
        dry_run: true
        command: "python -m src.cli remediation-reap"
        safety: "Requires the retained selection checkpoint, source/analysis PDFs, vector-store reference, lineage proof, and one bounded attempt."
  - failure_code: "category_fit_contradiction"
    owner: "report_generation"
    severity: "warning"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=remediation_failure_recorded"
    alert_labels:
      stage: "category_fit"
      family: "context_category_fit"
    detector_log_events:
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "bounded_category_fit_checkpoint_recovery"
        trigger: "feature_gated_automatic"
        dry_run: true
        command: "python -m src.cli remediation-reap"
        safety: "Requires retained source/analysis PDFs, vector-store reference, selection lineage, and one bounded attempt."
  - failure_code: "unsupported_material_claim"
    owner: "report_generation"
    severity: "error"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=remediation_failure_recorded"
    alert_labels:
      stage: "editorial_validation"
      family: "insights_final"
    detector_log_events:
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "bounded_material_claim_family_recovery"
        trigger: "feature_gated_automatic"
        dry_run: true
        command: "python -m src.cli remediation-reap"
        safety: "Requires an analysis checkpoint with independently materialized insight and validation lineage; only the affected family may call a model."
  - failure_code: "final_html_internal_identifier"
    owner: "report_generation"
    severity: "error"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=remediation_failure_recorded"
    alert_labels:
      stage: "render"
      family: "rendered_html"
    detector_log_events:
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "bounded_html_render_recovery"
        trigger: "feature_gated_automatic"
        dry_run: true
        command: "python -m src.cli remediation-reap"
        safety: "Requires validated analysis/artifact/validation lineage; rerenders and revalidates without source, vector, or model work."
  - failure_code: "missing_report_card_manifest"
    owner: "report_generation"
    severity: "error"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=remediation_failure_recorded"
    alert_labels:
      stage: "report_cards"
      family: "rendered_html"
    detector_log_events:
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "bounded_report_card_manifest_recovery"
        trigger: "feature_gated_automatic"
        dry_run: true
        command: "python -m src.cli remediation-reap"
        safety: "Requires validated analysis/artifact/validation lineage; rebuilds card assets and manifest without a source or model replay."
  - failure_code: "wordpress_readback_failed"
    owner: "publishing"
    severity: "warning"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=wp_post_lookup_start"
    alert_labels:
      stage: "wordpress_readback"
      family: "publication"
    detector_log_events:
      - "wp_post_lookup_start"
    remediation_hooks:
      - name: "bounded_wordpress_readback_reconciliation"
        trigger: "feature_gated_automatic"
        dry_run: true
        command: "python -m src.cli remediation-reap"
        safety: "Requires publication-preflight and idempotency proof; performs only an authenticated GET lookup and never writes WordPress."
  - failure_code: "pdf_text_unextractable"
    owner: "pipeline"
    severity: "warning"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=text_extractability_failed"
    alert_labels:
      stage: "ingest"
      family: "pdf_text"
    detector_log_events:
      - "text_extractability_failed"
    remediation_hooks:
      - name: "rerun_single_ingest_with_ocr_policy_check"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli ingest --limit 1"
        safety: "Requires operator to verify OCR fallback policy and source PDF identity before execution."
  - failure_code: "pdf_text_ocr_failed"
    owner: "pipeline"
    severity: "error"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=pdf_text_ocr_failed"
    alert_labels:
      stage: "ingest"
      family: "ocr"
    detector_log_events:
      - "pdf_text_ocr_failed"
      - "ocr_fallback_triggered"
    remediation_hooks:
      - name: "rerun_single_ingest_after_ocr_timeout_review"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli ingest --limit 1"
        safety: "Requires timeout and prompt namespace verification before execution."
  - failure_code: "browser_download_timeout"
    owner: "acquisition"
    severity: "warning"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=browser_report_download_failed"
    alert_labels:
      stage: "acquisition"
      family: "browser_download"
    detector_log_events:
      - "browser_report_download_failed"
      - "browser_report_download_timeout_recovery_timed_out"
    remediation_hooks:
      - name: "audit_one_acquisition_path"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli audit-acquisition-paths --publisher-limit 1 --candidate-limit-per-publisher 1"
        safety: "Runs a bounded acquisition audit instead of broad browser retry."
  - failure_code: "publisher_inventory_http_empty"
    owner: "acquisition"
    severity: "warning"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=publisher_inventory_http_empty"
    alert_labels:
      stage: "publisher_inventory"
      family: "http_parse"
    detector_log_events:
      - "publisher_inventory_http_empty"
    remediation_hooks:
      - name: "run_single_publisher_browser_discovery"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli discover-publisher-inventory \"https://example.com/insights\""
        safety: "Replace the example URL with the affected publisher insights URL before execution."
  - failure_code: "provider_timeout"
    owner: "pipeline"
    severity: "warning"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=remediation_failure_recorded"
    alert_labels:
      stage: "report_generation"
      family: "provider"
    detector_log_events:
      - "report_pipeline_failed"
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "verify_checkpoint_before_targeted_resume"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli plan repair report"
        safety: "Verify the checkpoint checksum, lineage, and current budget before any resume."
  - failure_code: "mail_report_not_arrived_yet"
    owner: "acquisition"
    severity: "warning"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=mail_report_poll_not_arrived"
    alert_labels:
      stage: "mailbox_poll"
      family: "mailbox"
    detector_log_events:
      - "mail_report_poll_not_arrived"
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "inspect_single_mail_delivery_request"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli plan acquire report"
        safety: "Confirm the intended mailbox and source identity before another poll."
  - failure_code: "claim_embedding_provider_count_mismatch"
    owner: "analytics"
    severity: "error"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=claim_embedding_workflow_complete"
    alert_labels:
      stage: "claim_embedding"
      family: "embedding"
    detector_log_events:
      - "claim_embedding_workflow_complete"
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "inspect_one_claim_embedding_queue_item"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli embedding-queue-run --dry-run --max-rows 1"
        safety: "Confirm the deterministic claim key and prior queue state before another provider call."
  - failure_code: "openai_request_failed"
    owner: "pipeline"
    severity: "error"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=remediation_failure_recorded"
    alert_labels:
      stage: "report_generation"
      family: "provider_request"
    detector_log_events:
      - "report_pipeline_failed"
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "verify_provider_failure_before_targeted_resume"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli plan repair report"
        safety: "Keep the record operator-held until the provider error, checkpoint lineage, and idempotency evidence are reviewed."
  - failure_code: "publisher_inventory_browser_timeout"
    owner: "acquisition"
    severity: "warning"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=publisher_inventory_browser_timeout"
    alert_labels:
      stage: "publisher_inventory"
      family: "browser_discovery"
    detector_log_events:
      - "publisher_inventory_browser_timeout"
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "audit_one_publisher_inventory_route"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli discover-publisher-inventory \"https://example.com/insights\""
        safety: "Replace the example URL only after verifying the affected publisher and browser evidence; do not replay a prior write."
  - failure_code: "report_pipeline_checkpoint_lineage_not_reusable"
    owner: "pipeline"
    severity: "error"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=report_pipeline_checkpoint_artifact_validation_complete"
    alert_labels:
      stage: "report_generation"
      family: "checkpoint_lineage"
    detector_log_events:
      - "report_pipeline_checkpoint_artifact_validation_complete"
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "inspect_checkpoint_lineage_before_new_run"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli plan repair report"
        safety: "Do not resume automatically; reconcile the retained artifact checksum and lineage before creating a new run."
  - failure_code: "report_pipeline_outcome_error"
    owner: "pipeline"
    severity: "error"
    runbook_path: "docs/ops/top_failure_runbooks.md"
    dashboard_link: "local://logs?event=report_pipeline_failed"
    alert_labels:
      stage: "report_generation"
      family: "workflow_outcome"
    detector_log_events:
      - "report_pipeline_failed"
      - "remediation_failure_recorded"
    remediation_hooks:
      - name: "inspect_report_outcome_before_retry_decision"
        trigger: "operator_approved"
        dry_run: true
        command: "python -m src.cli plan repair report"
        safety: "Keep the outcome operator-held until checkpoint, budget, and committed-side-effect evidence are reconciled."
automatic_execution:
  execution_enabled: false
  activation_gate: "Retained read-only soak evidence must show no duplicate records, no unexplained eligible records, no stale leases, and no missing runbook mappings before an operator reviews activation."
  allowlist:
    - workflow: "report_generation"
      failure_code: "provider_timeout"
      action: "resume_valid_checkpoint"
    - workflow: "report_generation"
      failure_code: "provider_timeout"
      action: "retry_transient_service_call"
    - workflow: "report_download"
      failure_code: "browser_download_timeout"
      action: "retry_transient_service_call"
    - workflow: "mail_report_acquisition"
      failure_code: "mail_report_not_arrived_yet"
      action: "poll_mailbox_delivery"
    - workflow: "claim_embedding"
      failure_code: "claim_embedding_provider_count_mismatch"
      action: "retry_transient_service_call"
