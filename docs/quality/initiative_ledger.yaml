schema_version: "1.0"
review:
  cadence: "monthly"
  owner: "quality"
  agenda_path: "docs/quality/monthly_quality_review.md"
  next_review_date: "2026-05-25"
initiatives:
  - id: "ocr-confidence-gating"
    title: "OCR confidence gating"
    owner: "pipeline"
    status: "active"
    review_date: "2026-05-25"
    baseline_metric: "OCR fallback only triggers after native extractability failure."
    current_metric: "Native extractability and density checks are logged before OCR fallback."
    target_metric: "OCR calls happen only when native text confidence or explicit policy requires fallback."
    decision: "continue"
  - id: "side-effect-idempotency"
    title: "Idempotency checksum per side-effecting orchestrator step"
    owner: "orchestration"
    status: "active"
    review_date: "2026-05-25"
    baseline_metric: "State and publish records prevent some duplicates but do not expose a shared checksum contract."
    current_metric: "Publish state uses file id and post type to avoid duplicate WordPress publishes."
    target_metric: "Each side-effecting step records idempotency key, checksum, outcome, and artifact references."
    decision: "continue"
  - id: "spend-guardrails"
    title: "Real-time spend guardrails"
    owner: "cost"
    status: "active"
    review_date: "2026-05-25"
    baseline_metric: "Cost ledger and rollups report spend after model calls complete."
    current_metric: "Cost reporting exposes date, run, task, and top-step totals."
    target_metric: "Run/day/publisher thresholds warn, pause, stop, or require override before expensive calls."
    decision: "continue"
  - id: "prompt-dry-run-validation"
    title: "Prompt dry-run validation"
    owner: "llm"
    status: "active"
    review_date: "2026-05-25"
    baseline_metric: "Prompt service validates namespace loads and strict Jinja variables during render."
    current_metric: "Prompt namespaces are cached with mtime invalidation and log paths plus hashes."
    target_metric: "Every active prompt namespace renders against fixture inputs in CI."
    decision: "continue"
  - id: "performance-cost-regression"
    title: "Performance and cost regression baseline"
    owner: "quality"
    status: "active"
    review_date: "2026-05-25"
    baseline_metric: "Quality regression gate tracks coverage, mutation, docpack, and candidate corpus metrics."
    current_metric: "CI runs the committed quality regression gate against docs/quality/baseline_2026-02-21.json."
    target_metric: "Fixture corpus reports runtime, tokens, OCR calls, browser attempts, and cost deltas."
    decision: "continue"
  - id: "repository-hygiene"
    title: "Repository artifact and secret hygiene"
    owner: "quality"
    status: "completed"
    review_date: "2026-05-25"
    baseline_metric: "Tracked tmp artifacts existed despite ignore rules."
    current_metric: "Repository hygiene gate rejects tracked temp, credential, coverage, log, cache, and oversized generated files."
    target_metric: "CI and local gate remain clean with only explicit time-bounded allowlist exceptions."
    decision: "completed"
